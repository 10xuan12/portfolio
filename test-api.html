<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 測試</title>
</head>
<body>
    <h1>API 測試頁面</h1>
    
    <h2>測試 API 路由</h2>
    <button onclick="testAPI()">測試 API</button>
    <button onclick="testStudentAuth()">測試學生認證 API</button>
    
    <div id="result"></div>
    
    <script>
        async function testAPI() {
            try {
                const response = await fetch('/api/');
                const result = await response.json();
                document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(result, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('result').innerHTML = '<p style="color: red;">錯誤: ' + error.message + '</p>';
            }
        }
        
        async function testStudentAuth() {
            try {
                const response = await fetch('/api/student/auth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        action: 'register',
                        username: 'test@example.com',
                        email: 'test@example.com',
                        password: '12345678',
                        first_name: '測試',
                        last_name: '用戶'
                    })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    document.getElementById('result').innerHTML = '<pre style="color: green;">成功: ' + JSON.stringify(result, null, 2) + '</pre>';
                } else {
                    const errorText = await response.text();
                    document.getElementById('result').innerHTML = '<pre style="color: red;">錯誤 (HTTP ' + response.status + '): ' + errorText + '</pre>';
                }
            } catch (error) {
                document.getElementById('result').innerHTML = '<p style="color: red;">錯誤: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
