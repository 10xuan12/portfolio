<!-- resume_form.html -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>AI 履歷產生器</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h2>AI 履歷產生器</h2>
    <form id="resumeForm" class="mt-3">
      <div class="mb-3">
        <label for="language" class="form-label">履歷語言</label>
        <select id="language" name="language" class="form-select" required>
          <option value="中文">中文</option>
          <option value="英文">英文</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="position" class="form-label">應徵職位</label>
        <input type="text" id="position" name="position" class="form-control" placeholder="例如：前端工程師" required>
      </div>
      <button type="submit" class="btn btn-primary">產生履歷並下載 PDF</button>
    </form>
    <div id="status" class="mt-3 text-info"></div>
  </div>

  <script src="../js/resume_scripts.js"></script>
</body>
</html>
