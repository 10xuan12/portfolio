<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理審核</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
    }
    /* ✅ 固定左側欄 */
    .sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 100px;
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 1rem;
    }

    .sidebar-item {
      text-align: center;
      padding: 1rem;
      width: 100%;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }

    /* 側邊欄選中狀態（目前頁面） */
    .sidebar-item.selected {
      background-color: #d8dae1;
      color: rgb(71, 45, 71);
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.3);
      transform: none;
      border: none;
      width: 100%;
      box-sizing: border-box;
      border-radius: 4px;
    }
    .main {
      margin-left: 100px;
      flex: 1;
      padding: 1rem 2rem;
    }
    .banner {
      background: #dbeafe;
      padding: 0.5rem;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      box-sizing: border-box;
    }
    .banner span {
      display: inline-block;
      padding-left: 100%;
      animation: scroll 10s linear infinite;
    }
    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
    .card {
      background: #f9f9f9;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 8px;
    }
    .flex-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .announcement-list li {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }
    .announcement-controls {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    button {
      padding: 0.4rem 1rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .add-btn { background: #3b82f6; color: white; }
    .del-btn { background: #ef4444; color: white; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }
    .container {
      margin-left: 100px;
      padding: 20px;
    }
    .switch-buttons button {
      margin-right: 10px;
      padding: 10px 20px;
      border: none;
      background-color: #d0dbe8;
      border-radius: 6px;
      cursor: pointer;
    }
    .switch-buttons .active {
      background-color: #8ea8d2;
      color: white;
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      width: 200px;
      background-color: white;
      border-radius: 6px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      padding: 10px;
    }
    .card img {
      width: 100%;
      height: 120px;
      background-color: #eee;
      margin-bottom: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #ccc;
      text-align: left;
    }
    th {
      background-color: #c3d4f0;
    }
    /* 分頁控制區域 */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
      padding: 20px;
    }

    .pagination button {
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      color: #374151;
      transition: all 0.2s ease;
    }

    .pagination button:hover {
      background: #f3f4f6;
      border-color: #9ca3af;
    }

    .pagination button.active {
      background: #3b82f6;
      color: white;
      border-color: #3b82f6;
    }

    .pagination .page-info {
      margin: 0 16px;
      color: #6b7280;
      font-size: 14px;
    }

    

  </style>
</head>
<body>
  <!-- 側邊欄 -->
  <div class="sidebar">
    <a href="index.html" class="sidebar-item">🏠<br>主頁</a>
    <a href="admin-accounts.html" class="sidebar-item">🧑‍💼<br>帳號管理</a>
    <a href="admin-works.html" class="sidebar-item selected">📁<br>管理審核</a>
    <a href="admin-notifications.html" class="sidebar-item">🔔<br>通知</a>
    <a href="admin-settings.html" class="sidebar-item">⚙️<br>設定</a>
    <div class="sidebar-item">↩️<br>登出</div>
  </div>


  <div class="container">
    <div class="switch-buttons">
      <button class="active" onclick="switchTab('作品')">作品</button>
      <button onclick="switchTab('職缺')">職缺</button>
    </div>

    <!-- 作品區 -->
    <div id="作品區" class="grid">
      <a href="admin-review-detail.html" style="text-decoration:none; color:inherit;">
        <div class="card">
          <img src="#" alt="">
          <strong>資訊</strong>
          <p>作品簡介文字...</p>
        </div>
      </a>
      <div class="card">
        <img src="#" alt="">
        <strong>SDGs</strong>
        <p>作品簡介文字...</p>
      </div>
      <!-- 更多作品卡片... -->
    </div>

    <!-- 職缺區 -->
    <div id="職缺區" style="display: none;">
      <table>
        <thead>
          <tr>
            <th>職缺 ID</th>
            <th>職缺</th>
            <th>公司名稱</th>
            <th>說明</th>
            <th>狀態</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>101234</td>
            <td>前端工程師</td>
            <td>ABC科技</td>
            <td>123456asdfghj</td>
            <td>待審核</td>
            <td><span class="dots" onclick="alert('操作')">⋮</span></td>
          </tr>
          <!-- 更多職缺... -->
        </tbody>
      </table>
    </div>

    <!-- 分頁控制 -->
    <div class="pagination">
      <button onclick="goToPage(1)">第一頁</button>
      <button onclick="goToPreviousPage()">‹ 上一頁</button>

      <button class="active" onclick="goToPage(1)">1</button>
      <button onclick="goToPage(2)">2</button>
      <button onclick="goToPage(3)">3</button>
      <button onclick="goToPage(4)">4</button>

      <span class="page-info">...</span>

      <button onclick="goToPage(7)">7</button>
      <button onclick="goToPage(8)">8</button>

      <button onclick="goToNextPage()">下一頁 ›</button>
      <button onclick="goToPage(8)">最後一頁</button>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelector('#作品區').style.display = tab === '作品' ? 'flex' : 'none';
      document.querySelector('#職缺區').style.display = tab === '職缺' ? 'block' : 'none';
      const buttons = document.querySelectorAll('.switch-buttons button');
      buttons.forEach(btn => btn.classList.remove('active'));
      buttons.forEach(btn => {
        if (btn.innerText === tab) btn.classList.add('active');
      });
    }

    let currentPage = 1;
    const totalPages = 8;

    function goToPage(page) {
      if (page < 1 || page > totalPages) return;
      currentPage = page;
      console.log(`切換到第 ${page} 頁`);
      // 這裡你可以加載對應頁數的內容
    }

    function goToPreviousPage() {
      if (currentPage > 1) {
        goToPage(currentPage - 1);
      }
    }

    function goToNextPage() {
      if (currentPage < totalPages) {
        goToPage(currentPage + 1);
      }
    }

  </script>
</body>
</html>
