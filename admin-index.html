<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理員主頁</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- CSS 區域：畫面排版與樣式 -->
  <style>
    /* 頁面基礎設定 */
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex; /* 左右欄併排 */
    }

    /* 側邊欄設定 */
    .sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 100px;
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 1rem;
    }

    .sidebar-item {
      text-align: center;
      padding: 1rem;
      width: 100%;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }

    /* 側邊欄選中狀態（目前頁面） */
    .sidebar-item.selected {
      background-color: #d8dae1;
      color: rgb(71, 45, 71);
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.3);
      transform: none;
      border: none;
      width: 100%;
      box-sizing: border-box;
      border-radius: 4px;
    }
    /* 主區塊容器（右邊） */
    .main {
      margin-left: 100px;
      flex: 1;
      padding: 1rem 2rem;
    }

    /* 跑馬燈樣式區塊 */
    .banner {
      background: linear-gradient(90deg, #dbeafe, #bfdbfe);
      padding: 12px 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      box-sizing: border-box;
      border-radius: 8px;
      margin-bottom: 24px;
      border-left: 4px solid #3b82f6;
    }

    /* 跑馬燈動畫內容 */
    .banner span {
      display: inline-block;
      padding-left: 100%;
      animation: scroll 10s linear infinite;
    }

    /* 跑馬燈動畫設定 */
    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    /* 卡片樣式（例如：公告、在線人數） */
    .card {
      background: #f9f9f9;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 18px;
    }

    /* 公告列表 li 排版 */
    .announcement-list li {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      align-items: center;
    }

    .announcement-content {
      flex: 1;
      margin-right: 10px;
    }
    /* 公告項目樣式清楚一點 */
    .announcement-list li {
      background: #eef2ff;
      border-left: 4px solid #3b82f6;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }


    /* 按鈕樣式 */
    button {
      padding: 0.4rem 1rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    /* 新增公告按鈕樣式 */
    .add-btn { background: #3b82f6; color: white; }

    /* 刪除公告按鈕樣式 */
    .del-btn { background: #ef4444; color: white; }

    /* 彈窗遮罩樣式 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    /* 彈窗內容區塊樣式 */
    .modal-box {
      background: white;
      border-radius: 8px;
      width: 90%;
      max-width: 600px;
      max-height: 80vh;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
    }

    /* 彈窗標題欄 */
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid #e5e7eb;
      background: #f9fafb;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #6b7280;
      padding: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      background: #f3f4f6;
      border-radius: 4px;
    }

    /* 彈窗內容 */
    .modal-content {
      padding: 20px;
      flex: 1;
      overflow-y: auto;
    }

    /* 表單樣式 */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: #374151;
    }

    .form-label.required::after {
      content: ' *';
      color: #ef4444;
    }

    .form-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .form-input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    /* 工具欄樣式 */
    .toolbar {
      border: 1px solid #d1d5db;
      border-bottom: none;
      padding: 8px 12px;
      background: #f9fafb;
      border-radius: 4px 4px 0 0;
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .toolbar-btn {
      padding: 6px 8px;
      border: 1px solid #d1d5db;
      background: white;
      border-radius: 3px;
      cursor: pointer;
      font-size: 14px;
      min-width: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toolbar-btn:hover {
      background: #f3f4f6;
    }

    .toolbar-btn.active {
      background: #3b82f6;
      color: white;
      border-color: #3b82f6;
    }

    /* 編輯器樣式 */
    .editor {
      border: 1px solid #d1d5db;
      border-radius: 0 0 4px 4px;
      min-height: 200px;
      padding: 12px;
      background: white;
      font-size: 14px;
      line-height: 1.5;
      outline: none;
      overflow-y: auto;
    }

    .editor:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    /* 按鈕區域 */
    .modal-footer {
      padding: 16px 20px;
      border-top: 1px solid #e5e7eb;
      background: #f9fafb;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .btn-primary {
      background: #059669;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }

    .btn-primary:hover {
      background: #047857;
    }

    .btn-secondary {
      background: #6b7280;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }

    .btn-secondary:hover {
      background: #4b5563;
    }

  </style>
</head>

<body>
  <!--  左側欄：導覽列 -->
  <div class="sidebar">
    <a href="admin-index.html" class="sidebar-item selected">🏠<br>主頁</a>
    <a href="admin-accounts.html" class="sidebar-item">🧑‍💼<br>帳號管理</a>
    <a href="admin-works.html" class="sidebar-item">📁<br>管理審核</a>
    <a href="admin-notifications.html" class="sidebar-item">🔔<br>通知</a>
    <a href="admin-settings.html" class="sidebar-item">⚙️<br>設定</a>
    <div class="sidebar-item">↩️<br>登出</div>
  </div>

  <!--  主內容區塊 -->
  <div class="main">

    <!--  跑馬燈區：動態消息 -->
    <div class="banner">
      <span id="news-marquee">最新：000 上傳了新作品 待審核</span>
    </div>

    <!--  資訊卡片區塊（左右兩邊） -->
    <div>
      <!--  上卡片：在線人數 + 圖表 -->
      <div class="card">
        <h2>在線人數 <span id="online-count">52</span></h2>
        <canvas id="visitChart"></canvas>
      </div>

      <!--  下卡片：公告設定 -->
      <div class="card">
        <h2>公告設定</h2>
        <ul class="announcement-list" id="announcement-list"></ul>
        <div style="text-align: right;">
          <button class="add-btn" onclick="openModal()">新增公告</button>
        </div>
      </div>
    </div>
  </div>

  <!--  彈出視窗：新增公告 -->
  <div id="announcement-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">新增公告</h3>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      
      <div class="modal-content">
        <div class="form-group">
          <label class="form-label required">公告標題</label>
          <input type="text" id="modal-title" class="form-input" placeholder="請輸入公告標題">
        </div>

        <div class="form-group">
          <label class="form-label required">公告內容</label>
          
          <!-- 工具欄 -->
          <div class="toolbar">
            <button type="button" class="toolbar-btn" onclick="formatText('bold')" title="粗體"><strong>B</strong></button>
            <button type="button" class="toolbar-btn" onclick="formatText('italic')" title="斜體"><em>I</em></button>
            <button type="button" class="toolbar-btn" onclick="formatText('underline')" title="底線"><u>U</u></button>
            <button type="button" class="toolbar-btn" onclick="formatText('strikeThrough')" title="刪除線"><s>S</s></button>
            <button type="button" class="toolbar-btn" onclick="formatText('insertUnorderedList')" title="項目符號">•</button>
            <button type="button" class="toolbar-btn" onclick="formatText('insertOrderedList')" title="編號清單">1.</button>
            <button type="button" class="toolbar-btn" onclick="insertLink()" title="插入連結">🔗</button>
            <button type="button" class="toolbar-btn" onclick="formatText('removeFormat')" title="清除格式">—</button>
          </div>
          
          <!-- 編輯器 -->
          <div id="editor" class="editor" contenteditable="true" placeholder="請輸入公告內容..."></div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-primary" onclick="submitModal()">儲存</button>
        <button class="btn-secondary" onclick="closeModal()">取消</button>
      </div>
    </div>
  </div>

  <!--  JavaScript 控制邏輯 -->
  <script>
    //  跑馬燈內容模擬更新（每 8 秒變更一次）
    setInterval(() => {
      document.getElementById('news-marquee').innerText =
        `最新：${Math.floor(Math.random() * 1000)} 上傳了新作品 待審核`;
    }, 8000);

    //  在線人數模擬更新（每 5 秒變動）
    setInterval(() => {
      document.getElementById('online-count').innerText =
        Math.floor(Math.random() * 100);
    }, 5000);

    //  造訪人數圖表（Chart.js）
    const ctx = document.getElementById('visitChart').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['6/20', '6/21', '6/22', '6/23'],
        datasets: [
          { label: '學生', data: [50, 70, 90, 60], backgroundColor: 'rgba(59, 130, 246, 0.5)' },
          { label: '企業', data: [20, 30, 45, 40], backgroundColor: 'rgba(96, 165, 250, 0.5)' }
        ]
      },
      options: { scales: { y: { beginAtZero: true } } }
    });

    //  開啟公告 modal
    function openModal() {
      document.getElementById('announcement-modal').style.display = 'flex';
      document.getElementById('modal-title').value = '';
      document.getElementById('editor').innerHTML = '';
      document.getElementById('editor').focus();
    }

    //  關閉公告 modal
    function closeModal() {
      document.getElementById('announcement-modal').style.display = 'none';
    }

    //  格式化文字
    function formatText(command, value = null) {
      document.execCommand(command, false, value);
      document.getElementById('editor').focus();
    }

    //  插入連結
    function insertLink() {
      const url = prompt('請輸入連結網址：');
      if (url) {
        formatText('createLink', url);
      }
    }

    //  新增公告邏輯
    function submitModal() {
      const title = document.getElementById('modal-title').value.trim();
      const content = document.getElementById('editor').innerHTML.trim();

      if (!title) {
        alert('請輸入公告標題');
        return;
      }

      if (!content || content === '<br>') {
        alert('請輸入公告內容');
        return;
      }

      const li = document.createElement('li');
      li.innerHTML = `
        <div class="announcement-content">
          <div style="font-weight: bold; margin-bottom: 4px;">${title}</div>
          <div>${content}</div>
        </div>
        <button class="del-btn" onclick="deleteAnnouncement(this)">刪除</button>
      `;
      
      document.getElementById('announcement-list').appendChild(li);
      closeModal();
    }

    //  刪除公告項目
    function deleteAnnouncement(btn) {
      if (confirm('確定要刪除這個公告嗎？')) {
        btn.parentElement.remove();
      }
    }

    // 編輯器 placeholder 效果
    const editor = document.getElementById('editor');
    editor.addEventListener('focus', function() {
      if (this.innerHTML.trim() === '') {
        this.innerHTML = '';
      }
    });

    editor.addEventListener('blur', function() {
      if (this.innerHTML.trim() === '') {
        this.innerHTML = '';
      }
    });

    // 防止直接貼上帶格式的內容
    editor.addEventListener('paste', function(e) {
      e.preventDefault();
      const text = (e.originalEvent || e).clipboardData.getData('text/plain');
      document.execCommand('insertText', false, text);
    });
  </script>
</body>
</html>
