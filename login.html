<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio+ - 登入</title>
    <link rel="stylesheet" href="css/unified-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slide-in {
            from { opacity: 0; transform: translateX(60px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .animate-fade-in-up { 
            animation: fade-in-up 0.8s cubic-bezier(0.4,0,0.2,1) forwards; 
        }
        
        .animate-slide-in { 
            animation: slide-in 0.8s cubic-bezier(0.4,0,0.2,1) forwards; 
        }
        
        .animate-fade-in { 
            animation: fade-in 1.2s 0.5s both; 
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .login-page {
            background: none;
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            margin: 20px;
            position: relative;
            overflow: hidden;
        }
        
        /* 標籤切換 */
        .tab-switch {
            display: flex;
            justify-content: center;
            margin-bottom: 32px;
            border-bottom: 2px solid #e5e7eb;
            position: relative;
            gap: 2rem;
        }
        
        .tab-switch::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 2.5px;
            background: #e5e7eb;
            z-index: 0;
        }
        
        .tab-link {
            display: inline-block;
            padding: 16px 40px 8px 40px;
            font-size: 18px;
            font-weight: 600;
            color: #607ac2;
            border-bottom: 0 solid transparent;
            background: none;
            text-decoration: none;
            transition: color 0.2s, border-color 0.2s;
            position: relative;
            z-index: 1;
            cursor: pointer;
        }
        
        .tab-link.active {
            color: #3b5998;
            border-bottom: 3.5px solid #3b5998;
            background: none;
        }
        
        .tab-link:hover {
            color: #3b5998;
        }
        
        /* 表單樣式 */
        .login-form {
            margin-top: 20px;
        }
        
        .form-group {
            margin-bottom: 24px;
            position: relative;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
            font-size: 14px;
        }
        
        .input-group {
            display: flex;
            align-items: center;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .input-group:focus-within {
            border-color: #607ac2;
            box-shadow: 0 0 0 3px rgba(96, 122, 194, 0.1);
        }
        
        .input-group-text {
            background: #f8f9fa;
            border: none;
            padding: 12px 16px;
            color: #6b7280;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 48px;
        }
        
        .form-control {
            flex: 1;
            border: none;
            padding: 12px 16px;
            font-size: 16px;
            background: transparent;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            outline: none;
        }
        
        .form-control.is-invalid {
            border-color: #dc3545;
        }
        
        .password-toggle {
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .password-toggle:hover {
            background: #f3f6fa;
        }
        
        .invalid-feedback {
            display: block;
            color: #dc3545;
            font-size: 12px;
            margin-top: 4px;
        }
        
        /* 記住我選項 */
        .form-check {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .form-check-input {
            margin-right: 8px;
            width: 16px;
            height: 16px;
            accent-color: #607ac2;
        }
        
        .form-check-label {
            font-size: 14px;
            color: #6b7280;
            cursor: pointer;
        }
        
        /* 錯誤訊息 */
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            border: none;
            margin-bottom: 16px;
            font-size: 14px;
            display: flex;
            align-items: center;
        }
        
        .alert-danger {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }
        
        /* 按鈕 */
        .btn {
            width: 100%;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #607ac2 0%, #3b5998 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(96, 122, 194, 0.4);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .spinner-border {
            width: 16px;
            height: 16px;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spinner-border 0.75s linear infinite;
        }
        
        @keyframes spinner-border {
            to { transform: rotate(360deg); }
        }
        
        /* 底部文字 */
        .footer-text {
            text-align: center;
            margin-top: 24px;
            color: #607ac2;
            font-size: 14px;
        }
        
        .footer-text a {
            color: #607ac2;
            font-weight: 600;
            text-decoration: underline;
        }
        
        .footer-text a:hover {
            color: #3b5998;
        }
        
        /* 響應式設計 */
        @media (max-width: 768px) {
            .login-container {
                margin: 10px;
                padding: 24px;
                border-radius: 16px;
            }
            
            .tab-link {
                padding: 12px 24px 6px 24px;
                font-size: 16px;
            }
            
            .form-control {
                font-size: 16px; /* 防止 iOS 縮放 */
            }
        }
        
        /* 載入動畫 */
        .loading {
            opacity: 0.7;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="login-page animate-fade-in-up">
        <div class="login-container animate-slide-in">
            <!-- 頂部標籤切換 -->
            <div class="tab-switch">
                <a href="login.html" class="tab-link active">登入</a>
                <a href="register.html" class="tab-link">註冊</a>
            </div>
            
            <!-- 登入表單 -->
            <form id="loginForm" action="login.php" method="POST" class="login-form">
                <!-- 電子郵件 -->
                <div class="form-group">
                    <label for="email" class="form-label">電子郵件</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-envelope" style="color:#000"></i>
                        </span>
                        <input
                            id="email"
                            name="email"
                            type="email"
                            class="form-control"
                            placeholder="請輸入電子郵件"
                            required
                        >
                    </div>
                    <div id="email-error" class="invalid-feedback" style="display: none;"></div>
                </div>
                
                <!-- 密碼 -->
                <div class="form-group">
                    <label for="password" class="form-label">密碼</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input
                            id="password"
                            name="password"
                            type="password"
                            class="form-control"
                            placeholder="請輸入密碼"
                            required
                        >
                        <span class="input-group-text password-toggle" onclick="togglePassword()">
                            <i class="fas fa-eye" id="password-icon"></i>
                        </span>
                    </div>
                    <div id="password-error" class="invalid-feedback" style="display: none;"></div>
                </div>
                
                <!-- 角色選擇 -->
                <div class="form-group">
                    <label for="role" class="form-label">選擇身分</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-users"></i>
                        </span>
                        <select id="role" name="role" class="form-control" required>
                            <option value="">請選擇身分</option>
                            <option value="student">👩‍💻 學生</option>
                            <option value="admin">👩‍🔧 管理員</option>
                            <option value="company">🏢 企業</option>
                        </select>
                    </div>
                    <div id="role-error" class="invalid-feedback" style="display: none;"></div>
                </div>
                
                <!-- 記住我 -->
                <div class="form-check">
                    <input
                        id="remember"
                        name="remember"
                        type="checkbox"
                        class="form-check-input"
                    >
                    <label class="form-check-label" for="remember">
                        記住我
                    </label>
                </div>
                
                <!-- 錯誤訊息 -->
                <div id="error-message" class="alert alert-danger" style="display: none;">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <span id="error-text"></span>
                </div>
                
                <!-- 登入按鈕 -->
                <button
                    type="submit"
                    class="btn btn-primary"
                    id="login-btn"
                >
                    <i class="fas fa-sign-in-alt"></i>
                    <span id="btn-text">登入</span>
                </button>
                
                <div class="footer-text">
                    還沒有帳號？<a href="register.html">立即註冊</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 表單驗證
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const roleSelect = document.getElementById('role');
        const loginBtn = document.getElementById('login-btn');
        const btnText = document.getElementById('btn-text');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        
        // 錯誤訊息物件
        const errors = {
            email: '',
            password: '',
            role: ''
        };
        
        // 顯示錯誤訊息
        function showError(field, message) {
            const errorElement = document.getElementById(field + '-error');
            const inputElement = document.getElementById(field);
            
            if (errorElement && inputElement) {
                errorElement.textContent = message;
                errorElement.style.display = 'block';
                inputElement.classList.add('is-invalid');
            }
        }
        
        // 清除錯誤訊息
        function clearError(field) {
            const errorElement = document.getElementById(field + '-error');
            const inputElement = document.getElementById(field);
            
            if (errorElement && inputElement) {
                errorElement.style.display = 'none';
                inputElement.classList.remove('is-invalid');
            }
        }
        
        // 清除所有錯誤訊息
        function clearAllErrors() {
            clearError('email');
            clearError('password');
            clearError('role');
            errorMessage.style.display = 'none';
        }
        
        // 表單驗證
        function validateForm() {
            clearAllErrors();
            let isValid = true;
            
            // 驗證電子郵件
            if (!emailInput.value.trim()) {
                showError('email', '請輸入電子郵件');
                isValid = false;
            } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value.trim())) {
                showError('email', '請輸入有效的電子郵件格式');
                isValid = false;
            }
            
            // 驗證密碼
            if (!passwordInput.value) {
                showError('password', '請輸入密碼');
                isValid = false;
            } else if (passwordInput.value.length < 6) {
                showError('password', '密碼至少需要 6 個字元');
                isValid = false;
            }
            
            // 驗證角色選擇
            if (!roleSelect.value) {
                showError('role', '請選擇身分');
                isValid = false;
            }
            
            return isValid;
        }
        
        // 切換密碼顯示
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('password-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                passwordIcon.className = 'fas fa-eye';
            }
        }
        
        // 處理登入
        async function handleLogin(e) {
            e.preventDefault();
            
            // 清除錯誤訊息
            clearAllErrors();
            
            // 驗證表單
            if (!validateForm()) {
                return;
            }
            
            // 顯示載入狀態
            loginBtn.disabled = true;
            loginBtn.classList.add('loading');
            btnText.textContent = '登入中...';
            
            try {
                // 創建 FormData
                const formData = new FormData(form);
                
                // 發送請求
                const response = await fetch('login.php', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.text();
                
                // 檢查是否有錯誤訊息
                if (result.includes('alert(')) {
                    // 提取錯誤訊息
                    const match = result.match(/alert\('([^']+)'/);
                    if (match) {
                        errorText.textContent = match[1];
                        errorMessage.style.display = 'flex';
                    }
                } else {
                    // 登入成功，重定向
                    window.location.href = getRedirectUrl();
                }
                
            } catch (error) {
                console.error('登入錯誤:', error);
                errorText.textContent = '登入時發生錯誤，請稍後再試';
                errorMessage.style.display = 'flex';
            } finally {
                // 恢復按鈕狀態
                loginBtn.disabled = false;
                loginBtn.classList.remove('loading');
                btnText.textContent = '登入';
            }
        }
        
        // 根據角色獲取重定向 URL
        function getRedirectUrl() {
            const role = roleSelect.value;
            switch (role) {
                case 'student':
                    return 'student/student_dashboard_view.php';
                case 'admin':
                    return 'admin/admin_dashboard.php';
                case 'company':
                    return 'enterprise/enterprise_dashboard.php';
                default:
                    return '/';
            }
        }
        
        // 監聽表單變更，清除錯誤訊息
        [emailInput, passwordInput, roleSelect].forEach(element => {
            element.addEventListener('input', () => {
                if (errorMessage.style.display !== 'none') {
                    clearAllErrors();
                }
            });
        });
        
        // 表單提交事件
        form.addEventListener('submit', handleLogin);
        
        // 頁面載入動畫
        document.addEventListener('DOMContentLoaded', function() {
            const style = document.createElement('style');
            style.textContent = `
                @keyframes fade-in-up {
                    from { opacity: 0; transform: translateY(30px); }
                    to { opacity: 1; transform: translateY(0); }
                }
                .animate-fade-in-up { animation: fade-in-up 0.8s cubic-bezier(0.4,0,0.2,1) forwards; }
            `;
            document.head.appendChild(style);
        });
    </script>
</body>
</html>
