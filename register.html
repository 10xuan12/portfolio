<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio+ - 註冊</title>
    <link rel="stylesheet" href="css/unified-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slide-in {
            from { opacity: 0; transform: translateX(60px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .animate-fade-in-up { 
            animation: fade-in-up 0.8s cubic-bezier(0.4,0,0.2,1) forwards; 
        }
        
        .animate-slide-in { 
            animation: slide-in 0.8s cubic-bezier(0.4,0,0.2,1) forwards; 
        }
        
        .animate-fade-in { 
            animation: fade-in 1.2s 0.5s both; 
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .register-page {
            background: none;
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .register-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            margin: 20px;
            position: relative;
            overflow: hidden;
        }
        
        /* 標籤切換 */
        .tab-switch {
            display: flex;
            justify-content: center;
            margin-bottom: 32px;
            border-bottom: 2px solid #e5e7eb;
            position: relative;
            gap: 2rem;
        }
        
        .tab-switch::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 2.5px;
            background: #e5e7eb;
            z-index: 0;
        }
        
        .tab-link {
            display: inline-block;
            padding: 16px 40px 8px 40px;
            font-size: 18px;
            font-weight: 600;
            color: #607ac2;
            border-bottom: 0 solid transparent;
            background: none;
            text-decoration: none;
            transition: color 0.2s, border-color 0.2s;
            position: relative;
            z-index: 1;
            cursor: pointer;
        }
        
        .tab-link.active {
            color: #3b5998;
            border-bottom: 3.5px solid #3b5998;
            background: none;
        }
        
        .tab-link:hover {
            color: #3b5998;
        }
        
        /* 表單樣式 */
        .register-form {
            margin-top: 20px;
        }
        
        .form-group {
            margin-bottom: 24px;
            position: relative;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
            font-size: 14px;
        }
        
        .input-group {
            display: flex;
            align-items: center;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .input-group:focus-within {
            border-color: #607ac2;
            box-shadow: 0 0 0 3px rgba(96, 122, 194, 0.1);
        }
        
        .input-group-text {
            background: #f8f9fa;
            border: none;
            padding: 12px 16px;
            color: #6b7280;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 48px;
        }
        
        .form-control {
            flex: 1;
            border: none;
            padding: 12px 16px;
            font-size: 16px;
            background: transparent;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            outline: none;
        }
        
        .form-control.is-invalid {
            border-color: #dc3545;
        }
        
        .password-toggle {
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .password-toggle:hover {
            background: #f3f6fa;
        }
        
        .invalid-feedback {
            display: block;
            color: #dc3545;
            font-size: 12px;
            margin-top: 4px;
        }
        
        /* 自定義下拉選單 */
        .custom-select {
            position: relative;
            width: 100%;
        }
        
        .custom-select-display {
            min-height: 42px;
            background: #fff;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
        }
        
        .custom-select-display:focus-within {
            border-color: #607ac2;
            box-shadow: 0 0 0 3px rgba(96, 122, 194, 0.1);
        }
        
        .custom-select-display.is-invalid {
            border-color: #dc3545;
        }
        
        .custom-select-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            z-index: 10;
            margin-top: 4px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
        
        .custom-select-dropdown.show {
            display: block;
        }
        
        .custom-select-option {
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
        }
        
        .custom-select-option:hover {
            background: #f3f6fa;
        }
        
        .custom-select-option.selected {
            background: #607ac2;
            color: white;
        }
        
        /* 記住我選項 */
        .form-check {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .form-check-input {
            margin-right: 8px;
            width: 16px;
            height: 16px;
            accent-color: #607ac2;
        }
        
        .form-check-label {
            font-size: 14px;
            color: #6b7280;
            cursor: pointer;
        }
        
        .form-check-label a {
            color: #607ac2;
            text-decoration: none;
        }
        
        .form-check-label a:hover {
            text-decoration: underline;
        }
        
        /* 錯誤訊息 */
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            border: none;
            margin-bottom: 16px;
            font-size: 14px;
            display: flex;
            align-items: center;
        }
        
        .alert-danger {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }
        
        /* 按鈕 */
        .btn {
            width: 100%;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #607ac2 0%, #3b5998 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(96, 122, 194, 0.4);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .spinner-border {
            width: 16px;
            height: 16px;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spinner-border 0.75s linear infinite;
        }
        
        @keyframes spinner-border {
            to { transform: rotate(360deg); }
        }
        
        /* 底部文字 */
        .footer-text {
            text-align: center;
            margin-top: 24px;
            color: #607ac2;
            font-size: 14px;
        }
        
        .footer-text a {
            color: #607ac2;
            font-weight: 600;
            text-decoration: underline;
        }
        
        .footer-text a:hover {
            color: #3b5998;
        }
        
        /* 響應式設計 */
        @media (max-width: 768px) {
            .register-container {
                margin: 10px;
                padding: 24px;
                border-radius: 16px;
            }
            
            .tab-link {
                padding: 12px 24px 6px 24px;
                font-size: 16px;
            }
            
            .form-control {
                font-size: 16px; /* 防止 iOS 縮放 */
            }
        }
        
        /* 載入動畫 */
        .loading {
            opacity: 0.7;
            pointer-events: none;
        }
        
        /* 角色選項樣式 */
        .role-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .role-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .role-student { background: #60a5fa; color: white; }
        .role-enterprise { background: #fbbf24; color: white; }
        .role-admin { background: #a855f7; color: white; }
    </style>
</head>
<body>
    <div class="register-page animate-fade-in-up">
        <div class="register-container animate-slide-in">
            <!-- 頂部標籤切換 -->
            <div class="tab-switch">
                <a href="login.html" class="tab-link">登入</a>
                <a href="register.html" class="tab-link active">註冊</a>
            </div>
            
            <!-- 註冊表單 -->
            <form id="registerForm" action="register.php" method="POST" class="register-form">
                <!-- 角色選擇 -->
                <div class="form-group">
                    <label for="role" class="form-label">選擇您的角色</label>
                    <div class="custom-select" id="roleSelect">
                        <div class="custom-select-display" id="roleDisplay">
                            <span id="roleText">請選擇角色</span>
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <div class="custom-select-dropdown" id="roleDropdown">
                            <div class="custom-select-option" data-value="student">
                                <div class="role-option">
                                    <span class="role-icon role-student">👩‍💻</span>
                                    <span>學生</span>
                                </div>
                            </div>
                            <div class="custom-select-option" data-value="enterprise">
                                <div class="role-option">
                                    <span class="role-icon role-enterprise">🏢</span>
                                    <span>企業</span>
                                </div>
                            </div>
                            <div class="custom-select-option" data-value="admin">
                                <div class="role-option">
                                    <span class="role-icon role-admin">👩‍🔧</span>
                                    <span>管理員</span>
                                </div>
                            </div>
                        </div>
                        <input type="hidden" id="role" name="role" required>
                    </div>
                    <div id="role-error" class="invalid-feedback" style="display: none;"></div>
                </div>
                
                <!-- 姓名 -->
                <div class="form-group">
                    <label for="name" class="form-label">姓名</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-user"></i>
                        </span>
                        <input
                            id="name"
                            name="name"
                            type="text"
                            class="form-control"
                            placeholder="請輸入姓名"
                            required
                        >
                    </div>
                    <div id="name-error" class="invalid-feedback" style="display: none;"></div>
                </div>
                
                <!-- 電子郵件 -->
                <div class="form-group">
                    <label for="email" class="form-label">電子郵件</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-envelope"></i>
                        </span>
                        <input
                            id="email"
                            name="email"
                            type="email"
                            class="form-control"
                            placeholder="請輸入電子郵件"
                            required
                        >
                    </div>
                    <div id="email-error" class="invalid-feedback" style="display: none;"></div>
                </div>
                
                <!-- 公司名稱 (僅企業) -->
                <div class="form-group" id="companyNameGroup" style="display: none;">
                    <label for="companyName" class="form-label">公司名稱</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-building"></i>
                        </span>
                        <input
                            id="companyName"
                            name="companyName"
                            type="text"
                            class="form-control"
                            placeholder="請輸入公司名稱"
                        >
                    </div>
                    <div id="companyName-error" class="invalid-feedback" style="display: none;"></div>
                </div>
                
                <!-- 管理員代碼 (僅管理員) -->
                <div class="form-group" id="adminCodeGroup" style="display: none;">
                    <label for="adminCode" class="form-label">管理員代碼</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-key"></i>
                        </span>
                        <input
                            id="adminCode"
                            name="adminCode"
                            type="text"
                            class="form-control"
                            placeholder="請輸入管理員代碼"
                        >
                    </div>
                    <div id="adminCode-error" class="invalid-feedback" style="display: none;"></div>
                </div>
                
                <!-- 密碼 -->
                <div class="form-group">
                    <label for="password" class="form-label">密碼</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input
                            id="password"
                            name="password"
                            type="password"
                            class="form-control"
                            placeholder="請輸入密碼"
                            required
                        >
                        <span class="input-group-text password-toggle" onclick="togglePassword('password')">
                            <i class="fas fa-eye" id="password-icon"></i>
                        </span>
                    </div>
                    <div id="password-error" class="invalid-feedback" style="display: none;"></div>
                    <small class="form-text text-muted">
                        密碼至少需要 8 個字元，包含字母和數字
                    </small>
                </div>
                
                <!-- 確認密碼 -->
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">確認密碼</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input
                            id="confirmPassword"
                            name="confirmPassword"
                            type="password"
                            class="form-control"
                            placeholder="請再次輸入密碼"
                            required
                        >
                        <span class="input-group-text password-toggle" onclick="togglePassword('confirmPassword')">
                            <i class="fas fa-eye" id="confirmPassword-icon"></i>
                        </span>
                    </div>
                    <div id="confirmPassword-error" class="invalid-feedback" style="display: none;"></div>
                </div>
                
                <!-- 同意條款 -->
                <div class="form-check">
                    <input
                        id="agree"
                        name="agree"
                        type="checkbox"
                        class="form-check-input"
                        required
                    >
                    <label class="form-check-label" for="agree">
                        我同意 <a href="#" class="text-decoration-none">服務條款</a> 和 
                        <a href="#" class="text-decoration-none">隱私政策</a>
                    </label>
                    <div id="agree-error" class="invalid-feedback" style="display: none;"></div>
                </div>
                
                <!-- 錯誤訊息 -->
                <div id="error-message" class="alert alert-danger" style="display: none;">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <span id="error-text"></span>
                </div>
                
                <!-- 註冊按鈕 -->
                <button
                    type="submit"
                    class="btn btn-primary"
                    id="register-btn"
                >
                    <i class="fas fa-user-plus"></i>
                    <span id="btn-text">註冊帳號</span>
                </button>
                
                <div class="footer-text">
                    已有帳號？<a href="login.html">立即登入</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 表單元素
        const form = document.getElementById('registerForm');
        const roleSelect = document.getElementById('roleSelect');
        const roleDisplay = document.getElementById('roleDisplay');
        const roleText = document.getElementById('roleText');
        const roleDropdown = document.getElementById('roleDropdown');
        const roleInput = document.getElementById('role');
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const companyNameGroup = document.getElementById('companyNameGroup');
        const companyNameInput = document.getElementById('companyName');
        const adminCodeGroup = document.getElementById('adminCodeGroup');
        const adminCodeInput = document.getElementById('adminCode');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const agreeInput = document.getElementById('agree');
        const registerBtn = document.getElementById('register-btn');
        const btnText = document.getElementById('btn-text');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        
        // 錯誤訊息物件
        const errors = {
            role: '',
            name: '',
            email: '',
            companyName: '',
            adminCode: '',
            password: '',
            confirmPassword: '',
            agree: ''
        };
        
        // 角色選項
        const roleOptions = [
            { value: 'student', label: '學生', icon: '👩‍💻' },
            { value: 'enterprise', label: '企業', icon: '🏢' },
            { value: 'admin', label: '管理員', icon: '👩‍🔧' }
        ];
        
        // 顯示錯誤訊息
        function showError(field, message) {
            const errorElement = document.getElementById(field + '-error');
            const inputElement = document.getElementById(field);
            
            if (errorElement && inputElement) {
                errorElement.textContent = message;
                errorElement.style.display = 'block';
                inputElement.classList.add('is-invalid');
            }
        }
        
        // 清除錯誤訊息
        function clearError(field) {
            const errorElement = document.getElementById(field + '-error');
            const inputElement = document.getElementById(field);
            
            if (errorElement && inputElement) {
                errorElement.style.display = 'none';
                inputElement.classList.remove('is-invalid');
            }
        }
        
        // 清除所有錯誤訊息
        function clearAllErrors() {
            clearError('role');
            clearError('name');
            clearError('email');
            clearError('companyName');
            clearError('adminCode');
            clearError('password');
            clearError('confirmPassword');
            clearError('agree');
            errorMessage.style.display = 'none';
        }
        
        // 切換密碼顯示
        function togglePassword(fieldId) {
            const passwordInput = document.getElementById(fieldId);
            const passwordIcon = document.getElementById(fieldId + '-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                passwordIcon.className = 'fas fa-eye';
            }
        }
        
        // 角色選擇邏輯
        roleDisplay.addEventListener('click', function() {
            roleDropdown.classList.toggle('show');
        });
        
        // 點擊外部關閉下拉選單
        document.addEventListener('click', function(e) {
            if (!roleSelect.contains(e.target)) {
                roleDropdown.classList.remove('show');
            }
        });
        
        // 選擇角色
        document.querySelectorAll('.custom-select-option').forEach(option => {
            option.addEventListener('click', function() {
                const value = this.getAttribute('data-value');
                const label = this.querySelector('span').textContent;
                const icon = this.querySelector('.role-icon').textContent;
                
                roleInput.value = value;
                roleText.innerHTML = `<span class="role-icon role-${value}">${icon}</span> <span>${label}</span>`;
                
                // 移除所有選中狀態
                document.querySelectorAll('.custom-select-option').forEach(opt => {
                    opt.classList.remove('selected');
                });
                
                // 添加選中狀態
                this.classList.add('selected');
                
                // 關閉下拉選單
                roleDropdown.classList.remove('show');
                
                // 根據角色顯示/隱藏額外欄位
                updateFormFields(value);
                
                // 清除錯誤訊息
                clearError('role');
            });
        });
        
        // 根據角色更新表單欄位
        function updateFormFields(role) {
            // 隱藏所有額外欄位
            companyNameGroup.style.display = 'none';
            adminCodeGroup.style.display = 'none';
            
            // 清除額外欄位的值
            companyNameInput.value = '';
            adminCodeInput.value = '';
            
            // 根據角色顯示相應欄位
            switch (role) {
                case 'enterprise':
                    companyNameGroup.style.display = 'block';
                    companyNameInput.required = true;
                    break;
                case 'admin':
                    adminCodeGroup.style.display = 'block';
                    adminCodeInput.required = true;
                    break;
                default:
                    companyNameInput.required = false;
                    adminCodeInput.required = false;
                    break;
            }
        }
        
        // 表單驗證
        function validateForm() {
            clearAllErrors();
            let isValid = true;
            
            // 驗證角色選擇
            if (!roleInput.value) {
                showError('role', '請選擇您的角色');
                isValid = false;
            }
            
            // 驗證姓名
            if (!nameInput.value.trim()) {
                showError('name', '請輸入姓名');
                isValid = false;
            }
            
            // 驗證電子郵件
            if (!emailInput.value) {
                showError('email', '請輸入電子郵件');
                isValid = false;
            } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value)) {
                showError('email', '請輸入有效的電子郵件格式');
                isValid = false;
            }
            
            // 驗證公司名稱 (企業)
            if (roleInput.value === 'enterprise' && !companyNameInput.value.trim()) {
                showError('companyName', '請輸入公司名稱');
                isValid = false;
            }
            
            // 驗證管理員代碼 (管理員)
            if (roleInput.value === 'admin' && !adminCodeInput.value.trim()) {
                showError('adminCode', '請輸入管理員代碼');
                isValid = false;
            }
            
            // 驗證密碼
            if (!passwordInput.value) {
                showError('password', '請輸入密碼');
                isValid = false;
            } else if (passwordInput.value.length < 8) {
                showError('password', '密碼至少需要 8 個字元');
                isValid = false;
            } else if (!/^(?=.*[A-Za-z])(?=.*\d)/.test(passwordInput.value)) {
                showError('password', '密碼必須包含字母和數字');
                isValid = false;
            }
            
            // 驗證確認密碼
            if (!confirmPasswordInput.value) {
                showError('confirmPassword', '請確認密碼');
                isValid = false;
            } else if (passwordInput.value !== confirmPasswordInput.value) {
                showError('confirmPassword', '密碼不一致');
                isValid = false;
            }
            
            // 驗證同意條款
            if (!agreeInput.checked) {
                showError('agree', '請同意服務條款和隱私政策');
                isValid = false;
            }
            
            return isValid;
        }
        
        // 處理註冊
        async function handleRegister(e) {
            e.preventDefault();
            
            // 清除錯誤訊息
            clearAllErrors();
            
            // 驗證表單
            if (!validateForm()) {
                return;
            }
            
            // 顯示載入狀態
            registerBtn.disabled = true;
            registerBtn.classList.add('loading');
            btnText.textContent = '註冊中...';
            
            try {
                // 創建 FormData
                const formData = new FormData(form);
                
                // 發送請求
                const response = await fetch('register.php', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    // 註冊成功，重定向到登入頁面
                    alert('註冊成功！請登入您的帳號。');
                    window.location.href = 'login.html';
                } else {
                    // 顯示錯誤訊息
                    errorText.textContent = result.message || '註冊失敗，請稍後再試';
                    errorMessage.style.display = 'flex';
                }
                
            } catch (error) {
                console.error('註冊錯誤:', error);
                errorText.textContent = '註冊時發生錯誤，請稍後再試';
                errorMessage.style.display = 'flex';
            } finally {
                // 恢復按鈕狀態
                registerBtn.disabled = false;
                registerBtn.classList.remove('loading');
                btnText.textContent = '註冊帳號';
            }
        }
        
        // 監聽表單變更，清除錯誤訊息
        [nameInput, emailInput, companyNameInput, adminCodeInput, passwordInput, confirmPasswordInput, agreeInput].forEach(element => {
            element.addEventListener('input', () => {
                if (errorMessage.style.display !== 'none') {
                    clearAllErrors();
                }
            });
        });
        
        // 表單提交事件
        form.addEventListener('submit', handleRegister);
        
        // 頁面載入動畫
        document.addEventListener('DOMContentLoaded', function() {
            const style = document.createElement('style');
            style.textContent = `
                @keyframes fade-in-up {
                    from { opacity: 0; transform: translateY(30px); }
                    to { opacity: 1; transform: translateY(0); }
                }
                .animate-fade-in-up { animation: fade-in-up 0.8s cubic-bezier(0.4,0,0.2,1) forwards; }
            `;
            document.head.appendChild(style);
        });
    </script>
</body>
</html>
