[phases.setup]
nixPkgs = ["php82", "php82Packages.composer"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader"]

[phases.build]
cmds = ["echo 'Build completed'"]

[start]
cmd = "php -d memory_limit=128M -d upload_max_filesize=10M -d post_max_size=10M -d max_execution_time=30 -S 0.0.0.0:$PORT -t . router.php"

