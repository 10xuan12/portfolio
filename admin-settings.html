<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理員設定</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f3f4f6;
    }

    /* ✅ 固定左側欄 */
    .sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 100px;
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 1rem;
    }

    .sidebar-item {
      text-align: center;
      padding: 1rem;
      width: 100%;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }

    /* 側邊欄選中狀態（目前頁面） */
    .sidebar-item.selected {
      background-color: #d8dae1;
      color: rgb(71, 45, 71);
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.3);
      transform: none;
      border: none;
      width: 100%;
      box-sizing: border-box;
      border-radius: 4px;
    }

    /* ✅ 右側主內容區塊 */
    .main {
      margin-left: 100px; /* 與 sidebar 寬度一致 */
      padding: 2rem;
      min-height: 100vh;
    }

    .content-wrapper {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }

    .section {
      margin-bottom: 2rem;
    }

    .section h2 {
      margin-bottom: 1rem;
      font-size: 20px;
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 6px;
      color: #1f2937;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: 500;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    .checkbox-group {
      margin-top: 8px;
    }

    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
    }

    button {
      margin-top: 1rem;
      padding: 10px 20px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>

  <!-- 左側欄 -->
  <div class="sidebar">
    <a href="index.html" class="sidebar-item">🏠<br>主頁</a>
    <a href="admin-accounts.html" class="sidebar-item">🧑‍💼<br>帳號管理</a>
    <a href="admin-works.html" class="sidebar-item">📁<br>管理審核</a>
    <a href="admin-notifications.html" class="sidebar-item">🔔<br>通知</a>
    <a href="admin-settings.html" class="sidebar-item selected">⚙️<br>設定</a>
    <div class="sidebar-item">↩️<br>登出</div>
  </div>

  <!-- 主內容 -->
  <div class="main">
    <div class="content-wrapper">

      <h1>管理員設定</h1>

      <div class="section">
        <h2>個人資訊</h2>
        <label for="name">姓名</label>
        <input type="text" id="name" value="管理員">
        <label for="email">電子郵件</label>
        <input type="email" id="email" value="admin@example.com">
      </div>

      <div class="section">
        <h2>修改密碼</h2>
        <label for="current-password">目前密碼</label>
        <input type="password" id="current-password">
        <label for="new-password">新密碼</label>
        <input type="password" id="new-password">
        <label for="confirm-password">確認新密碼</label>
        <input type="password" id="confirm-password">
      </div>

      <div class="section">
        <h2>登入與安全性</h2>
        <div class="checkbox-group">
          <label><input type="checkbox" checked> 啟用二階段驗證（2FA）</label>
        </div>
        <label for="timeout">自動登出時間</label>
        <select id="timeout">
          <option value="5">5 分鐘</option>
          <option value="10">10 分鐘</option>
          <option value="30" selected>30 分鐘</option>
          <option value="60">60 分鐘</option>
        </select>
      </div>

      <div class="section">
        <h2>介面偏好</h2>
        <label for="theme">主題模式</label>
        <select id="theme">
          <option value="light" selected>淺色</option>
          <option value="dark">深色</option>
        </select>
        <label for="language">語言</label>
        <select id="language">
          <option value="zh" selected>繁體中文</option>
          <option value="en">English</option>
        </select>
      </div>

      <div class="section">
        <h2>資料備份</h2>
        <button onclick="alert('匯出用戶清單中...')">📥 匯出用戶清單</button>
        <button onclick="alert('匯出審核紀錄中...')">📥 匯出審核紀錄</button>
      </div>

      <button onclick="alert('已儲存設定')">💾 儲存設定</button>

    </div>
  </div>

</body>
</html>
