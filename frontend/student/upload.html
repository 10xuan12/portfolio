<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上傳作品 - Portfolio+</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/student/upload.css">
</head>
<body>
    <!-- 導覽列 -->
    <div id="navbar-placeholder"></div>
    <script>
(function() {
  var role = (localStorage.getItem('user') && JSON.parse(localStorage.getItem('user')).role) || null;
  var path = '../navbar.html';
  fetch(path)
    .then(res => res.text())
    .then(html => {
      var temp = document.createElement('div');
      temp.innerHTML = html;
      var tplId = 'navbar-visitor';
      if (role === 'student') tplId = 'navbar-student';
      else if (role === 'enterprise') tplId = 'navbar-enterprise';
      else if (role === 'admin') tplId = 'navbar-admin';
      var tpl = temp.querySelector('#' + tplId);
      if (tpl) {
        document.getElementById('navbar-placeholder').innerHTML = tpl.innerHTML;
      }
    })
    .catch(err => {
      console.error('載入導覽欄失敗:', err);
      // 如果載入失敗，顯示預設導覽欄
      document.getElementById('navbar-placeholder').innerHTML = `
        <nav class="navbar">
          <div class="container">
            <div class="navbar-brand">
              <a href="../index.html" class="navbar-logo">
                <i class="fas fa-briefcase"></i>
                <span>Portfolio+</span>
              </a>
            </div>
            <div class="navbar-menu">
              <a href="#features" class="nav-link">特色</a>
              <a href="#how-it-works" class="nav-link">如何使用</a>
              <a href="#categories" class="nav-link">分類</a>
              <a href="#contact" class="nav-link">聯絡我們</a>
            </div>
            <div class="navbar-actions">
              <a href="../login.html" class="btn btn-outline">登入</a>
              <a href="../register.html" class="btn btn-primary">註冊</a>
            </div>
          </div>
        </nav>
      `;
    });
})();
</script>

    <!-- 主要內容 -->
    <section class="upload-container">
        <div class="container">
            <div class="header-top">
                <button class="btn-back" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i>
                    返回
                </button>
            </div>
            <div class="upload-header">
                <h1>上傳作品</h1>
                <p>展示您的才華，讓企業發現您的潛力</p>
            </div>

            <!-- 上傳步驟 -->
            <div class="upload-steps">
                <div class="step active" id="step1">
                    <div class="step-number">1</div>
                    <span>基本資訊</span>
                </div>
                <div class="step" id="step2">
                    <div class="step-number">2</div>
                    <span>上傳檔案</span>
                </div>
                <div class="step" id="step3">
                    <div class="step-number">3</div>
                    <span>預覽確認</span>
                </div>
            </div>

            <div class="upload-content">
                <form class="upload-form" id="uploadForm">
                    <!-- 步驟 1: 基本資訊 -->
                    <div class="form-section" id="step1Content">
                        <h3>作品基本資訊</h3>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="title">作品標題</label>
                                <input type="text" id="title" name="title" required placeholder="請輸入作品標題">
                            </div>
                            <div class="form-group">
                                <label for="categoryFilter">作品學群分類</label>
                                <select id="categoryFilter" name="category" required>
                                    <option value="">請選擇學群分類</option>
                                    <option value="engineering">工程學群</option>
                                    <option value="information">資訊學群</option>
                                    <option value="business">商管學群</option>
                                    <option value="design">設計學群</option>
                                    <option value="education">教育學群</option>
                                    <option value="arts">藝術學群</option>
                                    <option value="humanities">人文學群</option>
                                    <option value="social">社會學群</option>
                                    <option value="science">自然科學學群</option>
                                    <option value="medicine">醫藥衛生學群</option>
                                    <option value="agriculture">農業學群</option>
                                    <option value="tourism">觀光餐旅學群</option>
                                    <option value="sports">體育學群</option>
                                    <option value="other">其他</option>
                                </select>
                            </div>
                            <div class="form-group full-width">
                                <label for="description">作品描述</label>
                                <textarea id="description" name="description" rows="4" required placeholder="請詳細描述您的作品，包括使用的技術、功能特色等..."></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- 步驟 2: 上傳檔案 -->
                    <div class="form-section" id="step2Content">
                        <h3>上傳作品檔案</h3>
                        <p style="color: #718096; margin-bottom: 2rem; font-size: 0.95rem;">支援多種格式，單個檔案最大 50MB</p>
                        
                        <!-- 封面圖片上傳 -->
                        <div class="form-group" style="margin-bottom: 2rem;">
                            <label for="coverImage">
                                封面圖片 
                                <span style="color: #e53e3e; font-weight: 600;">*</span>
                                <span style="color: #718096; font-weight: 400; font-size: 0.85rem; margin-left: 0.5rem;">（必填，建議尺寸 1200x630px）</span>
                            </label>
                            <div class="cover-image-upload" id="coverImageUpload">
                                <div class="cover-preview" id="coverPreview" style="display: none;">
                                    <img id="coverPreviewImage" src="" alt="封面預覽">
                                    <button type="button" class="btn-remove-cover" onclick="removeCoverImage()">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </div>
                                <div class="cover-upload-area" id="coverUploadArea">
                                    <i class="fas fa-image" style="font-size: 3rem; color: #cbd5e0; margin-bottom: 1rem;"></i>
                                    <p style="color: #4a5568; font-weight: 500; margin-bottom: 0.5rem;">點擊上傳封面圖片</p>
                                    <small style="color: #718096;">支援 JPG、PNG、GIF 格式，檔案不超過 5MB</small>
                                    <input type="file" id="coverImageInput" accept="image/jpeg,image/png,image/gif,image/webp" style="display: none;">
                                </div>
                            </div>
                        </div>
                        
                        <!-- 標籤設定 -->
                        <div class="form-group" style="margin-bottom: 2rem;">
                            <label for="tags">作品標籤</label>
                            <input type="text" id="tags" name="tags" placeholder="用逗號分隔標籤，例如：JavaScript, React, UI/UX">
                            <small style="color: #718096; font-size: 0.85rem;">標籤有助於企業更容易找到您的作品</small>
                        </div>
                        
                        <div class="upload-container">
                            <div class="upload-area" id="uploadArea">
                                <div class="upload-icon">
                                    <i class="fas fa-cloud-upload-alt"></i>
                                </div>
                                <div class="upload-text">
                                    <h4>拖拽檔案或資料夾到這裡</h4>
                                    <p>或點擊下方按鈕選擇檔案或資料夾</p>
                                </div>
                                <div class="upload-buttons">
                                    <button type="button" class="btn btn-outline upload-btn" onclick="document.getElementById('fileInput').click()">
                                        <i class="fas fa-file"></i>
                                        選擇檔案
                                    </button>
                                    <button type="button" class="btn btn-outline upload-btn" onclick="document.getElementById('folderInput').click()">
                                        <i class="fas fa-folder"></i>
                                        選擇資料夾
                                    </button>
                                </div>
                                <input type="file" id="fileInput" multiple accept="image/*,video/*,audio/*,.pdf,.zip,.rar,.obj,.stl,.fbx,.glb,.gltf,.mp4,.avi,.mov,.wmv,.mp3,.wav,.flac,.aac" style="display: none;">
                                <input type="file" id="folderInput" webkitdirectory directory multiple style="display: none;">
                            </div>
                            
                            <!-- 上傳進度 -->
                            <div class="upload-progress" id="uploadProgress" style="display: none;">
                                <div class="progress-header">
                                    <span class="progress-text">上傳中...</span>
                                    <span class="progress-percentage" id="progressPercentage">0%</span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill" id="progressFill"></div>
                                </div>
                            </div>
                        </div>

                        <!-- 檔案列表 -->
                        <div class="file-list" id="fileList" style="display: none;">
                            <div class="file-list-header">
                                <h4>已選擇的檔案</h4>
                                <span class="file-count" id="fileCount">0 個檔案</span>
                            </div>
                            <div class="file-items" id="fileItems"></div>
                        </div>
                    </div>

                    <!-- 步驟 3: 預覽確認 -->
                    <div class="form-section" id="step3Content">
                        <h3>預覽確認</h3>
                        <p style="color: #718096; margin-bottom: 2rem; font-size: 0.95rem;">請確認作品資訊無誤後發布</p>
                        
                        <!-- 發布設定 -->
                        <div class="form-group" style="margin-bottom: 2rem;">
                            <label for="status">發布狀態</label>
                            <select id="status" name="status">
                                <option value="draft">儲存為草稿</option>
                                <option value="published">立即發布</option>
                            </select>
                            <small style="color: #718096; font-size: 0.85rem;">草稿狀態下只有您可以看到，發布後其他使用者才能瀏覽</small>
                        </div>
                        
                        <div class="preview-container">
                            <!-- 作品資訊預覽 -->
                            <div class="preview-card">
                                <div class="preview-card-header">
                                    <i class="bi bi-info-circle"></i>
                                    <h4>作品資訊</h4>
                                </div>
                                <div class="preview-card-content">
                                    <div class="preview-item">
                                        <label>標題</label>
                                        <div class="preview-value" id="previewTitle">作品標題</div>
                                    </div>
                                    <div class="preview-item">
                                        <label>描述</label>
                                        <div class="preview-value" id="previewDescription">作品描述</div>
                                    </div>
                                    <div class="preview-item">
                                        <label>標籤</label>
                                        <div class="preview-tags" id="previewTags"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- 檔案預覽 -->
                            <div class="preview-card">
                                <div class="preview-card-header">
                                    <i class="bi bi-folder-open"></i>
                                    <h4>上傳檔案</h4>
                                </div>
                                <div class="preview-card-content">
                                    <div class="file-preview-grid" id="previewFiles"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-outline" id="prevBtn" onclick="previousStep()">
                            <i class="fas fa-arrow-left"></i>
                            上一步
                        </button>
                        <button type="button" class="btn btn-primary" id="nextBtn" onclick="nextStep()">
                            下一步
                            <i class="fas fa-arrow-right"></i>
                        </button>
                        <button type="submit" class="btn btn-primary" id="submitBtn">
                            <i class="fas fa-check"></i>
                            發布作品
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- 頁腳 -->
    <div id="footer-placeholder"></div>

    
    <script>
        // 簡化的初始化腳本，主要功能由 upload.js 處理
        document.addEventListener('DOMContentLoaded', function() {
            // 確保第一步驟內容立即顯示
            const step1Content = document.getElementById('step1Content');
            if (step1Content) {
                step1Content.style.setProperty('display', 'block', 'important');
            }
            
            // 確保第二步驟和第三步驟內容隱藏
            const step2Content = document.getElementById('step2Content');
            const step3Content = document.getElementById('step3Content');
            if (step2Content) {
                step2Content.style.setProperty('display', 'none', 'important');
            }
            if (step3Content) {
                step3Content.style.setProperty('display', 'none', 'important');
            }
            
            // 等待 upload.js 載入後初始化
            if (typeof initializeUpload === 'function') {
                initializeUpload();
            } else {
                // 如果函數還沒載入，等待一下再試
                setTimeout(function() {
                    if (typeof initializeUpload === 'function') {
                        initializeUpload();
                    }
                }, 100);
            }
        });
    </script>
    
    <!-- JavaScript 檔案 -->
    <script src="../js/config.js?v=20251020"></script>
    <script src="../js/api-service.js?v=20251020"></script>
    <script src="../js/app.js?v=20251020"></script>
    <script src="../js/student/upload.js?v=20251020"></script>
    <script>
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
