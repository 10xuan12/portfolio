<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上傳作品 - Portfolio+</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/student/upload.css">
</head>
<body>
    <!-- 導覽列 -->
    <div id="navbar-placeholder"></div>
    <script>
(function() {
  var role = (localStorage.getItem('user') && JSON.parse(localStorage.getItem('user')).role) || null;
  var path = '../navbar.html';
  fetch(path)
    .then(res => res.text())
    .then(html => {
      var temp = document.createElement('div');
      temp.innerHTML = html;
      var tplId = 'navbar-visitor';
      if (role === 'student') tplId = 'navbar-student';
      else if (role === 'enterprise') tplId = 'navbar-enterprise';
      else if (role === 'admin') tplId = 'navbar-admin';
      var tpl = temp.querySelector('#' + tplId);
      if (tpl) document.getElementById('navbar-placeholder').innerHTML = tpl.innerHTML;
    });
})();
</script>

    <!-- 主要內容 -->
    <section class="upload-container">
        <div class="container">
            <div class="upload-header">
                <h1>上傳作品</h1>
                <p>展示您的才華，讓企業發現您的潛力</p>
            </div>

            <!-- 上傳步驟 -->
            <div class="upload-steps">
                <div class="step active" id="step1">
                    <div class="step-number">1</div>
                    <span>基本資訊</span>
                </div>
                <div class="step" id="step2">
                    <div class="step-number">2</div>
                    <span>上傳檔案</span>
                </div>
                <div class="step" id="step3">
                    <div class="step-number">3</div>
                    <span>預覽確認</span>
                </div>
            </div>

            <div class="upload-content">
                <form class="upload-form" id="uploadForm">
                    <!-- 步驟 1: 基本資訊 -->
                    <div class="form-section" id="step1Content">
                        <h3>作品基本資訊</h3>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="title">作品標題 *</label>
                                <input type="text" id="title" name="title" required placeholder="請輸入作品標題">
                            </div>
                            <div class="form-group">
                                <label for="category">作品分類 *</label>
                                <select id="category" name="category" required>
                                    <option value="">請選擇分類</option>
                                    <option value="web">網頁設計</option>
                                    <option value="mobile">行動應用</option>
                                    <option value="design">UI/UX 設計</option>
                                    <option value="data">數據分析</option>
                                    <option value="other">其他</option>
                                </select>
                            </div>
                            <div class="form-group full-width">
                                <label for="description">作品描述 *</label>
                                <textarea id="description" name="description" rows="4" required placeholder="請詳細描述您的作品，包括使用的技術、功能特色等..."></textarea>
                            </div>
                            <div class="form-group">
                                <label for="tags">標籤</label>
                                <input type="text" id="tags" name="tags" placeholder="用逗號分隔標籤，例如：JavaScript, React, UI/UX">
                            </div>
                            <div class="form-group">
                                <label for="status">發布狀態</label>
                                <select id="status" name="status">
                                    <option value="draft">草稿</option>
                                    <option value="published">立即發布</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- 步驟 2: 上傳檔案 -->
                    <div class="form-section" id="step2Content" style="display: none;">
                        <h3>上傳作品檔案</h3>
                        
                        <div class="upload-area" id="uploadArea">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <h3>拖拽檔案到這裡或點擊上傳</h3>
                            <p>支援 JPG, PNG, GIF, PDF, ZIP 等格式，單檔最大 10MB</p>
                            <button type="button" class="upload-btn" onclick="document.getElementById('fileInput').click()">
                                <i class="fas fa-upload"></i>
                                選擇檔案
                            </button>
                            <input type="file" id="fileInput" multiple accept="image/*,.pdf,.zip,.rar" style="display: none;">
                        </div>

                        <div class="file-preview" id="filePreview">
                            <h4>已選擇的檔案</h4>
                            <div id="previewList"></div>
                        </div>

                        <div class="upload-options">
                            <div class="option-card" data-type="image">
                                <i class="fas fa-image"></i>
                                <h4>圖片檔案</h4>
                                <p>JPG, PNG, GIF</p>
                            </div>
                            <div class="option-card" data-type="document">
                                <i class="fas fa-file-pdf"></i>
                                <h4>文件檔案</h4>
                                <p>PDF, DOC, PPT</p>
                            </div>
                            <div class="option-card" data-type="archive">
                                <i class="fas fa-file-archive"></i>
                                <h4>壓縮檔案</h4>
                                <p>ZIP, RAR</p>
                            </div>
                            <div class="option-card" data-type="link">
                                <i class="fas fa-link"></i>
                                <h4>外部連結</h4>
                                <p>網站、影片連結</p>
                            </div>
                        </div>
                    </div>

                    <!-- 步驟 3: 預覽確認 -->
                    <div class="form-section" id="step3Content" style="display: none;">
                        <h3>預覽確認</h3>
                        
                        <div class="preview-section">
                            <h4>作品資訊</h4>
                            <div class="preview-content">
                                <div class="preview-title" id="previewTitle">作品標題</div>
                                <div class="preview-description" id="previewDescription">作品描述</div>
                                <div class="preview-tags" id="previewTags"></div>
                            </div>
                        </div>

                        <div class="preview-section">
                            <h4>上傳的檔案</h4>
                            <div class="preview-content">
                                <div id="previewFiles"></div>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-outline" id="prevBtn" onclick="previousStep()" style="display: none;">
                            <i class="fas fa-arrow-left"></i>
                            上一步
                        </button>
                        <button type="button" class="btn btn-primary" id="nextBtn" onclick="nextStep()">
                            下一步
                            <i class="fas fa-arrow-right"></i>
                        </button>
                        <button type="submit" class="btn btn-primary" id="submitBtn" style="display: none;">
                            <i class="fas fa-check"></i>
                            發布作品
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- 頁腳 -->
    <div id="footer-placeholder"></div>

    <script src="../js/app.js"></script>
    <script src="upload.js"></script>
</body>
</html>
