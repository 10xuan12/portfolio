<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>履歷生成 - Portfolio+</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/student/resume.css">
</head>
<body>
    <!-- 導覽列 -->
    <div id="navbar-placeholder"></div>
    <script>
    (function() {
      var role = (localStorage.getItem('user') && JSON.parse(localStorage.getItem('user')).role) || null;
      var path = '../navbar.html';
      fetch(path)
        .then(res => res.text())
        .then(html => {
          var temp = document.createElement('div');
          temp.innerHTML = html;
          var tplId = 'navbar-visitor';
          if (role === 'student') tplId = 'navbar-student';
          else if (role === 'enterprise') tplId = 'navbar-enterprise';
          else if (role === 'admin') tplId = 'navbar-admin';
          var tpl = temp.querySelector('#' + tplId);
          if (tpl) document.getElementById('navbar-placeholder').innerHTML = tpl.innerHTML;
        });
    })();
    </script>

    <!-- 主要內容 -->
    <main class="resume-container">
        <div class="container">
            <div class="resume-header">
                <div class="header-top">
                    <button class="btn-back" onclick="goBack()">
                        <i class="fas fa-arrow-left"></i>
                        返回
                    </button>
                </div>
                <h1 class="resume-title">履歷生成</h1>
                <div class="resume-actions">
                    <button class="btn btn-outline" onclick="saveResume()">
                        <i class="fas fa-save"></i>
                        儲存草稿
                    </button>
                    <button class="btn btn-primary" onclick="exportResume()">
                        <i class="fas fa-download"></i>
                        匯出履歷
                    </button>
                </div>
            </div>

            <div class="resume-grid">
                <!-- 編輯區域 -->
                <div class="resume-editor">
                    <!-- 模板選擇 -->
                    <div class="template-selector">
                        <h3>選擇履歷模板</h3>
                        <div class="template-grid">
                            <div class="template-option selected" data-template="modern">
                                <div class="template-preview">現代簡約</div>
                                <div>現代簡約</div>
                            </div>
                            <div class="template-option" data-template="professional">
                                <div class="template-preview">專業商務</div>
                                <div>專業商務</div>
                            </div>
                            <div class="template-option" data-template="creative">
                                <div class="template-preview">創意設計</div>
                                <div>創意設計</div>
                            </div>
                            <div class="template-option" data-template="minimal">
                                <div class="template-preview">極簡風格</div>
                                <div>極簡風格</div>
                            </div>
                        </div>
                    </div>

                    <!-- 基本資料 -->
                    <div class="form-section">
                        <h3>基本資料</h3>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="name">姓名</label>
                                <input type="text" id="name" name="name" value="" required>
                            </div>
                            <div class="form-group">
                                <label for="title">職稱</label>
                                <input type="text" id="title" name="title" value="">
                            </div>
                            <div class="form-group">
                                <label for="email">電子郵件</label>
                                <input type="email" id="email" name="email" value="" required>
                            </div>
                            <div class="form-group">
                                <label for="phone">電話</label>
                                <input type="tel" id="phone" name="phone" value="">
                            </div>
                                                         <div class="form-group">
                                 <label for="address">地址</label>
                                 <input type="text" id="address" name="address" value="">
                             </div>
                            <div class="form-group full-width">
                                <label for="summary">個人簡介</label>
                                <textarea id="summary" name="summary" rows="4"></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- 工作經驗 -->
                    <div class="form-section">
                        <h3>工作經驗</h3>
                        <div id="experienceList">
                            <!-- 工作經驗項目將由 JavaScript 動態生成 -->
                        </div>
                        <button class="add-item-btn" onclick="addExperience()">
                            <i class="fas fa-plus"></i>
                            新增工作經驗
                        </button>
                    </div>

                    <!-- 教育背景 -->
                    <div class="form-section">
                        <h3>教育背景</h3>
                        <div id="educationList">
                            <!-- 教育背景項目將由 JavaScript 動態生成 -->
                        </div>
                        <button class="add-item-btn" onclick="addEducation()">
                            <i class="fas fa-plus"></i>
                            新增教育背景
                        </button>
                    </div>

                                         <!-- 技能專長 -->
                     <div class="form-section">
                         <h3>技能專長</h3>
                         <div class="form-grid">
                             <div class="form-group full-width">
                                 <label for="skills">技能列表（用逗號分隔）</label>
                                 <textarea id="skills" name="skills" rows="3" placeholder="例如：JavaScript, React, Node.js, TypeScript, HTML5, CSS3, Git, Docker, AWS, UI/UX Design"></textarea>
                             </div>
                         </div>
                     </div>

                                         <!-- 專案作品 -->
                     <div class="form-section">
                         <h3>專案作品</h3>
                         <div id="projectList">
                             <!-- 專案作品項目將由 JavaScript 動態生成 -->
                         </div>
                         <button class="add-item-btn" onclick="addProject()">
                             <i class="fas fa-plus"></i>
                             新增專案作品
                         </button>
                     </div>

                                         <!-- 證照獎項 -->
                     <div class="form-section">
                         <h3>證照獎項</h3>
                         <div id="certificateList">
                             <!-- 證照獎項項目將由 JavaScript 動態生成 -->
                         </div>
                         <button class="add-item-btn" onclick="addCertificate()">
                             <i class="fas fa-plus"></i>
                             新增證照獎項
                         </button>
                     </div>
                </div>

                <!-- 預覽區域 -->
                <div class="resume-preview">
                    <h3>履歷預覽</h3>
                    <div class="preview-container" id="resumePreview">
                        <!-- 預覽內容將由 JavaScript 動態生成 -->
                    </div>
                    <div class="export-options">
                        <button class="btn btn-outline" onclick="exportPDF()">
                            <i class="fas fa-file-pdf"></i>
                            匯出 PDF
                        </button>
                        <button class="btn btn-outline" onclick="exportWord()">
                            <i class="fas fa-file-word"></i>
                            匯出 Word
                        </button>
                        <button class="btn btn-outline" onclick="printResume()">
                            <i class="fas fa-print"></i>
                            列印
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- JavaScript 檔案 -->
    <script src="../js/config.js"></script>
    <script src="../js/api-service.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/student/resume.js"></script>
    
    <script>
        // 初始化應用程式
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化 API 服務
            if (typeof initializeApiService === 'function') {
                initializeApiService();
            }
            
            // 載入導覽列
            if (typeof loadNavbar === 'function') {
                loadNavbar('student');
            }
            
            // 載入履歷資料
            if (typeof loadResumeData === 'function') {
                loadResumeData();
            }
        });

        // 回到上一頁
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
