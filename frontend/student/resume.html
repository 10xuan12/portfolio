<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>履歷生成 - Portfolio+</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/student/resume.css">
</head>
<body>
    <!-- 導覽列 -->
    <div id="navbar-placeholder"></div>
    <script>
    (function() {
      var role = (localStorage.getItem('user') && JSON.parse(localStorage.getItem('user')).role) || null;
      var path = '../navbar.html';
      fetch(path)
        .then(res => res.text())
        .then(html => {
          var temp = document.createElement('div');
          temp.innerHTML = html;
          var tplId = 'navbar-visitor';
          if (role === 'student') tplId = 'navbar-student';
          else if (role === 'enterprise') tplId = 'navbar-enterprise';
          else if (role === 'admin') tplId = 'navbar-admin';
          var tpl = temp.querySelector('#' + tplId);
          if (tpl) document.getElementById('navbar-placeholder').innerHTML = tpl.innerHTML;
        });
    })();
    </script>

    <!-- 載入覆蓋層 -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner">
                <div class="spinner-ring"></div>
                <div class="spinner-ring"></div>
                <div class="spinner-ring"></div>
            </div>
            <h3>正在載入履歷資料...</h3>
            <p>請稍候，我們正在為您準備專業的履歷生成器</p>
        </div>
    </div>

    <!-- 主要內容 -->
    <main class="resume-container" id="mainContent" style="display: none;">
        <div class="container">
            <div class="resume-header">
                <div class="header-top">
                    <button class="btn-back" onclick="goBack()">
                        <i class="fas fa-arrow-left"></i>
                        返回
                    </button>
                </div>
                <div class="header-content">
                    <div class="title-section">
                        <h1 class="resume-title">
                            <i class="fas fa-file-alt"></i>
                            智慧履歷生成器
                        </h1>
                        <p class="resume-subtitle">打造專屬於你的專業履歷，讓企業看見你的價值</p>
                    </div>
                    <div class="resume-actions">
                        <button class="btn btn-secondary" onclick="fillSampleData()">
                            <i class="fas fa-magic"></i>
                            填入範例
                        </button>
                        <button class="btn btn-ai" onclick="analyzeResume()">
                            <i class="fas fa-lightbulb"></i>
                            AI 優化建議
                        </button>
                        <button class="btn btn-outline" onclick="saveResume()">
                            <i class="fas fa-save"></i>
                            儲存草稿
                        </button>
                        <button class="btn btn-primary" onclick="exportResume()">
                            <i class="fas fa-download"></i>
                            匯出 PDF
                        </button>
                    </div>
                </div>
            </div>

            <div class="resume-grid">
                <!-- 編輯區域 -->
                <div class="resume-editor">
                    <!-- 模板與配色選擇 -->
                    <div class="template-selector">
                        <h3><i class="fas fa-palette"></i> 履歷樣式設定</h3>
                        
                        <!-- 模板選擇 -->
                        <div class="style-section">
                            <label class="section-label">選擇模板風格</label>
                            <div class="template-grid">
                                <div class="template-option selected" data-template="executive">
                                    <div class="template-preview">
                                        <i class="fas fa-briefcase"></i>
                                    </div>
                                    <div class="template-name">高階主管</div>
                                    <div class="template-desc">正式、專業</div>
                                </div>
                                <div class="template-option" data-template="professional">
                                    <div class="template-preview">
                                        <i class="fas fa-user-tie"></i>
                                    </div>
                                    <div class="template-name">專業商務</div>
                                    <div class="template-desc">傳統、穩重</div>
                                </div>
                                <div class="template-option" data-template="modern">
                                    <div class="template-preview">
                                        <i class="fas fa-laptop-code"></i>
                                    </div>
                                    <div class="template-name">現代科技</div>
                                    <div class="template-desc">簡潔、清晰</div>
                                </div>
                                <div class="template-option" data-template="academic">
                                    <div class="template-preview">
                                        <i class="fas fa-graduation-cap"></i>
                                    </div>
                                    <div class="template-name">學術研究</div>
                                    <div class="template-desc">學術、詳細</div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 配色方案 -->
                        <div class="style-section">
                            <label class="section-label">配色方案</label>
                            <div class="color-scheme-grid">
                                <div class="color-scheme selected" data-color="blue">
                                    <div class="color-preview">
                                        <span style="background: #2563eb;"></span>
                                        <span style="background: #1e40af;"></span>
                                    </div>
                                    <div>專業藍</div>
                                </div>
                                <div class="color-scheme" data-color="slate">
                                    <div class="color-preview">
                                        <span style="background: #334155;"></span>
                                        <span style="background: #1e293b;"></span>
                                    </div>
                                    <div>商務灰</div>
                                </div>
                                <div class="color-scheme" data-color="emerald">
                                    <div class="color-preview">
                                        <span style="background: #059669;"></span>
                                        <span style="background: #047857;"></span>
                                    </div>
                                    <div>活力綠</div>
                                </div>
                                <div class="color-scheme" data-color="purple">
                                    <div class="color-preview">
                                        <span style="background: #7c3aed;"></span>
                                        <span style="background: #6d28d9;"></span>
                                    </div>
                                    <div>創意紫</div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 字型選擇 -->
                        <div class="style-section">
                            <label class="section-label">字型風格</label>
                            <select id="fontFamily" class="font-selector" onchange="changeFontFamily(this.value)">
                                <option value="traditional">傳統襯線（Times New Roman）</option>
                                <option value="modern" selected>現代無襯線（Arial）</option>
                                <option value="elegant">優雅襯線（Georgia）</option>
                                <option value="tech">科技感（Helvetica）</option>
                            </select>
                        </div>
                    </div>

                    <!-- 基本資料 -->
                    <div class="form-section">
                        <h3>基本資料</h3>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="name">姓名</label>
                                <input type="text" id="name" name="name" value="" required>
                            </div>
                            <div class="form-group">
                                <label for="birthDate">生日</label>
                                <input type="date" id="birthDate" name="birthDate" value="" lang="ja-JP">
                            </div>
                            <div class="form-group">
                                <label for="email">電子郵件</label>
                                <input type="email" id="email" name="email" value="" required>
                            </div>
                            <div class="form-group">
                                <label for="phone">電話</label>
                                <input type="tel" id="phone" name="phone" value="">
                            </div>
                                                         <div class="form-group">
                                 <label for="address">地址</label>
                                 <input type="text" id="address" name="address" value="">
                             </div>
                            <div class="form-group full-width">
                                <label for="summary">個人簡介</label>
                                <textarea id="summary" name="summary" rows="4"></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- 工作經驗 -->
                    <div class="form-section">
                        <h3>工作經驗</h3>
                        <div id="experienceList">
                            <!-- 工作經驗項目將由 JavaScript 動態生成 -->
                        </div>
                        <button class="add-item-btn" onclick="addExperience()">
                            <i class="fas fa-plus"></i>
                            新增工作經驗
                        </button>
                    </div>

                    <!-- 教育背景 -->
                    <div class="form-section">
                        <h3>教育背景</h3>
                        <div id="educationList">
                            <!-- 教育背景項目將由 JavaScript 動態生成 -->
                        </div>
                        <button class="add-item-btn" onclick="addEducation()">
                            <i class="fas fa-plus"></i>
                            新增教育背景
                        </button>
                    </div>

                                         <!-- 技能專長 -->
                     <div class="form-section">
                         <h3>技能專長</h3>
                         <div class="form-grid">
                             <div class="form-group full-width">
                                 <label for="skills">技能列表（用逗號分隔）</label>
                                 <textarea id="skills" name="skills" rows="3" placeholder="例如：JavaScript, React, Node.js, TypeScript, HTML5, CSS3, Git, Docker, AWS, UI/UX Design"></textarea>
                             </div>
                         </div>
                     </div>

                                         <!-- 專案作品 -->
                     <div class="form-section">
                         <h3>專案作品</h3>
                         <div id="projectList">
                             <!-- 專案作品項目將由 JavaScript 動態生成 -->
                         </div>
                         <button class="add-item-btn" onclick="addProject()">
                             <i class="fas fa-plus"></i>
                             新增專案作品
                         </button>
                     </div>

                                         <!-- 證照獎項 -->
                     <div class="form-section">
                         <h3>證照獎項</h3>
                         <div id="certificateList">
                             <!-- 證照獎項項目將由 JavaScript 動態生成 -->
                         </div>
                         <button class="add-item-btn" onclick="addCertificate()">
                             <i class="fas fa-plus"></i>
                             新增證照獎項
                         </button>
                     </div>
                </div>

                <!-- 預覽區域 -->
                <div class="resume-preview">
                    <h3>履歷預覽</h3>
                    <div class="preview-container" id="resumePreview">
                        <!-- 預覽內容將由 JavaScript 動態生成 -->
                    </div>
                    <div class="export-options">
                        <button class="btn btn-outline" onclick="exportPDF()">
                            <i class="fas fa-file-pdf"></i>
                            匯出 PDF
                        </button>
                        <button class="btn btn-outline" onclick="printResume()">
                            <i class="fas fa-print"></i>
                            列印
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- AI 優化建議面板 -->
            <div id="suggestions-panel" class="suggestions-panel">
                <div class="panel-header">
                    <h3><i class="fas fa-chart-line text-white"></i> 履歷分析報告</h3>
                    <button class="btn-close" onclick="closeSuggestions()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                
                <div class="panel-content">
                    <!-- 分數區塊 -->
                    <div class="score-section">
                        <div class="score-circle">
                            <span id="score-value" class="score-number">0</span>
                            <span class="score-label">分</span>
                        </div>
                        <div id="score-level" class="score-level">準備分析</div>
                        <p id="analysis-summary" class="score-summary">
                            點擊「AI 優化建議」按鈕，即可分析您的履歷並獲得專業建議
                        </p>
                    </div>
                    
                    <!-- 統計區塊 -->
                    <div id="analysis-stats" class="analysis-stats">
                        <div class="stat-item">
                            <span class="stat-icon error">❌</span>
                            <span class="stat-label">錯誤</span>
                            <span class="stat-value">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-icon warning">⚠️</span>
                            <span class="stat-label">警告</span>
                            <span class="stat-value">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-icon tip">💡</span>
                            <span class="stat-label">建議</span>
                            <span class="stat-value">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-icon success">✅</span>
                            <span class="stat-label">優點</span>
                            <span class="stat-value">0</span>
                        </div>
                    </div>
                    
                    <!-- 建議列表 -->
                    <div class="suggestions-section">
                        <h4><i class="fas fa-list-ul"></i> 詳細建議</h4>
                        <div id="suggestions-list" class="suggestions-list">
                            <div class="empty-state">
                                <i class="fas fa-clipboard-check"></i>
                                <p>尚未進行分析</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- JavaScript 檔案 -->
    <script src="../js/config.js"></script>
    <script src="../js/api-service.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/student/resume.js"></script>
    
    <script>
        // 初始化應用程式
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化 API 服務
            if (typeof initializeApiService === 'function') {
                initializeApiService();
            }
            
            // 載入導覽列
            if (typeof loadNavbar === 'function') {
                loadNavbar('student');
            }
            
            // 延遲載入履歷資料，確保 API 服務已初始化
            setTimeout(function() {
                if (typeof loadResumeData === 'function') {
                    loadResumeData();
                }
            }, 300);
        });

        // 回到上一頁
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
