<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品時光機 - Portfolio+</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/portfolio-timeline.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 導覽列 -->
    <div id="navbar-placeholder"></div>
    <script>
    (function() {
      var role = (localStorage.getItem('user') && JSON.parse(localStorage.getItem('user')).role) || null;
      var path = '../navbar.html';
      fetch(path)
        .then(function(res){ return res.text(); })
        .then(function(html){
          var temp = document.createElement('div');
          temp.innerHTML = html;
          var tplId = 'navbar-visitor';
          if (role === 'student') tplId = 'navbar-student';
          else if (role === 'enterprise') tplId = 'navbar-enterprise';
          else if (role === 'admin') tplId = 'navbar-admin';
          var tpl = temp.querySelector('#' + tplId);
          if (tpl) document.getElementById('navbar-placeholder').innerHTML = tpl.innerHTML;
        })
        .catch(function(e){ console.error('載入導航欄失敗', e); });
    })();
    </script>

    <!-- 主要內容 -->
    <main class="timeline-main">
        <div class="container">
            <!-- 頁面標題 -->
            <div class="page-header">
                <div class="header-content">
                    <div class="title-section">
                        <h1 class="page-title">
                            <i class="fas fa-history"></i>
                            作品時光機
                        </h1>
                        <p class="page-subtitle">追蹤您的學習成長歷程，以時間軸方式展示作品演進軌跡</p>
                    </div>
                    <div class="header-actions">
                        <button class="btn btn-outline" onclick="goBack()">
                            <i class="fas fa-arrow-left"></i>
                            返回
                        </button>
                        <button class="btn btn-secondary" onclick="refreshTimeline()">
                            <i class="fas fa-sync-alt"></i>
                            重新載入
                        </button>
                    </div>
                </div>
            </div>

            <!-- 時光機容器 -->
            <div class="timeline-container">
                <div class="timeline-header">
                    <div class="timeline-stats">
                        <div class="stat-card">
                            <div class="stat-icon growth-icon"></div>
                            <div class="stat-content">
                                <h3 id="totalPortfolios">0</h3>
                                <p>總作品數</p>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon time-icon"></div>
                            <div class="stat-content">
                                <h3 id="timelineSpan">0</h3>
                                <p>學習時長</p>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon progress-icon"></div>
                            <div class="stat-content">
                                <h3 id="skillGrowth">0%</h3>
                                <p>技能成長</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="timeline-content">
                    <div class="timeline-filters">
                        <div class="filter-group">
                            <label>作品類型</label>
                            <select id="categoryFilter" onchange="filterTimeline()">
                                <option value="">全部類型</option>
                                <!-- 動態載入的分類選項將在這裡生成 -->
                            </select>
                        </div>
                        <div class="filter-group">
                            <label>時間範圍</label>
                            <select id="timeFilter" onchange="filterTimeline()">
                                <option value="">全部時間</option>
                                <option value="1year">近一年</option>
                                <option value="6months">近六個月</option>
                                <option value="3months">近三個月</option>
                            </select>
                        </div>
                    </div>

                    <div class="timeline-wrapper">
                        <div class="timeline-loading" id="loadingState">
                            <div class="loading-spinner">
                                <div class="spinner-ring"></div>
                                <div class="spinner-ring"></div>
                                <div class="spinner-ring"></div>
                            </div>
                            <p>正在載入您的作品歷程...</p>
                        </div>
                        <div class="timeline" id="timelineContainer">
                            <!-- 時間軸內容將在這裡渲染 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 頁腳 -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>Portfolio+</h3>
                    <p>專業的作品集展示平台，連接學生與企業的橋樑。</p>
                </div>
                
                <div class="footer-section">
                    <h4>快速連結</h4>
                    <ul>
                        <li><a href="../index.html">首頁</a></li>
                        <li><a href="dashboard.html">儀表板</a></li>
                        <li><a href="portfolio.html">作品集</a></li>
                        <li><a href="profile.html">個人資料</a></li>
                    </ul>
                </div>
                
                <div class="footer-section">
                    <h4>功能</h4>
                    <ul>
                        <li><a href="skill-radar-demo.html">技能雷達圖</a></li>
                        <li><a href="portfolio-timeline-demo.html">作品時光機</a></li>
                        <li><a href="resume.html">履歷生成</a></li>
                    </ul>
                </div>
            </div>
            
            <div class="footer-bottom">
                <p>&copy; 2025 Portfolio+. 版權所有。</p>
            </div>
        </div>
    </footer>

    <script src="../js/portfolio-timeline.js?v=20251104-1"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 從 localStorage 獲取當前登入用戶的資訊
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            const studentId = user.id || 5; // 如果沒有登入，預設使用 ID 5
            
            console.log('當前登入用戶:', user);
            console.log('使用學生 ID:', studentId);
            
            // 初始化作品時光機
            window.portfolioTimeline = new PortfolioTimeline('timelineContainer', studentId);
        });

        function refreshTimeline() {
            location.reload();
        }

        function exportTimeline() {
            // 匯出時光機功能
            const timeline = document.getElementById('timelineContainer');
            if (timeline) {
                // 這裡可以實現匯出為PDF或圖片的功能
                alert('匯出功能開發中...');
            }
        }

        function filterTimeline() {
            const categoryFilter = document.getElementById('categoryFilter').value;
            const timeFilter = document.getElementById('timeFilter').value;
            
            if (window.portfolioTimeline) {
                window.portfolioTimeline.filterTimeline(categoryFilter, timeFilter);
            }
        }

        // 返回按鈕功能
        function goBack() {
            // 檢查是否有上一頁歷史記錄
            if (window.history.length > 1) {
                window.history.back();
            } else {
                // 如果沒有歷史記錄，返回學生儀表板
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
