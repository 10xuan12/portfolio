<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生主頁 - Portfolio+</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/student/dashboard.css">
    <script>
        // 設定學生端主題
        document.addEventListener('DOMContentLoaded', function() {
            if (document.body) {
                document.body.classList.add('student-theme');
            }
        });
    </script>
</head>
<body>
    <!-- 導覽列 -->
    <div id="navbar-placeholder"></div>
    <script>
    (function() {
      var role = (localStorage.getItem('user') && JSON.parse(localStorage.getItem('user')).role) || null;
      var path = '../navbar.html';
      fetch(path)
        .then(function(res){ return res.text(); })
        .then(function(html){
          var temp = document.createElement('div');
          temp.innerHTML = html;
          var tplId = 'navbar-visitor';
          if (role === 'student') tplId = 'navbar-student';
          else if (role === 'enterprise') tplId = 'navbar-enterprise';
          else if (role === 'admin') tplId = 'navbar-admin';
          var tpl = temp.querySelector('#' + tplId);
          if (tpl) document.getElementById('navbar-placeholder').innerHTML = tpl.innerHTML;
        })
        .catch(function(e){ console.error('載入導航欄失敗', e); });
    })();
    </script>
    <!-- 導覽列將由 app.js 動態載入（已加上保險載入） -->

    <!-- 儀表板標題 -->
    <section class="dashboard-header">
        <div class="container">
            <h1 id="welcome-title">歡迎回來！</h1>
            <p>以下是您的作品集概況</p>
            
            <div class="dashboard-stats">
                <div class="stat-card">
                    <div class="stat-content-box">
                        <div class="number" id="stat-works">-</div>
                        <div class="label">作品數量</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-content-box">
                        <div class="number" id="stat-views">-</div>
                        <div class="label">總瀏覽次數</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-content-box">
                        <div class="number" id="stat-likes">-</div>
                        <div class="label">獲得讚數</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-content-box">
                        <div class="number" id="stat-comments">-</div>
                        <div class="label">評論數量</div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 主要內容 -->
    <section class="dashboard-content">
        <div class="container">
            <style>
                #dashboardLoading { display:none; align-items:center; justify-content:center; gap:8px; padding:10px; margin-bottom:12px; background:#f5f5f5; border-radius:8px; }
                #dashboardError { display:none; padding:10px; margin-bottom:12px; background:#ffecec; color:#b00020; border:1px solid #ffbdbd; border-radius:8px; }
            </style>
            <div id="dashboardLoading"><i class="fas fa-spinner fa-spin"></i> 載入中...</div>
            <div id="dashboardError"></div>
            <div class="dashboard-grid">
                <div class="main-content">
                    <h2>快速操作</h2>
                    <div class="quick-actions">
                        <a href="upload.html" class="quick-action">
                            <i class="fas fa-upload"></i>
                            <span>上傳新作品</span>
                        </a>
                        <a href="portfolio.html" class="quick-action">
                            <i class="fas fa-edit"></i>
                            <span>編輯作品集</span>
                        </a>
                        <a href="profile.html" class="quick-action">
                            <i class="fas fa-user-edit"></i>
                            <span>更新個人資料</span>
                        </a>
                        <a href="resume.html" class="quick-action">
                            <i class="fas fa-file-alt"></i>
                            <span>生成履歷</span>
                        </a>
                        <a href="notifications.html" class="quick-action">
                            <i class="fas fa-bell"></i>
                            <span>通知</span>
                        </a>
                        <a href="messages.html" class="quick-action">
                            <i class="fas fa-comments"></i>
                            <span>訊息</span>
                        </a>
                        <a href="search.html" class="quick-action">
                            <i class="fas fa-search"></i>
                            <span>大家的作品</span>
                        </a>
                    </div>

                    <h2>我的作品</h2>
                    <div class="portfolio-grid" id="portfolio-grid">
                        <!-- 作品將由 JavaScript 動態載入 -->
                        <div class="loading-placeholder">
                            <i class="fas fa-spinner fa-spin"></i>
                            <p>載入中...</p>
                        </div>
                    </div>
                </div>

                <div class="sidebar">
                    <div class="sidebar-card">
                        <h3>最近活動</h3>
                        <ul class="recent-activity" id="recent-activity">
                            <!-- 活動將由 JavaScript 動態載入 -->
                            <li class="loading-placeholder">
                                <i class="fas fa-spinner fa-spin"></i>
                                <div>載入中...</div>
                            </li>
                        </ul>
                    </div>

                    <div class="sidebar-card">
                        <h3>徽章成就</h3>
                        <ul id="badges-container">
                            <!-- 徽章將由 JavaScript 動態載入 -->
                            <li class="loading-placeholder">
                                <i class="fas fa-spinner fa-spin"></i>
                                <div>載入中...</div>
                            </li>
                        </ul>
                    </div>

                    <div class="sidebar-card">
                        <h3>企業互動</h3>
                        <div id="enterprise-interactions">
                            <!-- 企業互動將由 JavaScript 動態載入 -->
                            <div class="loading-placeholder">
                                <i class="fas fa-spinner fa-spin"></i>
                                <div>載入中...</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 頁腳 -->
    <div id="footer-placeholder"></div>

    <script src="../js/config.js?v=20250829-1"></script>
    <script>
        // 等待配置初始化完成後再載入其他腳本
        document.addEventListener('DOMContentLoaded', function() {
            // 檢查配置狀態
            console.log('當前模式:', isUsingMockData() ? '假資料' : '真實API');
            console.log('環境:', getEnvironment());
            console.log('版本:', getVersion());
            
            // 確保配置已初始化
            if (typeof isUsingMockData === 'function' && isUsingMockData() === false) {
                // 配置正確，載入其他腳本
                loadRemainingScripts();
            } else {
                // 等待配置初始化
                setTimeout(loadRemainingScripts, 100);
            }
        });
        
        function loadRemainingScripts() {
            // 動態載入其他腳本
            const v = '20250908-2';
            const scripts = [
                `../js/api-service.js?v=${v}`,
                `../js/app.js?v=${v}`,
                `../js/student/dashboard.js?v=${v}`
            ];
            
            scripts.forEach((src, index) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = function() {
                    console.log('已載入腳本:', src);
                    // 若是 api-service.js 載入完成，主動初始化一次
                    if (src.indexOf('api-service.js') !== -1) {
                        if (typeof window.initializeApiService === 'function') {
                            console.log('呼叫 initializeApiService()');
                            window.initializeApiService();
                        } else {
                            console.warn('initializeApiService 尚不可用');
                        }
                    }
                    if (index === scripts.length - 1) {
                        // 最後一個腳本載入完成，等待 API 服務初始化
                        waitForApiService();
                    }
                };
                script.onerror = function(e) {
                    console.error('腳本載入失敗:', src, e);
                };
                document.head.appendChild(script);
            });
        }
        
        // 等待 API 服務初始化
        function waitForApiService() {
            if (typeof apiService !== 'undefined' && apiService) {
                console.log('API 服務已準備就緒');
                initializeDashboard();
            } else {
                console.log('等待 API 服務初始化...');
                // 若可用則嘗試初始化
                if (typeof window.initializeApiService === 'function') {
                    window.initializeApiService();
                }
                setTimeout(waitForApiService, 200);
            }
        }
        
        // 初始化儀表板功能
        function initializeDashboard() {
            // 載入導航欄
            if (typeof UI !== 'undefined' && UI.loadNavbar) {
                UI.loadNavbar();
            }
            
            // 更新歡迎標題
            updateWelcomeTitle();
            
            // 載入動態資料
            loadDynamicData();
            
            // 設定即時更新
            setupRealTimeUpdates();
            
            // 設定作品狀態更新監聽器
            setupPortfolioStatusListeners();
        }
        
        // 更新歡迎標題
        function updateWelcomeTitle() {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            const welcomeTitle = document.getElementById('welcome-title');
            if (welcomeTitle && user.name) {
                welcomeTitle.textContent = `歡迎回來，${user.name}！`;
            }
        }
        
        // 載入動態資料
        function loadDynamicData() {
            // 載入作品列表
            loadPortfolios();
            
            // 載入最近活動
            loadRecentActivities();
            
            // 載入徽章成就
            loadBadges();
            
            // 載入企業互動
            loadEnterpriseInteractions();
        }
        
        // 載入作品列表
        function loadPortfolios() {
            const portfolioGrid = document.getElementById('portfolio-grid');
            if (!portfolioGrid) return;
            
            // 這裡會由 dashboard.js 處理
            if (typeof loadDashboardData === 'function') {
                loadDashboardData();
            }
        }
        
        // 載入最近活動
        function loadRecentActivities() {
            const activityList = document.getElementById('recent-activity');
            if (!activityList) return;
            
            // 這裡會由 dashboard.js 處理
        }
        
        // 載入徽章成就
        function loadBadges() {
            const badgesContainer = document.getElementById('badges-container');
            if (!badgesContainer) return;
            
            // 這裡會由 dashboard.js 處理
        }
        
        // 載入企業互動
        function loadEnterpriseInteractions() {
            const interactionsContainer = document.getElementById('enterprise-interactions');
            if (!interactionsContainer) return;
            
            // 這裡會由 dashboard.js 處理
        }
        
        // 設定即時更新
        function setupRealTimeUpdates() {
            // 每 30 秒更新一次資料
            setInterval(() => {
                if (typeof apiService !== 'undefined') {
                    loadDynamicData();
                }
            }, 30000);
            
            // 設定 WebSocket 連接（如果可用）
            if (typeof WebSocket !== 'undefined' && typeof APP_CONFIG !== 'undefined' && APP_CONFIG.ENABLE_WEBSOCKET) {
                setupWebSocketConnection();
            }
        }
        
        // 設定 WebSocket 連接
        function setupWebSocketConnection() {
            try {
                const ws = new WebSocket('ws://localhost:8000/ws');
                
                ws.onopen = function() {
                    console.log('WebSocket 連接已建立');
                };
                
                ws.onmessage = function(event) {
                    const data = JSON.parse(event.data);
                    handleWebSocketMessage(data);
                };
                
                ws.onerror = function(error) {
                    console.error('WebSocket 錯誤:', error);
                };
                
                ws.onclose = function() {
                    console.log('WebSocket 連接已關閉');
                    // 5 秒後嘗試重新連接
                    setTimeout(setupWebSocketConnection, 5000);
                };
            } catch (error) {
                console.warn('WebSocket 不可用:', error);
            }
        }
        
        // 處理 WebSocket 訊息
        function handleWebSocketMessage(data) {
            switch (data.type) {
                case 'notification':
                    showNotification(data.message, data.level || 'info');
                    break;
                case 'portfolio_update':
                    updatePortfolioStatus(data.portfolio_id, data.status);
                    break;
                case 'activity':
                    addNewActivity(data.activity);
                    break;
                case 'badge_earned':
                    showBadgeEarnedNotification(data.badge);
                    break;
                default:
                    console.log('未知的 WebSocket 訊息類型:', data.type);
            }
        }
        
        // 設定作品狀態更新監聽器
        function setupPortfolioStatusListeners() {
            // 監聽作品狀態變化
            document.addEventListener('portfolioStatusChanged', function(event) {
                const { portfolioId, newStatus } = event.detail;
                updatePortfolioStatus(portfolioId, newStatus);
            });
        }
        
        // 更新作品狀態
        function updatePortfolioStatus(portfolioId, newStatus) {
            const portfolioItem = document.querySelector(`[data-portfolio-id="${portfolioId}"]`);
            if (portfolioItem) {
                const statusElement = portfolioItem.querySelector('.portfolio-status');
                if (statusElement) {
                    statusElement.textContent = getStatusText(newStatus);
                    statusElement.className = `portfolio-status status-${newStatus}`;
                }
            }
        }
        
        // 取得狀態文字
        function getStatusText(status) {
            const statusMap = {
                'published': '已發布',
                'review': '審核中',
                'draft': '草稿',
                'rejected': '已拒絕'
            };
            return statusMap[status] || status;
        }
        
        // 新增活動
        function addNewActivity(activity) {
            const activityList = document.getElementById('recent-activity');
            if (!activityList) return;
            
            const activityItem = document.createElement('li');
            activityItem.innerHTML = `
                <div class="activity-icon activity-${activity.type}">
                    <i class="fas ${getActivityIcon(activity.type)}"></i>
                </div>
                <div>
                    <div>${activity.text}</div>
                    <small>${formatTimeAgo(activity.timestamp)}</small>
                </div>
            `;
            
            // 插入到列表開頭
            activityList.insertBefore(activityItem, activityList.firstChild);
            
            // 移除舊的活動項目（保持最多 5 個）
            const items = activityList.querySelectorAll('li');
            if (items.length > 5) {
                items[items.length - 1].remove();
            }
        }
        
        // 取得活動圖示
        function getActivityIcon(type) {
            const iconMap = {
                'upload': 'fa-upload',
                'view': 'fa-eye',
                'like': 'fa-heart',
                'comment': 'fa-comment',
                'badge': 'fa-star'
            };
            return iconMap[type] || 'fa-info-circle';
        }
        
        // 顯示徽章獲得通知
        function showBadgeEarnedNotification(badge) {
            const notification = document.createElement('div');
            notification.className = 'badge-notification';
            notification.innerHTML = `
                <div class="badge-notification-content">
                    <i class="fas fa-star"></i>
                    <span>恭喜獲得徽章：${badge.name}！</span>
                </div>
            `;
            
            document.body.appendChild(notification);
            
            // 3 秒後自動移除
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
        
        // 顯示通知
        function showNotification(message, level = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification notification-${level}`;
            notification.innerHTML = `
                <div class="notification-content">
                    <i class="fas ${getNotificationIcon(level)}"></i>
                    <span>${message}</span>
                </div>
            `;
            
            document.body.appendChild(notification);
            
            // 5 秒後自動移除
            setTimeout(() => {
                notification.remove();
            }, 5000);
        }
        
        // 取得通知圖示
        function getNotificationIcon(level) {
            const iconMap = {
                'info': 'fa-info-circle',
                'success': 'fa-check-circle',
                'warning': 'fa-exclamation-triangle',
                'error': 'fa-times-circle'
            };
            return iconMap[level] || 'fa-info-circle';
        }
        
        // 格式化時間
        function formatTimeAgo(timestamp) {
            const now = new Date();
            const time = new Date(timestamp);
            const diff = now - time;
            
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);
            
            if (minutes < 1) return '剛剛';
            if (minutes < 60) return `${minutes} 分鐘前`;
            if (hours < 24) return `${hours} 小時前`;
            if (days < 7) return `${days} 天前`;
            
            const year = time.getFullYear();
            const month = String(time.getMonth() + 1).padStart(2, '0');
            const day = String(time.getDate()).padStart(2, '0');
            return `${year}/${month}/${day}`;
        }
    </script>
    
    <!-- 已改為上方動態載入，避免重複載入造成全域物件二次宣告 -->
    
    <script>
        // 初始化應用程式
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化 API 服務
            if (typeof initializeApiService === 'function') {
                initializeApiService();
            }
            
            // 載入導覽列
            if (typeof loadNavbar === 'function') {
                loadNavbar('student');
            }
        });
    </script>
</body>
</html>
