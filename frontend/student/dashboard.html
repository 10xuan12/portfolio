    <script>
        // 等待配置初始化完成後再載入其他腳本
        document.addEventListener('DOMContentLoaded', function() {
            // 檢查配置狀態
            
            console.log('環境:', getEnvironment());
            console.log('版本:', getVersion());
            
            // 確保配置已初始化
            if (typeof isUsingMockData === 'function' && isUsingMockData() === false) {
                // 配置正確，載入其他腳本
                loadRemainingScripts();
            } else {
                // 等待配置初始化
                setTimeout(loadRemainingScripts, 100);
            }
        });
        
        function loadRemainingScripts() {
            // 動態載入其他腳本
            const v = '20251104-1';
            const scripts = [
                `../js/api-service.js?v=${v}`,
                `../js/app.js?v=${v}`,
                `../js/student/dashboard.js?v=${v}`
            ];
            
            scripts.forEach((src, index) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = function() {
                    console.log('已載入腳本:', src);
                    // 若是 api-service.js 載入完成，主動初始化一次
                    if (src.indexOf('api-service.js') !== -1) {
                        if (typeof window.initializeApiService === 'function') {
                            console.log('呼叫 initializeApiService()');
                            window.initializeApiService();
                        } else {
                            console.warn('initializeApiService 尚不可用');
                        }
                    }
                    if (index === scripts.length - 1) {
                        // 最後一個腳本載入完成，等待 API 服務初始化
                        waitForApiService();
                    }
                };
                script.onerror = function(e) {
                    console.error('腳本載入失敗:', src, e);
                };
                document.head.appendChild(script);
            });
        }
        
        // 等待 API 服務初始化
        function waitForApiService() {
            if (typeof apiService !== 'undefined' && apiService) {
                console.log('API 服務已準備就緒');
                initializeDashboard();
            } else {
                console.log('等待 API 服務初始化...');
                // 若可用則嘗試初始化
                if (typeof window.initializeApiService === 'function') {
                    window.initializeApiService();
                }
                setTimeout(waitForApiService, 200);
            }
        }
        
        // 初始化儀表板功能
        function initializeDashboard() {
            // 載入導航欄
            if (typeof UI !== 'undefined' && UI.loadNavbar) {
                UI.loadNavbar();
            }
            
            // 更新歡迎標題
            updateWelcomeTitle();
            
            // 載入動態資料
            loadDynamicData();
            
            // 初始化新功能
            initializeNewFeatures();
            
            // 設定即時更新
            setupRealTimeUpdates();
            
            // 設定作品狀態更新監聽器
            setupPortfolioStatusListeners();

                        subtitle: '👋 學生儀表板',

                        icon: '✨',
                        duration: 4000
                    });
                }
            }, 1000);
        }
        
        // 初始化學生技能標籤雲
        async function initStudentSkillCloud() {
            const cloudContainer = document.getElementById('studentSkillCloud');
            if (!cloudContainer) {
                console.warn('找不到 studentSkillCloud 容器');
                return;
            }
            
            try {
                console.log('初始化技能標籤雲...');
                
                // 檢查 createSkillCloud 函數是否可用
                if (typeof createSkillCloud !== 'function') {
                    console.warn('createSkillCloud 函數尚未載入');
                    cloudContainer.innerHTML = `
                        <div style="text-align: center; color: #666; padding: 20px;">
                            <i class="fas fa-tags" style="font-size: 62.4px; margin-bottom: 10px; opacity: 0.3;"></i>
                            <p>技能標籤雲載入中...</p>
                        </div>
                    `;
                    return;
                }
                
                // 顯示載入中狀態
                cloudContainer.innerHTML = `
                    <div style="text-align: center; color: #666; padding: 20px;">
                        <i class="fas fa-spinner fa-spin" style="font-size: 31.2px; margin-bottom: 10px;"></i>
                        <p>正在載入您的技能數據...</p>
                    </div>
                `;
                
                // 從 API 獲取學生作品數據
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                const userId = user.id;
                
                if (!userId) {
                    throw new Error('無法取得使用者 ID');
                }
                
                console.log('正在獲取學生 ID', userId, '的作品數據...');
                
                const response = await fetch(`${getApiBase()}/student/portfolio.php?action=list&user_id=${userId}&limit=100`);
                const data = await response.json();
                
                if (!data || !data.data || data.data.length === 0) {
                    console.log('沒有找到作品，顯示空狀態');
                    cloudContainer.innerHTML = `
                        <div style="text-align: center; color: #666; padding: 20px;">
                            <i class="fas fa-folder-open" style="font-size: 62.4px; margin-bottom: 10px; opacity: 0.3;"></i>
                            <p>尚無作品數據</p>
                            <p style="font-size: 14px; color: #999;">上傳作品後，系統會自動分析您的技能</p>
                        </div>
                    `;
                    return;
                }
                
                // 從作品標籤中提取技能統計
                const skillMap = {};
                const portfolios = data.data;
                
                console.log('正在分析', portfolios.length, '個作品的標籤...');
                
                portfolios.forEach(portfolio => {
                    let tags = [];
                    
                    // 處理標籤（可能是陣列或逗號分隔的字串）
                    if (Array.isArray(portfolio.tags)) {
                        tags = portfolio.tags;
                    } else if (typeof portfolio.tags === 'string' && portfolio.tags) {
                        tags = portfolio.tags.split(',').map(t => t.trim()).filter(t => t);
                    }
                    
                    // 統計每個標籤出現的次數
                    tags.forEach(tag => {
                        if (tag) {
                            if (!skillMap[tag]) {
                                skillMap[tag] = {
                                    name: tag,
                                    count: 0,
                                    category: categorizeSkill(tag),
                                    showLevel: true
                                };
                            }
                            skillMap[tag].count++;
                        }
                    });
                });
                
                // 轉換為陣列並計算等級
                const skills = Object.values(skillMap).map(skill => {
                    // 根據使用次數計算等級 (1-5)
                    let level = 1;
                    if (skill.count >= 10) level = 5;
                    else if (skill.count >= 7) level = 4;
                    else if (skill.count >= 5) level = 3;
                    else if (skill.count >= 3) level = 2;
                    
                    return {
                        ...skill,
                        level: level,
                        icon: getSkillIcon(skill.name)
                    };
                });
                
                // 按使用次數排序，取前20個
                skills.sort((a, b) => b.count - a.count);
                const topSkills = skills.slice(0, 20);
                
                console.log('分析完成，找到', skills.length, '個技能，顯示前', topSkills.length, '個');
                
                if (topSkills.length === 0) {
                    cloudContainer.innerHTML = `
                        <div style="text-align: center; color: #666; padding: 20px;">
                            <i class="fas fa-tags" style="font-size: 62.4px; margin-bottom: 10px; opacity: 0.3;"></i>
                            <p>尚無技能標籤</p>
                            <p style="font-size: 14px; color: #999;">為作品添加標籤後，這裡會顯示您的技能分布</p>
                        </div>
                    `;
                    return;
                }
                
                // 創建技能雲
                createSkillCloud('studentSkillCloud', topSkills, {
                    interactive: true,
                    showStats: true,
                    showFilter: false,
                    onClick: (skill, selectedSkills) => {
                        console.log('選中技能:', skill.name);
                    }
                });
                
            } catch (error) {
                console.error('初始化技能標籤雲失敗:', error);
                cloudContainer.innerHTML = `
                    <div style="text-align: center; color: #d9534f; padding: 20px;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 31.2px; margin-bottom: 10px;"></i>
                        <p>技能標籤雲載入失敗</p>
                        <small style="color: #999;">${error.message}</small>
                    </div>
                `;
            }
        }
        
        // 根據技能名稱分類（支援多種領域）
        function categorizeSkill(skillName) {
            const lowerName = skillName.toLowerCase();
            
            // 資訊技術類
            if (['html', 'css', 'javascript', 'js', 'react', 'vue', 'angular', 'typescript', 'sass', 'less', 'webpack', '前端'].some(k => lowerName.includes(k))) {
                return '前端技術';
            } else if (['python', 'java', 'c++', 'c#', 'go', 'rust', 'ruby', 'kotlin', 'swift', '程式', '編程'].some(k => lowerName.includes(k))) {
                return '程式語言';
            } else if (['node.js', 'nodejs', 'php', 'django', 'flask', 'express', 'spring', 'laravel', '.net', '後端', 'api'].some(k => lowerName.includes(k))) {
                return '後端技術';
            } else if (['mysql', 'postgresql', 'mongodb', 'redis', 'sqlite', 'oracle', 'sql', '資料庫', '數據庫'].some(k => lowerName.includes(k))) {
                return '資料庫';
            } else if (['git', 'github', 'docker', 'kubernetes', 'jenkins', 'ci/cd', 'aws', 'azure', 'gcp', '部署'].some(k => lowerName.includes(k))) {
                return '開發工具';
            } else if (['android', 'ios', 'react native', 'flutter', 'xamarin', 'app', '行動', '手機'].some(k => lowerName.includes(k))) {
                return '行動開發';
            } 
            // 設計藝術類
            else if (['figma', 'photoshop', 'illustrator', 'xd', 'sketch', 'indesign', '平面設計', '視覺設計', '海報', 'logo', '品牌', '排版'].some(k => lowerName.includes(k))) {
                return '平面設計';
            } else if (['ui', 'ux', '介面設計', '使用者體驗', '互動設計', '原型', 'wireframe'].some(k => lowerName.includes(k))) {
                return 'UI/UX設計';
            } else if (['3d', 'blender', 'maya', 'cinema 4d', 'c4d', 'zbrush', '建模', '渲染', '動畫'].some(k => lowerName.includes(k))) {
                return '3D設計';
            } else if (['插畫', '繪畫', '手繪', 'procreate', '水彩', '素描', '漫畫', '角色設計'].some(k => lowerName.includes(k))) {
                return '插畫繪圖';
            } else if (['攝影', 'photography', 'lightroom', '修圖', '人像', '風景', '商業攝影'].some(k => lowerName.includes(k))) {
                return '攝影';
            } else if (['影片', '剪輯', 'premiere', 'final cut', 'davinci', 'after effects', '特效', '調色', '影像'].some(k => lowerName.includes(k))) {
                return '影片製作';
            }
            // 商管行銷類

        // 設定 WebSocket 連接（暫時禁用，等待後端支援）
        function setupWebSocketConnection() {
            // WebSocket 功能暫時禁用
            return;
            
            try {
                const ws = new WebSocket('ws://localhost:8000/ws');
                
                ws.onopen = function() {
                    console.log('WebSocket 連接已建立');
                };
                
                ws.onmessage = function(event) {
                    const data = JSON.parse(event.data);
                    handleWebSocketMessage(data);
                };
                
                ws.onerror = function(error) {
                    console.error('WebSocket 錯誤:', error);
                };
                
                ws.onclose = function() {
                    console.log('WebSocket 連接已關閉');
                    // 5 秒後嘗試重新連接
                    setTimeout(setupWebSocketConnection, 5000);
                };
            } catch (error) {
                console.warn('WebSocket 不可用:', error);
            }
        }
        
        // 處理 WebSocket 訊息
        function handleWebSocketMessage(data) {
            switch (data.type) {
                case 'notification':
                    showNotification(data.message, data.level || 'info');
                    break;
                case 'portfolio_update':
                    updatePortfolioStatus(data.portfolio_id, data.status);
                    break;
                case 'activity':
                    addNewActivity(data.activity);
                    break;
                case 'badge_earned':
                    showBadgeEarnedNotification(data.badge);
                    break;
                default:
                    console.log('未知的 WebSocket 訊息類型:', data.type);
            }
        }

        // 格式化時間
        function formatTimeAgo(timestamp) {
            const now = new Date();
            const time = new Date(timestamp);
            const diff = now - time;
            
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);
            
            if (minutes < 1) return '剛剛';
            if (minutes < 60) return `${minutes} 分鐘前`;
            if (hours < 24) return `${hours} 小時前`;
            if (days < 7) return `${days} 天前`;
            
            const year = time.getFullYear();
            const month = String(time.getMonth() + 1).padStart(2, '0');
            const day = String(time.getDate()).padStart(2, '0');
            return `${year}/${month}/${day}`;
        }

                        <small style="color: #999;">${error.message}</small>
                    </div>
                `;
            }
        }
    </script>
