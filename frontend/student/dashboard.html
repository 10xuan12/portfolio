    <script>
        // 等待配置初始化完成後再載入其他腳本
        document.addEventListener('DOMContentLoaded', function() {
            // 檢查配置狀態
            console.log('當前模式:', isUsingMockData() ? '假資料' : '真實API');
            console.log('環境:', getEnvironment());
            console.log('版本:', getVersion());
            
            // 確保配置已初始化
            if (typeof isUsingMockData === 'function' && isUsingMockData() === false) {
                // 配置正確，載入其他腳本
                loadRemainingScripts();
            } else {
                // 等待配置初始化
                setTimeout(loadRemainingScripts, 100);
            }
        });
        
        function loadRemainingScripts() {
            // 動態載入其他腳本
            const v = '20251020-1';
            const scripts = [
                `../js/api-service.js?v=${v}`,
                `../js/app.js?v=${v}`,
                `../js/student/dashboard.js?v=${v}`
            ];
            
            scripts.forEach((src, index) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = function() {
                    console.log('已載入腳本:', src);
                    // 若是 api-service.js 載入完成，主動初始化一次
                    if (src.indexOf('api-service.js') !== -1) {
                        if (typeof window.initializeApiService === 'function') {
                            console.log('呼叫 initializeApiService()');
                            window.initializeApiService();
                        } else {
                            console.warn('initializeApiService 尚不可用');
                        }
                    }
                    if (index === scripts.length - 1) {
                        // 最後一個腳本載入完成，等待 API 服務初始化
                        waitForApiService();
                    }
                };
                script.onerror = function(e) {
                    console.error('腳本載入失敗:', src, e);
                };
                document.head.appendChild(script);
            });
        }
        
        // 等待 API 服務初始化
        function waitForApiService() {
            if (typeof apiService !== 'undefined' && apiService) {
                console.log('API 服務已準備就緒');
                initializeDashboard();
            } else {
                console.log('等待 API 服務初始化...');
                // 若可用則嘗試初始化
                if (typeof window.initializeApiService === 'function') {
                    window.initializeApiService();
                }
                setTimeout(waitForApiService, 200);
            }
        }
        
        // 初始化儀表板功能
        function initializeDashboard() {
            // 載入導航欄
            if (typeof UI !== 'undefined' && UI.loadNavbar) {
                UI.loadNavbar();
            }
            
            // 更新歡迎標題
            updateWelcomeTitle();
            
            // 載入動態資料
            loadDynamicData();
            
            // 設定即時更新
            setupRealTimeUpdates();
            
            // 設定作品狀態更新監聽器
            setupPortfolioStatusListeners();
            
            // 初始化新功能
            initializeNewFeatures();
        }
        
        // 初始化新功能
        function initializeNewFeatures() {
            // 初始化技能標籤雲
            initStudentSkillCloud();
            
            // 初始化技能雷達圖預覽
            initSkillRadarPreview();
            
            // 初始化作品時光機預覽
            initPortfolioTimelinePreview();
            
            // 顯示歡迎通知
            setTimeout(() => {
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                if (user.name) {
                    showAchievement({
                        type: 'badge',
                        title: `歡迎回來，${user.name}！`,
                        subtitle: '👋 學生儀表板',
                        description: '繼續展示您的精彩作品',
                        icon: '✨',
                        duration: 4000
                    });
                }
            }, 1000);
        }
        
        // 初始化學生技能標籤雲
        async function initStudentSkillCloud() {
            try {
                // 這裡可以從 API 獲取技能數據，目前使用示例數據
                const skills = [
                    { name: 'HTML', level: 5, category: '前端技術', count: 95, icon: '🌐', showLevel: true },
                    { name: 'CSS', level: 5, category: '前端技術', count: 90, icon: '🎨', showLevel: true },
                    { name: 'JavaScript', level: 4, category: '程式語言', count: 75, icon: '💛', showLevel: true },
                    { name: 'React', level: 3, category: '前端框架', count: 35, icon: '⚛️', showLevel: true },
                    { name: 'PHP', level: 4, category: '後端技術', count: 60, icon: '🐘', showLevel: true },
                    { name: 'MySQL', level: 4, category: '資料庫', count: 55, icon: '🗄️', showLevel: true },
                    { name: 'Git', level: 3, category: '工具', count: 40, icon: '📦', showLevel: true },
                    { name: 'Figma', level: 3, category: '設計工具', count: 30, icon: '🎨', showLevel: true }
                ];
                
                createSkillCloud('studentSkillCloud', skills, {
                    interactive: true,
                    showStats: true,
                    showFilter: false,
                    onClick: (skill, selectedSkills) => {
                        console.log('選中技能:', skill.name);
                    }
                });
            } catch (error) {
                console.error('初始化技能標籤雲失敗:', error);

        // 更新歡迎標題
        function updateWelcomeTitle() {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            const welcomeTitle = document.getElementById('welcome-title');
            if (welcomeTitle && user.name) {
                welcomeTitle.textContent = `歡迎回來，${user.name}！`;

        // 載入動態資料
        function loadDynamicData() {

        }
        
        // 載入作品列表
        function loadPortfolios() {
            const portfolioGrid = document.getElementById('portfolio-grid');
            if (!portfolioGrid) return;
            
            // 這裡會由 dashboard.js 處理
            if (typeof loadDashboardData === 'function') {
                loadDashboardData();
            }
        }
        
        // 載入最近活動
        function loadRecentActivities() {
            const activityList = document.getElementById('recent-activity');
            if (!activityList) return;
            
            // 這裡會由 dashboard.js 處理
        }
        
        // 載入徽章成就
        function loadBadges() {
            const badgesContainer = document.getElementById('badges-container');
            if (!badgesContainer) return;
            
            // 這裡會由 dashboard.js 處理
        }
        
        // 載入企業互動
        function loadEnterpriseInteractions() {
            const interactionsContainer = document.getElementById('enterprise-interactions');
            if (!interactionsContainer) return;
            
            // 這裡會由 dashboard.js 處理
        }
        
        // 設定即時更新
        function setupRealTimeUpdates() {
            // 每 30 秒更新一次資料
            setInterval(() => {
                if (typeof apiService !== 'undefined') {
                    loadDynamicData();
                }
            }, 30000);
            
            // 設定 WebSocket 連接（如果可用）
            if (typeof WebSocket !== 'undefined' && typeof APP_CONFIG !== 'undefined' && APP_CONFIG.ENABLE_WEBSOCKET) {
                setupWebSocketConnection();
            }
        }
        
        // 設定 WebSocket 連接
        function setupWebSocketConnection() {
            try {
                const ws = new WebSocket('ws://localhost:8000/ws');
                
                ws.onopen = function() {
                    console.log('WebSocket 連接已建立');
                };
                
                ws.onmessage = function(event) {
                    const data = JSON.parse(event.data);
                    handleWebSocketMessage(data);
                };
                
                ws.onerror = function(error) {
                    console.error('WebSocket 錯誤:', error);
                };
                
                ws.onclose = function() {
                    console.log('WebSocket 連接已關閉');
                    // 5 秒後嘗試重新連接
                    setTimeout(setupWebSocketConnection, 5000);
                };
            } catch (error) {
                console.warn('WebSocket 不可用:', error);
            }
        }
        
        // 處理 WebSocket 訊息
        function handleWebSocketMessage(data) {
            switch (data.type) {
                case 'notification':
                    showNotification(data.message, data.level || 'info');
                    break;
                case 'portfolio_update':
                    updatePortfolioStatus(data.portfolio_id, data.status);
                    break;
                case 'activity':
                    addNewActivity(data.activity);
                    break;
                case 'badge_earned':
                    showBadgeEarnedNotification(data.badge);
                    break;
                default:
                    console.log('未知的 WebSocket 訊息類型:', data.type);
            }
        }
        
        // 設定作品狀態更新監聽器
        function setupPortfolioStatusListeners() {
            // 監聽作品狀態變化
            document.addEventListener('portfolioStatusChanged', function(event) {
                const { portfolioId, newStatus } = event.detail;
                updatePortfolioStatus(portfolioId, newStatus);
            });
        }
        
        // 更新作品狀態
        function updatePortfolioStatus(portfolioId, newStatus) {
            const portfolioItem = document.querySelector(`[data-portfolio-id="${portfolioId}"]`);
            if (portfolioItem) {
                const statusElement = portfolioItem.querySelector('.portfolio-status');
                if (statusElement) {
                    statusElement.textContent = getStatusText(newStatus);
                    statusElement.className = `portfolio-status status-${newStatus}`;
                }
            }
        }
        
        // 取得狀態文字
        function getStatusText(status) {
            const statusMap = {
                'published': '已發布',
                'review': '審核中',
                'draft': '草稿',
                'rejected': '已拒絕'
            };
            return statusMap[status] || status;
        }
        
        // 新增活動
        function addNewActivity(activity) {
            const activityList = document.getElementById('recent-activity');
            if (!activityList) return;
            
            const activityItem = document.createElement('li');
            activityItem.innerHTML = `
                <div class="activity-icon activity-${activity.type}">
                    <i class="fas ${getActivityIcon(activity.type)}"></i>
                </div>
                <div>
                    <div>${activity.text}</div>
                    <small>${formatTimeAgo(activity.timestamp)}</small>
                </div>
            `;
            
            // 插入到列表開頭
            activityList.insertBefore(activityItem, activityList.firstChild);
            
            // 移除舊的活動項目（保持最多 5 個）
            const items = activityList.querySelectorAll('li');
            if (items.length > 5) {
                items[items.length - 1].remove();
            }
        }
        
        // 取得活動圖示
        function getActivityIcon(type) {
            const iconMap = {
                'upload': 'fa-upload',
                'view': 'fa-eye',
                'like': 'fa-heart',
                'comment': 'fa-comment',
                'badge': 'fa-star'
            };
            return iconMap[type] || 'fa-info-circle';
        }
        
        // 顯示徽章獲得通知
        function showBadgeEarnedNotification(badge) {
            const notification = document.createElement('div');
            notification.className = 'badge-notification';
            notification.innerHTML = `
                <div class="badge-notification-content">
                    <i class="fas fa-star"></i>
                    <span>恭喜獲得徽章：${badge.name}！</span>
                </div>
            `;
            
            document.body.appendChild(notification);
            
            // 3 秒後自動移除
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
        
        // 顯示通知
        function showNotification(message, level = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification notification-${level}`;
            notification.innerHTML = `
                <div class="notification-content">
                    <i class="fas ${getNotificationIcon(level)}"></i>
                    <span>${message}</span>
                </div>
            `;
            
            document.body.appendChild(notification);
            
            // 5 秒後自動移除
            setTimeout(() => {
                notification.remove();
            }, 5000);
        }
        
        // 取得通知圖示
        function getNotificationIcon(level) {
            const iconMap = {
                'info': 'fa-info-circle',
                'success': 'fa-check-circle',
                'warning': 'fa-exclamation-triangle',
                'error': 'fa-times-circle'
            };
            return iconMap[level] || 'fa-info-circle';
        }
        
        // 格式化時間
        function formatTimeAgo(timestamp) {
            const now = new Date();
            const time = new Date(timestamp);
            const diff = now - time;
            
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);
            
            if (minutes < 1) return '剛剛';
            if (minutes < 60) return `${minutes} 分鐘前`;
            if (hours < 24) return `${hours} 小時前`;
            if (days < 7) return `${days} 天前`;
            
            const year = time.getFullYear();
            const month = String(time.getMonth() + 1).padStart(2, '0');
            const day = String(time.getDate()).padStart(2, '0');
            return `${year}/${month}/${day}`;
        }
        
        // 初始化技能雷達圖預覽
        async function initSkillRadarPreview() {
            try {
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                const studentId = user.id || 5; // 預設使用學生ID 5
                
                const response = await fetch(`/portfolio/api/student/skill-analysis.php?action=get_skill_analysis&student_id=${studentId}`);
                const data = await response.json();
                
                if (data.success && data.data.radarChartData) {
                    const previewContainer = document.getElementById('skillRadarPreview');
                    previewContainer.innerHTML = `
                        <div style="text-align: center;">
                            <canvas id="skillRadarPreviewChart" width="300" height="200"></canvas>
                            <p style="margin-top: 10px; color: #666; font-size: 14px;">
                                基於您的作品分析技能分佈
                            </p>
                        </div>
                    `;
                    
                    const ctx = document.getElementById('skillRadarPreviewChart').getContext('2d');
                    new Chart(ctx, {
                        type: 'radar',
                        data: data.data.radarChartData,
                        options: {
                            responsive: false,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false }
                            },
                            scales: {
                                r: {
                                    suggestedMin: 0,
                                    suggestedMax: 100,
                                    pointLabels: { font: { size: 10 } }
                                }
                            }
                        }
                    });
                } else {
                    document.getElementById('skillRadarPreview').innerHTML = `
                        <div style="text-align: center; color: #666; padding: 20px;">
                            <i class="fas fa-chart-radar" style="font-size: 48px; margin-bottom: 10px; opacity: 0.3;"></i>
                            <p>暫無技能分析資料</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('載入技能雷達圖預覽失敗:', error);
                document.getElementById('skillRadarPreview').innerHTML = `
                    <div style="text-align: center; color: #999; padding: 20px;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 24px; margin-bottom: 10px;"></i>
                        <p>載入技能分析中...</p>
                    </div>
                `;
            }
        }
        
        // 初始化作品時光機預覽
        async function initPortfolioTimelinePreview() {
            try {
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                const studentId = user.id || 5; // 預設使用學生ID 5
                
                const response = await fetch(`/portfolio/api/student/portfolio.php?action=list&user_id=${studentId}`);
                const data = await response.json();
                
                if (data.success && data.data && data.data.length > 0) {
                    const portfolios = data.data.slice(0, 3); // 只顯示最近3個作品
                    const previewContainer = document.getElementById('portfolioTimelinePreview');
                    
                    let timelineHtml = '<div class="timeline-preview">';
                    portfolios.forEach((portfolio, index) => {
                        const date = new Date(portfolio.published_at);
                        const year = date.getFullYear();
                        const month = date.getMonth() + 1;
                        const day = date.getDate();
                        
                        timelineHtml += `
                            <div class="timeline-item-preview" style="display: flex; align-items: center; margin-bottom: 15px; padding: 10px; background: #f8f9fa; border-radius: 8px;">
                                <div class="timeline-dot-preview" style="width: 12px; height: 12px; background: #007bff; border-radius: 50%; margin-right: 15px; flex-shrink: 0;"></div>
                                <div style="flex: 1;">
                                    <div style="font-size: 12px; color: #666; margin-bottom: 2px;">${year}/${month}/${day}</div>
                                    <div style="font-weight: 500; font-size: 14px; margin-bottom: 2px;">${portfolio.title}</div>
                                    <div style="font-size: 12px; color: #888;">${portfolio.description.substring(0, 50)}...</div>
                                </div>
                            </div>
                        `;
                    });
                    timelineHtml += '</div>';
                    
                    if (data.data.length > 3) {
                        timelineHtml += `
                            <div style="text-align: center; margin-top: 10px;">
                                <small style="color: #666;">還有 ${data.data.length - 3} 個作品...</small>
                            </div>
                        `;
                    }
                    
                    previewContainer.innerHTML = timelineHtml;
                } else {
                    document.getElementById('portfolioTimelinePreview').innerHTML = `
                        <div style="text-align: center; color: #666; padding: 20px;">
                            <i class="fas fa-history" style="font-size: 48px; margin-bottom: 10px; opacity: 0.3;"></i>
                            <p>暫無作品歷程</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('載入作品時光機預覽失敗:', error);
                document.getElementById('portfolioTimelinePreview').innerHTML = `
                    <div style="text-align: center; color: #999; padding: 20px;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 24px; margin-bottom: 10px;"></i>
                        <p>載入作品歷程中...</p>
                    </div>
                `;
            }
        }
    </script>
