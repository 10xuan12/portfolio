<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>職缺詳情 - Portfolio+</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/student/job-detail.css">
    <link rel="stylesheet" href="../css/student/job-detail-variants.css">
</head>
<body>
    <!-- 導覽列 -->
    <div id="navbar-placeholder"></div>
    <script>
    (function() {
      var role = (localStorage.getItem('user') && JSON.parse(localStorage.getItem('user')).role) || null;
      var path = '../navbar.html';
      fetch(path)
        .then(res => res.text())
        .then(html => {
          var temp = document.createElement('div');
          temp.innerHTML = html;
          var tplId = 'navbar-visitor';
          if (role === 'student') tplId = 'navbar-student';
          else if (role === 'enterprise') tplId = 'navbar-enterprise';
          else if (role === 'admin') tplId = 'navbar-admin';
          var tpl = temp.querySelector('#' + tplId);
          if (tpl) document.getElementById('navbar-placeholder').innerHTML = tpl.innerHTML;
        });
    })();
    </script>

    <!-- 職缺詳情標題 -->
    <section class="job-detail-header">
        <div class="container">
            <div class="header-top">
                <button class="btn-back" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i>
                    返回
                </button>
            </div>
            <div class="job-hero">
                <div class="hero-content">
                    <div class="company-info">
                        <div class="company-details">
                            <h2 id="companyName">企業名稱</h2>
                            <span class="job-status status-active" id="jobStatus">招募中</span>
                        </div>
                    </div>
                    <div class="job-title-wrapper">
                        <div class="job-title-header">
                            <h1 class="job-title" id="jobTitle">職缺標題</h1>
                            <div class="job-header-actions">
                                <div class="job-header-info">
                                    <div class="info-row">
                                        <i class="bi bi-calendar3"></i>
                                        <span>發布日期：<span id="publishedDateHeader">-</span></span>
                                    </div>
                                    <div class="info-row" id="deadlineRowHeader" style="display: none;">
                                        <i class="bi bi-clock"></i>
                                        <span>截止日期：<span id="deadlineDateHeader">-</span></span>
                                    </div>
                                </div>
                                <div class="job-header-buttons">
                                    <button class="btn btn-primary" id="applyButtonHeader" onclick="applyJob()">
                                        <i class="bi bi-send"></i>
                                        立即申請
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="job-meta" id="jobMeta">
                            <!-- 動態載入 -->
                        </div>
                    </div>
                </div>
                <!-- 職缺標籤區域 -->
                <div class="job-tags-container" id="jobTagsContainer">
                    <!-- 動態載入標籤 -->
                </div>
                <!-- 職缺元資訊 -->
                <div class="job-meta-info" id="jobMetaInfo">
                    <!-- 動態載入 -->
                </div>
            </div>
        </div>
    </section>

    <!-- 主要內容 -->
    <section class="job-detail-container variant-5">
        <div class="container">
            <div class="job-detail-content">
                <div class="main-content">
                    <!-- 導航標籤 -->
                    <div class="job-tabs">
                        <button class="tab-btn active" data-tab="description">
                            <i class="bi bi-file-text"></i> 工作內容
                        </button>
                        <button class="tab-btn" data-tab="requirements">
                            <i class="bi bi-person-badge"></i> 要求條件
                        </button>
                        <button class="tab-btn" data-tab="company">
                            <i class="bi bi-building"></i> 公司資訊
                        </button>
                        <button class="tab-btn" data-tab="benefits">
                            <i class="bi bi-gift"></i> 福利資訊
                        </button>
                    </div>

                    <!-- 職缺描述 -->
                    <div class="tab-content active" id="tab-description">
                        <div class="job-section">
                            <h3><i class="bi bi-file-text"></i> 職缺描述</h3>
                            <div class="section-content" id="jobDescription">
                                <!-- 動態載入 -->
                            </div>
                        </div>
                        <div class="job-section" id="responsibilitiesSection" style="display: none;">
                            <h3><i class="bi bi-list-check"></i> 工作職責</h3>
                            <div class="section-content" id="jobResponsibilities">
                                <!-- 動態載入 -->
                            </div>
                        </div>
                    </div>

                    <!-- 要求條件 -->
                    <div class="tab-content" id="tab-requirements">
                        <div class="job-section">
                            <h3><i class="bi bi-tags"></i> 技能要求</h3>
                            <div class="section-content">
                                <div class="requirements-list" id="requirementsList">
                                    <!-- 動態載入 -->
                                </div>
                            </div>
                        </div>
                        <div class="job-section">
                            <h3><i class="bi bi-person-badge"></i> 職位要求</h3>
                            <div class="section-content">
                                <div class="requirements-grid">
                                    <div class="requirement-item">
                                        <i class="bi bi-briefcase"></i>
                                        <div>
                                            <label>經驗要求</label>
                                            <span id="experienceLevel">不拘</span>
                                        </div>
                                    </div>
                                    <div class="requirement-item">
                                        <i class="bi bi-mortarboard"></i>
                                        <div>
                                            <label>學歷要求</label>
                                            <span id="educationLevel">不拘</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 薪資與福利 -->
                    <div class="job-section">
                        <h3><i class="bi bi-currency-dollar"></i> 薪資與福利</h3>
                        <div class="section-content">
                            <div class="salary-info">
                                <div class="salary-item">
                                    <i class="bi bi-cash-stack"></i>
                                    <div>
                                        <label>薪資範圍</label>
                                        <span id="salaryRange">面議</span>
                                    </div>
                                </div>
                            </div>
                            <div class="benefits-content" id="benefitsContent" style="display: none;">
                                <h4>福利待遇</h4>
                                <div id="benefitsText"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 公司資訊 -->
                    <div class="tab-content" id="tab-company">
                        <div class="job-section">
                            <h3><i class="bi bi-building"></i> 企業資訊</h3>
                            <div class="section-content">
                                <div class="company-info-grid" id="companyInfoGrid">
                                    <!-- 動態載入 -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 福利資訊 -->
                    <div class="tab-content" id="tab-benefits">
                        <div class="job-section">
                            <h3><i class="bi bi-currency-dollar"></i> 薪資與福利</h3>
                            <div class="section-content">
                                <div class="salary-info">
                                    <div class="salary-item">
                                        <i class="bi bi-cash-stack"></i>
                                        <div>
                                            <label>薪資範圍</label>
                                            <span id="salaryRange">面議</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="benefits-content" id="benefitsContent" style="display: none;">
                                    <h4>福利待遇</h4>
                                    <div id="benefitsText"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 側邊欄 -->
                <div class="sidebar">
                    <div class="sidebar-card apply-card">
                        <div class="apply-info">
                            <div class="info-item">
                                <i class="bi bi-calendar3"></i>
                                <span>發布日期：<span id="publishedDate">-</span></span>
                            </div>
                            <div class="info-item" id="deadlineItem" style="display: none;">
                                <i class="bi bi-clock"></i>
                                <span>截止日期：<span id="deadlineDate">-</span></span>
                            </div>
                            <div class="info-item">
                                <i class="bi bi-eye"></i>
                                <span>瀏覽次數：<span id="viewCount">0</span></span>
                            </div>
                            <div class="info-item">
                                <i class="bi bi-people"></i>
                                <span>申請人數：<span id="applicationCount">0</span></span>
                            </div>
                        </div>
                        <button class="btn btn-primary btn-apply" id="applyButton" onclick="applyJob()">
                            <i class="bi bi-send"></i>
                            立即申請
                        </button>
                        <button class="btn btn-outline btn-bookmark" id="bookmarkButton" onclick="toggleBookmark()">
                            <i class="bi bi-bookmark" id="bookmarkIcon"></i>
                            <span id="bookmarkText">收藏職缺</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 頁腳 -->
    <div id="footer-placeholder"></div>

    <!-- JavaScript 檔案 -->
    <script src="../js/config.js"></script>
    <script src="../js/api-service.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/student/job-detail.js"></script>
    
    <script>
        // 回到上一頁
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
