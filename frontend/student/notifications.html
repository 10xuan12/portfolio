<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通知中心 - Portfolio+</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/student/notification.css">

</head>
<body>
    <!-- 導覽列 -->
    <div id="navbar-placeholder"></div>
    <script>
    (function() {
      var role = (localStorage.getItem('user') && JSON.parse(localStorage.getItem('user')).role) || null;
      var path = '../navbar.html';
      fetch(path)
        .then(res => res.text())
        .then(html => {
          var temp = document.createElement('div');
          temp.innerHTML = html;
          var tplId = 'navbar-visitor';
          if (role === 'student') tplId = 'navbar-student';
          else if (role === 'enterprise') tplId = 'navbar-enterprise';
          else if (role === 'admin') tplId = 'navbar-admin';
          var tpl = temp.querySelector('#' + tplId);
          if (tpl) document.getElementById('navbar-placeholder').innerHTML = tpl.innerHTML;
        });
    })();
    </script>

    <!-- 主要內容 -->
    <section class="notifications-container">
        <div class="container">
            <div class="notifications-header">
                <div class="header-top">
                    <button class="btn-back" onclick="goBack()">
                        <i class="fas fa-arrow-left"></i>
                        返回
                    </button>
                </div>
                <h1 class="notifications-title">通知中心</h1>
                <div class="notifications-actions">
                    <button class="btn btn-outline" onclick="selectAll()">
                        <i class="fas fa-check-square"></i>
                        全選
                    </button>
                    <button class="btn btn-outline" onclick="markAllRead()">
                        <i class="fas fa-check-double"></i>
                        全部標記已讀
                    </button>
                    <button class="btn btn-primary" onclick="deleteSelected()">
                        <i class="fas fa-trash"></i>
                        刪除選取
                    </button>
                </div>
            </div>

            <!-- 統計卡片 -->
            <div class="notification-stats">
                <div class="stat-card">
                    <div class="stat-number">12</div>
                    <div class="stat-label">未讀通知</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">45</div>
                    <div class="stat-label">總通知數</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">8</div>
                    <div class="stat-label">今日通知</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">3</div>
                    <div class="stat-label">企業訊息</div>
                </div>
            </div>

            <!-- 篩選欄 -->
            <div class="filter-bar">
                <div class="filter-grid">
                    <div class="filter-group">
                        <label>通知類型</label>
                        <select id="typeFilter">
                            <option value="">全部類型</option>
                            <option value="like">讚</option>
                            <option value="comment">評論</option>
                            <option value="view">瀏覽</option>
                            <option value="system">系統</option>
                            <option value="enterprise">企業</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>狀態</label>
                        <select id="statusFilter">
                            <option value="">全部狀態</option>
                            <option value="unread">未讀</option>
                            <option value="read">已讀</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>時間範圍</label>
                        <select id="timeFilter">
                            <option value="">全部時間</option>
                            <option value="today">今天</option>
                            <option value="week">本週</option>
                            <option value="month">本月</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>&nbsp;</label>
                        <button class="btn btn-primary" onclick="applyFilters()">篩選</button>
                    </div>
                </div>
            </div>

            <!-- 批量操作 -->
            <div class="bulk-actions" id="bulkActions">
                <div class="bulk-actions-left">
                    <span id="selectedCount">已選擇 0 項</span>
                </div>
                <div class="bulk-actions-right">
                    <button class="btn btn-outline" onclick="markSelectedRead()">
                        <i class="fas fa-check"></i>
                        標記已讀
                    </button>
                    <button class="btn btn-outline" onclick="deleteSelected()">
                        <i class="fas fa-trash"></i>
                        刪除
                    </button>
                </div>
            </div>

            <!-- 通知列表 -->
            <div class="notifications-list" id="notificationsList">
                <!-- 通知列表將由 JavaScript 動態載入 -->
            </div>

            <!-- 空狀態 -->
            <div class="empty-state" id="emptyState">
                <i class="fas fa-bell-slash"></i>
                <h3>沒有通知</h3>
                <p>當有新的活動時，您會在這裡看到通知</p>
            </div>
        </div>
    </section>

    <!-- 頁腳 -->
    <div id="footer-placeholder"></div>

    <!-- JavaScript 檔案 -->
    <script src="../js/config.js"></script>
    <script src="../js/api-service.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/student/notifications.js"></script>
    
    <script>
        // 初始化應用程式
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化 API 服務
            if (typeof initializeApiService === 'function') {
                initializeApiService();
            }
            
            // 載入導覽列
            if (typeof loadNavbar === 'function') {
                loadNavbar('student');
            }
            
            // 載入通知
            if (typeof loadNotifications === 'function') {
                loadNotifications();
            }
        });

        // 回到上一頁
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
