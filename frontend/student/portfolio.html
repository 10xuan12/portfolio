<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品集管理 - Portfolio+</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/student/portfolio.css">

</head>
<body>
    <!-- 導覽列 -->
    <div id="navbar-placeholder"></div>
    <script>
    (function() {
      var role = (localStorage.getItem('user') && JSON.parse(localStorage.getItem('user')).role) || null;
      var path = '../navbar.html';
      fetch(path)
        .then(res => res.text())
        .then(html => {
          var temp = document.createElement('div');
          temp.innerHTML = html;
          var tplId = 'navbar-visitor';
          if (role === 'student') tplId = 'navbar-student';
          else if (role === 'enterprise') tplId = 'navbar-enterprise';
          else if (role === 'admin') tplId = 'navbar-admin';
          var tpl = temp.querySelector('#' + tplId);
          if (tpl) document.getElementById('navbar-placeholder').innerHTML = tpl.innerHTML;
        });
    })();
    </script>

    <!-- 主要內容 -->
    <section class="portfolio-container">
        <div class="container">
            <div class="portfolio-header">
                <div class="header-top">
                    <button class="btn-back" onclick="goBack()">
                        <i class="fas fa-arrow-left"></i>
                        返回
                    </button>
                </div>
                <h1 class="portfolio-title">我的作品集</h1>
                <div class="portfolio-actions">
                    <button class="btn btn-primary" onclick="openUploadModal()">
                        <i class="fas fa-plus"></i>
                        新增作品
                    </button>
                </div>
            </div>

            <!-- 篩選欄 -->
            <div class="filter-bar">
                <div class="filter-grid">
                    <div class="filter-group">
                        <label>狀態</label>
                        <select id="statusFilter">
                            <option value="">全部狀態</option>
                            <option value="published">已發布</option>
                            <option value="draft">草稿</option>
                            <option value="review">審核中</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>分類</label>
                        <select id="categoryFilter">
                            <option value="">全部分類</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>搜尋</label>
                        <input type="text" id="searchFilter" placeholder="搜尋作品標題...">
                    </div>
                    <div class="filter-group">
                        <label>&nbsp;</label>
                        <button class="btn btn-primary" onclick="applyFilters()">篩選</button>
                    </div>
                </div>
            </div>

            <!-- 作品列表 -->
            <div class="portfolio-grid" id="portfolioGrid">
                <!-- 作品列表將由 JavaScript 動態載入 -->
            </div>

            <!-- 分頁控制 -->
            <div class="portfolio-pagination" id="portfolioPagination" style="display: none; margin-top: 2rem;">
                <div class="pagination-info">
                    <span id="portfolioPaginationInfo">第 1 頁，共 1 頁</span>
                </div>
                <div class="pagination-controls">
                    <button type="button" class="pagination-btn" id="portfolioPrevPageBtn" onclick="changePortfolioPage(-1)">
                        <i class="fas fa-chevron-left"></i>
                        上一頁
                    </button>
                    <div class="pagination-numbers" id="portfolioPaginationNumbers"></div>
                    <button type="button" class="pagination-btn" id="portfolioNextPageBtn" onclick="changePortfolioPage(1)">
                        下一頁
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>

            <!-- 空狀態 -->
            <div class="empty-state" id="emptyState">
                <i class="fas fa-folder-open"></i>
                <h3>還沒有作品</h3>
                <p>開始建立您的第一個作品，展示您的才華！</p>
                <button class="btn btn-primary" onclick="openUploadModal()">
                    <i class="fas fa-plus"></i>
                    新增作品
                </button>
            </div>
        </div>
    </section>

    <!-- 頁腳 -->
    <div id="footer-placeholder"></div>

    <!-- JavaScript 檔案 -->
    <script src="../js/config.js?v=20251104-1"></script>
    <script src="../js/api-service.js?v=20251104-1"></script>
    <script src="../js/app.js?v=20251104-1"></script>
    <script src="../js/student/portfolio.js?v=20251104-1"></script>
    
    <script>
        // 初始化應用程式
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化 API 服務
            if (typeof initializeApiService === 'function') {
                initializeApiService();
            }
            
            // 載入導覽列
            if (typeof loadNavbar === 'function') {
                loadNavbar('student');
            }
            
            // 載入作品集
            if (typeof loadPortfolios === 'function') {
                loadPortfolios();
            }
        });

        // 回到上一頁
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
