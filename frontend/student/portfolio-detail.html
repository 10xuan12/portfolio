<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品詳情 - Portfolio+</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/student/portfolio-detail.css">
    <link rel="stylesheet" href="../css/student/portfolio-url.css">
</head>
<body>
    <!-- 導覽列 -->
    <div id="navbar-placeholder"></div>
    <script>
    (function() {
      var role = (localStorage.getItem('user') && JSON.parse(localStorage.getItem('user')).role) || null;
      var path = '../navbar.html';
      fetch(path)
        .then(res => res.text())
        .then(html => {
          var temp = document.createElement('div');
          temp.innerHTML = html;
          var tplId = 'navbar-visitor';
          if (role === 'student') tplId = 'navbar-student';
          else if (role === 'enterprise') tplId = 'navbar-enterprise';
          else if (role === 'admin') tplId = 'navbar-admin';
          var tpl = temp.querySelector('#' + tplId);
          if (tpl) document.getElementById('navbar-placeholder').innerHTML = tpl.innerHTML;
        });
    })();
    </script>

    <!-- 作品詳情標題 -->
    <section class="detail-header">
        <div class="container">
            <div class="header-top">
                <button class="btn-back" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i>
                    返回
                </button>
            </div>
            <div class="portfolio-hero">
                <div id="heroCover" style="background: #eef2ff; width: 100%; height: 240px;"></div>
                <div class="hero-overlay">
                    <div class="hero-title"></div>
                    <div class="hero-meta" id="heroMeta"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- 主要內容 -->
    <section class="detail-container">
        <div class="container">
            <div class="detail-content">
                <div class="main-content">
                    
                    <div class="portfolio-info">
                        <div class="info-header" style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;">
                            <div class="info-title">
                                <h1></h1>
                                <p></p>
                            </div>
                            <div class="info-actions" style="display:flex; flex-direction: column; align-items: flex-end; gap: 8px;">
                                <button class="info-status clickable" id="detailStatus" onclick="togglePortfolioStatus()"></button>
                                <button class="action-btn primary" onclick="likePortfolio()">
                                    <i class="bi bi-heart-fill"></i>
                                    讚
                                </button>
                            </div>
                        </div>
                        
                        <div class="info-stats">
                            <div class="stat-item">
                                <i class="fas fa-eye"></i>
                                <span id="statViews"></span>
                            </div>
                            <div class="stat-item">
                                <i class="fas fa-heart"></i>
                                <span id="statLikes"></span>
                            </div>
                            <div class="stat-item">
                                <i class="fas fa-comment"></i>
                                <span id="statComments"></span>
                            </div>
                            <div class="stat-item">
                                <i class="fas fa-download"></i>
                                <span id="statDownloads"></span>
                            </div>
                        </div>
                        
                        
                        
                        <div class="portfolio-description"><div id="detailContent"></div></div>
                        
                        <div class="portfolio-tags"></div>
                        
                        <!-- 作品連結區域 -->
                        <div id="portfolioUrlSection" class="portfolio-url-section" style="display: none; margin: 1.5rem 0; padding: 1.5rem; background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); border-radius: 12px; border: 2px solid #bae6fd;">
                            <h3 style="margin: 0 0 1rem 0; font-size: 1.1rem; font-weight: 600; color: #0c4a6e; display: flex; align-items: center; gap: 0.5rem;">
                                <i class="fas fa-link"></i>
                                作品連結
                            </h3>
                            <div class="portfolio-url-item">
                                <a href="#" id="portfolioUrlLink" target="_blank" rel="noopener noreferrer" class="portfolio-url-link" style="display: inline-flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; background: white; border-radius: 8px; color: #0284c7; text-decoration: none; word-break: break-all; font-weight: 500; transition: all 0.2s; border: 1px solid #bae6fd;">
                                    <i class="fas fa-external-link-alt" style="font-size: 1rem;"></i>
                                    <span id="portfolioUrlText"></span>
                                </a>
                            </div>
                        </div>
                        
                        <div class="portfolio-files">
                            <h3 class="files-title">相關檔案</h3>
                            <div class="file-list" id="fileList"></div>
                        </div>

                        
                    </div>
                </div>
                
                <!-- 側邊欄 -->
                <div class="sidebar">
                    <div class="author-card" id="authorCard">
                        <div class="author-avatar">
                            <img id="authorAvatar" src="" alt="作者頭像">
                        </div>
                        <div class="author-info">
                            <h4 id="authorName"></h4>
                            <p id="authorMeta"></p>
                            <div class="author-stats">
                                <span id="authorPortfolios"></span>
                                <span id="authorViews"></span>
                            </div>
                        </div>
                        <button class="btn btn-outline btn-sm" onclick="viewAuthorProfile()">
                            查看個人資料
                        </button>
                    </div>
                    
                    <div class="related-portfolios">
                        <h4>相關作品</h4>
                        <div class="related-list related-works"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 評論區 -->
    <section class="comments-section">
        <div class="container">
            <div class="comments-header">
                <h3>評論與回饋</h3>
                <span class="comments-count"></span>
            </div>
            
            <!-- 發表評論 -->
            <div class="comment-form-container">
                <div class="comment-form">
                    <div class="comment-avatar">
                        <img src="" alt="我的頭像" id="myAvatar">
                    </div>
                    <div class="comment-input-group">
                        <textarea id="commentInput" placeholder="分享您的想法和回饋..." rows="3"></textarea>
                        <div class="comment-actions">
                            <div class="comment-options">
                                <button type="button" class="btn-option" onclick="toggleEmojiPicker()">
                                    <i class="fas fa-smile"></i>
                                </button>
                                <button type="button" class="btn-option" onclick="toggleImageUpload()">
                                    <i class="fas fa-image"></i>
                                </button>
                            </div>
                            <button type="button" class="btn btn-primary" onclick="submitComment()">
                                <i class="fas fa-paper-plane"></i>
                                發表評論
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 評論列表 -->
            <div class="comments-list" id="commentsList">
                <!-- 評論項目將由JavaScript動態生成 -->
            </div>
            
            <!-- 載入更多評論 -->
            <div class="load-more-comments">
                <button class="btn btn-outline" onclick="loadMoreComments()">
                    <i class="fas fa-chevron-down"></i>
                    載入更多評論
                </button>
            </div>
        </div>
    </section>

    <!-- 頁腳 -->
    <div id="footer-placeholder"></div>

    
    
    <!-- JavaScript 檔案 -->
    <script src="../js/config.js?v=20251201-1"></script>
    <script src="../js/api-service.js?v=20251201-1"></script>
    <script src="../js/app.js?v=20251201-1"></script>
    <script src="../js/student/portfolio-detail.js?v=20251201-1"></script>
    
    <script>
        // 初始化應用程式
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化 API 服務
            if (typeof initializeApiService === 'function') {
                initializeApiService();
            }
            
            // 載入導覽列
            if (typeof loadNavbar === 'function') {
                loadNavbar('student');
            }
            
            // 載入作品詳情
            if (typeof loadPortfolioDetail === 'function') {
                loadPortfolioDetail();
            }
        });
    </script>

    <!-- 文件預覽模態框 -->
    <div id="filePreviewModal" class="file-preview-modal" style="display: none;">
        <div class="file-preview-modal-overlay" onclick="closeFilePreview()"></div>
        <div class="file-preview-modal-content">
            <div class="file-preview-modal-header">
                <h3 id="previewModalTitle">文件預覽</h3>
                <button class="file-preview-close" onclick="closeFilePreview()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="file-preview-modal-body" id="previewModalBody">
                <!-- 預覽內容將在這裡動態載入 -->
            </div>
        </div>
    </div>
</body>
</html>
