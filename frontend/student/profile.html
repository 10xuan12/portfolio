<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人資料 - Portfolio+</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/student/profile.css">
    <style>
        /* 將本頁所有按鈕統一為主題藍色變數 */
        button,
        .btn,
        .btn-primary,
        .btn-outline,
        .btn-back,
        .avatar-upload,
        .export-btn,
        .modal-overlay .btn,
        .modal-overlay .btn-primary,
        .modal-overlay .btn-outline {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: #ffffff;
        }

        button:hover,
        .btn:hover,
        .btn-primary:hover,
        .btn-outline:hover,
        .btn-back:hover,
        .avatar-upload:hover,
        .export-btn:hover,
        .modal-overlay .btn:hover,
        .modal-overlay .btn-primary:hover,
        .modal-overlay .btn-outline:hover {
            background-color: var(--primary-color-hover, var(--primary-color));
            border-color: var(--primary-color-hover, var(--primary-color));
            color: #ffffff;
        }

        /* 確保 outline 類型也為實心藍色 */
        .btn-outline,
        .modal-overlay .btn-outline {
            background-color: var(--primary-color);
            border: 1px solid var(--primary-color);
            color: #ffffff;
        }

        /* 頭貼預設圖示樣式 */
        .avatar-placeholder {
            width: 100%;
            height: 100%;
            background: #f0f0f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #999;
            border: 2px solid #e0e0e0;
        }

        .profile-avatar {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #e0e0e0;
        }
    </style>
</head>
<body>
    <!-- 導覽列 -->
    <div id="navbar-placeholder"></div>
    <script>
    (function() {
      var role = (localStorage.getItem('user') && JSON.parse(localStorage.getItem('user')).role) || null;
      var path = '../navbar.html';
      fetch(path)
        .then(res => res.text())
        .then(html => {
          var temp = document.createElement('div');
          temp.innerHTML = html;
          var tplId = 'navbar-visitor';
          if (role === 'student') tplId = 'navbar-student';
          else if (role === 'enterprise') tplId = 'navbar-enterprise';
          else if (role === 'admin') tplId = 'navbar-admin';
          var tpl = temp.querySelector('#' + tplId);
          if (tpl) document.getElementById('navbar-placeholder').innerHTML = tpl.innerHTML;
        });
    })();
    </script>

    <!-- 個人資料標題 -->
    <section class="profile-header">
        <div class="container">
            <div class="header-top">
                <button class="btn-back" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i>
                    返回
                </button>
            </div>
            <div class="profile-info">
                <div class="profile-avatar" id="profileAvatar">
                    <img src="" alt="個人頭像" id="avatarImage" style="display: none;">
                    <div class="avatar-placeholder" id="avatarPlaceholder">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="avatar-upload" onclick="document.getElementById('avatarInput').click()">
                        <i class="fas fa-camera"></i>
                    </div>
                </div>
                <input type="file" id="avatarInput" accept="image/*">
                
                <div class="profile-details">
                    <h1 id="profile-name">-</h1>
                    <p id="profile-department-grade">-</p>
                    <p id="profile-student-id">學生編號: -</p>
                </div>
            </div>

        </div>
    </section>

    <!-- 主要內容 -->
    <section class="profile-container">
        <div class="container">
            <div class="profile-content">
                <div class="main-content">
                    <form id="profileForm">
                        <div class="form-section">
                            <h3>基本資料</h3>
                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="name">姓名</label>
                                    <input type="text" id="name" name="name" value="" required>
                                </div>
                                <div class="form-group">
                                    <label for="gender">性別</label>
                                    <select id="gender" name="gender" required>
                                        <option value="">請選擇性別</option>
                                        <option value="男">男</option>
                                        <option value="女">女</option>
                                        <option value="其他">其他</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="birth">生日</label>
                                    <input type="date" id="birth" name="birth" value="" required lang="ja-JP">
                                </div>
                                <div class="form-group">
                                    <label for="student_id">學號</label>
                                    <input type="text" id="student_id" name="student_id" value="" required>
                                </div>
                                <div class="form-group">
                                    <label for="department">科系</label>
                                    <input type="text" id="department" name="department" value="" placeholder="請輸入您的科系" required>
                                </div>
                                <div class="form-group">
                                    <label for="grade">年級</label>
                                    <select id="grade" name="grade" required>
                                        <option value="">請選擇年級</option>
                                        <option value="大學一年級">大學一年級</option>
                                        <option value="大學二年級">大學二年級</option>
                                        <option value="大學三年級">大學三年級</option>
                                        <option value="大學四年級">大學四年級</option>
                                        <option value="碩士生">碩士生</option>
                                        <option value="博士生">博士生</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="form-section">
                            <h3>聯絡資訊</h3>
                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="email">電子郵件</label>
                                    <input type="email" id="email" name="email" value="" required>
                                </div>
                                <div class="form-group">
                                    <label for="phone">聯絡電話</label>
                                    <input type="tel" id="phone" name="phone" value="">
                                </div>
                                <div class="form-group full-width">
                                    <label for="address">聯絡地址</label>
                                    <input type="text" id="address" name="address" value="">
                                </div>
                            </div>
                        </div>

                        <div class="form-section">
                            <h3>社群媒體</h3>
                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="github">
                                        <i class="fab fa-github"></i> GitHub
                                    </label>
                                    <input type="url" id="github" name="github" value="">
                                </div>
                                <div class="form-group">
                                    <label for="linkedin">
                                        <i class="fab fa-linkedin"></i> LinkedIn
                                    </label>
                                    <input type="url" id="linkedin" name="linkedin" value="">
                                </div>
                                <div class="form-group">
                                    <label for="instagram">
                                        <i class="fab fa-instagram"></i> Instagram
                                    </label>
                                    <input type="text" id="instagram" name="instagram" value="">
                                </div>
                                <div class="form-group">
                                    <label for="facebook">
                                        <i class="fab fa-facebook"></i> Facebook
                                    </label>
                                    <input type="text" id="facebook" name="facebook" value="">
                                </div>
                            </div>
                        </div>

                        <div class="form-section">
                            <h3>專業資訊</h3>
                            <div class="form-grid">
                                <div class="form-group full-width">
                                    <label for="bio">個人簡介</label>
                                    <textarea id="bio" name="bio" rows="4" placeholder="請描述您的個人簡介..."></textarea>
                                </div>
                                <div class="form-group">
                                    <label for="skills">技能專長</label>
                                    <input type="text" id="skills" name="skills" placeholder="例如：JavaScript, React, Node.js, UI/UX Design">
                                </div>
                                <div class="form-group">
                                    <label for="languages">語言能力</label>
                                    <input type="text" id="languages" name="languages" placeholder="例如：中文（母語）, 英文（流利）">
                                </div>
                                <div class="form-group">
                                    <label for="interests">興趣愛好</label>
                                    <input type="text" id="interests" name="interests" placeholder="例如：程式設計, 設計, 攝影">
                                </div>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="button" class="btn btn-outline" onclick="resetForm()">重置</button>
                            <button type="submit" class="btn btn-primary">儲存變更</button>
                        </div>
                    </form>

                </div>

                <div class="sidebar">
                    <div class="sidebar-card">
                        <h3>徽章成就</h3>
                        <ul class="badge-grid" id="badge-grid">
                            <!-- 徽章將由 JavaScript 動態載入 -->
                            <li class="loading-placeholder">
                                <i class="fas fa-spinner fa-spin"></i>
                                <div>載入中...</div>
                            </li>
                        </ul>
                    </div>

                    <div class="sidebar-card">
                        <h3>最近活動</h3>
                        <ul class="activity-list" id="activity-list">
                            <!-- 活動將由 JavaScript 動態載入 -->
                            <li class="loading-placeholder">
                                <i class="fas fa-spinner fa-spin"></i>
                                <div>載入中...</div>
                            </li>
                        </ul>
                    </div>

                    <div class="sidebar-card">
                        <h3>修改密碼</h3>
                        <form id="passwordForm">
                            <div class="form-group">
                                <label for="currentPassword">目前密碼</label>
                                <input type="password" id="currentPassword" name="currentPassword" required>
                            </div>
                            <div class="form-group">
                                <label for="newPassword">新密碼</label>
                                <input type="password" id="newPassword" name="newPassword" required>
                            </div>
                            <div class="form-group">
                                <label for="confirmPassword">確認新密碼</label>
                                <input type="password" id="confirmPassword" name="confirmPassword" required>
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary">修改密碼</button>
                            </div>
                        </form>
                    </div>

                    <div class="sidebar-card">
                        <h3>帳號設定</h3>
                        <div class="profile-section">
                            <label class="profile-label">
                                <input type="checkbox" id="email-notification">
                                <span>接收電子郵件通知</span>
                            </label>
                        </div>
                        <div class="profile-section">
                            <label class="profile-label">
                                <input type="checkbox" id="public-profile">
                                <span>公開個人資料</span>
                            </label>
                        </div>
                        <div class="profile-section">
                            <label class="profile-label">
                                <input type="checkbox" id="two-factor-auth">
                                <span>雙重認證</span>
                            </label>
                        </div>
                        <button class="btn btn-outline export-btn" onclick="exportProfileData()">
                            <i class="fas fa-download"></i>
                            匯出個人資料
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 首次登入模態框 -->
    <div id="firstLoginModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>歡迎來到 Portfolio+！</h2>
                <p>請先完成您的個人資料設定</p>
            </div>
            <div class="modal-body">
                <form id="firstLoginForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="modal-name">姓名</label>
                            <input type="text" id="modal-name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="modal-gender">性別</label>
                            <select id="modal-gender" name="gender" required>
                                <option value="">請選擇</option>
                                <option value="男">男</option>
                                <option value="女">女</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="modal-birth">生日</label>
                            <input type="date" id="modal-birth" name="birth" required lang="ja-JP">
                        </div>
                        <div class="form-group">
                            <label for="modal-student-id">學號</label>
                            <input type="text" id="modal-student-id" name="student_id" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="modal-department">科系</label>
                            <input type="text" id="modal-department" name="department" placeholder="請輸入您的科系" required>
                        </div>
                        <div class="form-group">
                            <label for="modal-grade">年級</label>
                            <select id="modal-grade" name="grade" required>
                                <option value="">請選擇年級</option>
                                <option value="大學一年級">大學一年級</option>
                                <option value="大學二年級">大學二年級</option>
                                <option value="大學三年級">大學三年級</option>
                                <option value="大學四年級">大學四年級</option>
                                <option value="碩士生">碩士生</option>
                                <option value="博士生">博士生</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="modal-phone">聯絡電話</label>
                        <input type="tel" id="modal-phone" name="phone">
                    </div>
                    <div class="form-group">
                        <label for="modal-address">聯絡地址</label>
                        <input type="text" id="modal-address" name="address">
                    </div>
                    <div class="form-group">
                        <label for="modal-bio">個人簡介</label>
                        <textarea id="modal-bio" name="bio" rows="3" placeholder="請簡短描述您自己..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeFirstLoginModal()">稍後再說</button>
                <button type="button" class="btn btn-primary" onclick="submitFirstLogin()">完成設定</button>
            </div>
        </div>
    </div>

    <!-- 頁腳 -->
    <div id="footer-placeholder"></div>

    <script>
        // 回到上一頁
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'dashboard.html';
            }
        }
    </script>
    <!-- JavaScript 檔案 -->
    <script src="../js/config.js"></script>
    <script src="../js/api-service.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/student/profile.js"></script>
</body>
</html>
