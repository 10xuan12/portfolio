<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人資料 - Portfolio+</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/student/profile.css">
</head>
<body>
    <!-- 導覽列 -->
    <div id="navbar-placeholder"></div>
    <script>
    (function() {
      var role = (localStorage.getItem('user') && JSON.parse(localStorage.getItem('user')).role) || null;
      var path = '../navbar.html';
      fetch(path)
        .then(res => res.text())
        .then(html => {
          var temp = document.createElement('div');
          temp.innerHTML = html;
          var tplId = 'navbar-visitor';
          if (role === 'student') tplId = 'navbar-student';
          else if (role === 'enterprise') tplId = 'navbar-enterprise';
          else if (role === 'admin') tplId = 'navbar-admin';
          var tpl = temp.querySelector('#' + tplId);
          if (tpl) document.getElementById('navbar-placeholder').innerHTML = tpl.innerHTML;
        });
    })();
    </script>

    <!-- 個人資料標題 -->
    <section class="profile-header">
        <div class="container">
            <div class="profile-info">
                <div class="profile-avatar" id="profileAvatar">
                    <img src="https://via.placeholder.com/120x120/667eea/ffffff?text=張" alt="個人頭像" id="avatarImage">
                    <div class="avatar-upload" onclick="document.getElementById('avatarInput').click()">
                        <i class="fas fa-camera"></i>
                    </div>
                </div>
                <input type="file" id="avatarInput" accept="image/*" style="display: none;">
                
                <div class="profile-details">
                    <h1>張小明</h1>
                    <p>資訊管理學系 • 大學三年級</p>
                    <p>學生編號: 12345678</p>
                    
                    <div class="profile-stats">
                        <div class="stat-card">
                            <div class="stat-content-box">
                                <div class="number">12</div>
                                <div class="label">作品</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-content-box">
                                <div class="number">1,234</div>
                                <div class="label">瀏覽</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-content-box">
                                <div class="number">89</div>
                                <div class="label">讚數</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-content-box">
                                <div class="number">5</div>
                                <div class="label">徽章</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 主要內容 -->
    <section class="profile-container">
        <div class="container">
            <div class="profile-content">
                <div class="main-content">
                    <form id="profileForm">
                        <div class="form-section">
                            <h3>基本資料</h3>
                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="name">姓名</label>
                                    <input type="text" id="name" name="name" value="張小明" required>
                                </div>
                                <div class="form-group">
                                    <label for="gender">性別</label>
                                    <select id="gender" name="gender" required>
                                        <option value="男" selected>男</option>
                                        <option value="女">女</option>
                                        <option value="其他">其他</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="birth">生日</label>
                                    <input type="date" id="birth" name="birth" value="2002-05-15" required>
                                </div>
                                <div class="form-group">
                                    <label for="student_id">學號</label>
                                    <input type="text" id="student_id" name="student_id" value="12345678" required>
                                </div>
                                <div class="form-group">
                                    <label for="department">科系</label>
                                    <select id="department" name="department" required>
                                        <option value="資訊管理學系" selected>資訊管理學系</option>
                                        <option value="財務金融學系">財務金融學系</option>
                                        <option value="國際企業學系">國際企業學系</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="grade">年級</label>
                                    <select id="grade" name="grade" required>
                                        <option value="大學三年級" selected>大學三年級</option>
                                        <option value="大學四年級">大學四年級</option>
                                        <option value="碩士生">碩士生</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="form-section">
                            <h3>聯絡資訊</h3>
                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="email">電子郵件</label>
                                    <input type="email" id="email" name="email" value="zhang@example.com" required>
                                </div>
                                <div class="form-group">
                                    <label for="phone">聯絡電話</label>
                                    <input type="tel" id="phone" name="phone" value="0912-345-678">
                                </div>
                                <div class="form-group full-width">
                                    <label for="address">聯絡地址</label>
                                    <input type="text" id="address" name="address" value="台北市大安區復興南路一段 390 號">
                                </div>
                            </div>
                        </div>

                        <div class="form-section">
                            <h3>社群媒體</h3>
                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="github">
                                        <i class="fab fa-github"></i> GitHub
                                    </label>
                                    <input type="url" id="github" name="github" value="https://github.com/zhangxiaoming">
                                </div>
                                <div class="form-group">
                                    <label for="linkedin">
                                        <i class="fab fa-linkedin"></i> LinkedIn
                                    </label>
                                    <input type="url" id="linkedin" name="linkedin" value="https://linkedin.com/in/zhangxiaoming">
                                </div>
                                <div class="form-group">
                                    <label for="instagram">
                                        <i class="fab fa-instagram"></i> Instagram
                                    </label>
                                    <input type="text" id="instagram" name="instagram" value="@zhangxiaoming">
                                </div>
                                <div class="form-group">
                                    <label for="facebook">
                                        <i class="fab fa-facebook"></i> Facebook
                                    </label>
                                    <input type="text" id="facebook" name="facebook" value="張小明">
                                </div>
                            </div>
                        </div>

                        <div class="form-section">
                            <h3>專業資訊</h3>
                            <div class="form-grid">
                                <div class="form-group full-width">
                                    <label for="bio">個人簡介</label>
                                    <textarea id="bio" name="bio" rows="4">我是一名資訊管理學系的學生，專精於前端開發和 UI/UX 設計。我熱愛學習新技術，並且喜歡將創意轉化為實際的作品。</textarea>
                                </div>
                                <div class="form-group">
                                    <label for="skills">技能專長</label>
                                    <input type="text" id="skills" name="skills" value="JavaScript, React, Node.js, UI/UX Design">
                                </div>
                                <div class="form-group">
                                    <label for="languages">語言能力</label>
                                    <input type="text" id="languages" name="languages" value="中文（母語）, 英文（流利）, 日文（基礎）">
                                </div>
                                <div class="form-group">
                                    <label for="interests">興趣愛好</label>
                                    <input type="text" id="interests" name="interests" value="程式設計, 設計, 攝影, 旅行">
                                </div>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="button" class="btn btn-outline" onclick="resetForm()">重置</button>
                            <button type="submit" class="btn btn-primary">儲存變更</button>
                        </div>
                    </form>

                    <!-- 密碼修改 -->
                    <div class="password-form">
                        <h4>修改密碼</h4>
                        <form id="passwordForm">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="currentPassword">目前密碼</label>
                                    <input type="password" id="currentPassword" name="currentPassword" required>
                                </div>
                                <div class="form-group">
                                    <label for="newPassword">新密碼</label>
                                    <input type="password" id="newPassword" name="newPassword" required>
                                </div>
                                <div class="form-group">
                                    <label for="confirmPassword">確認新密碼</label>
                                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                                </div>
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary">修改密碼</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="sidebar">
                    <div class="sidebar-card">
                        <h3>徽章成就</h3>
                        <div class="badge-grid">
                            <div class="badge-item earned">
                                <i class="fas fa-star"></i>
                                <div class="badge-name">新手上傳者</div>
                            </div>
                            <div class="badge-item earned">
                                <i class="fas fa-eye"></i>
                                <div class="badge-name">瀏覽達人</div>
                            </div>
                            <div class="badge-item earned">
                                <i class="fas fa-heart"></i>
                                <div class="badge-name">受歡迎</div>
                            </div>
                            <div class="badge-item earned">
                                <i class="fas fa-trophy"></i>
                                <div class="badge-name">作品大師</div>
                            </div>
                            <div class="badge-item earned">
                                <i class="fas fa-comment"></i>
                                <div class="badge-name">互動王</div>
                            </div>
                            <div class="badge-item">
                                <i class="fas fa-crown"></i>
                                <div class="badge-name">超級明星</div>
                            </div>
                        </div>
                    </div>

                    <div class="sidebar-card">
                        <h3>最近活動</h3>
                        <ul class="activity-list">
                            <!-- TODO: 從資料庫載入學生活動記錄 -->
                            <!-- 假資料開始 -->
                            <li class="activity-item">
                                <div class="activity-icon activity-upload">
                                    <i class="fas fa-upload"></i>
                                </div>
                                <div class="activity-content">
                                    <div class="activity-text">上傳了新作品「UI/UX 設計作品」</div>
                                    <div class="activity-time">2 小時前</div>
                                </div>
                            </li>
                            <li class="activity-item">
                                <div class="activity-icon activity-view">
                                    <i class="fas fa-eye"></i>
                                </div>
                                <div class="activity-content">
                                    <div class="activity-text">有人瀏覽了您的作品「響應式網站設計」</div>
                                    <div class="activity-time">4 小時前</div>
                                </div>
                            </li>
                            <li class="activity-item">
                                <div class="activity-icon activity-like">
                                    <i class="fas fa-heart"></i>
                                </div>
                                <div class="activity-content">
                                    <div class="activity-text">有人對您的作品「行動應用程式」按讚</div>
                                    <div class="activity-time">6 小時前</div>
                                </div>
                            </li>
                            <li class="activity-item">
                                <div class="activity-icon activity-comment">
                                    <i class="fas fa-comment"></i>
                                </div>
                                <div class="activity-content">
                                    <div class="activity-text">有人評論了您的作品「響應式網站設計」</div>
                                    <div class="activity-time">1 天前</div>
                                </div>
                            </li>
                            <!-- 假資料結束 -->
                        </ul>
                    </div>

                    <div class="sidebar-card">
                        <h3>帳號設定</h3>
                        <div style="margin-bottom: var(--spacing-md);">
                            <label style="display: flex; align-items: center; gap: var(--spacing-sm);">
                                <input type="checkbox" checked>
                                <span>接收電子郵件通知</span>
                            </label>
                        </div>
                        <div style="margin-bottom: var(--spacing-md);">
                            <label style="display: flex; align-items: center; gap: var(--spacing-sm);">
                                <input type="checkbox" checked>
                                <span>公開個人資料</span>
                            </label>
                        </div>
                        <div style="margin-bottom: var(--spacing-md);">
                            <label style="display: flex; align-items: center; gap: var(--spacing-sm);">
                                <input type="checkbox">
                                <span>雙重認證</span>
                            </label>
                        </div>
                        <button class="btn btn-outline" style="width: 100%; margin-top: var(--spacing-md);">
                            <i class="fas fa-download"></i>
                            匯出個人資料
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 頁腳 -->
    <div id="footer-placeholder"></div>

    <script src="../js/app.js"></script>
    <script src="../js/student/profile.js"></script>
</body>
</html>
