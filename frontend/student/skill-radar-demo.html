<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技能雷達圖分析 - Portfolio+</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/skill-radar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- 導覽列 -->
    <div id="navbar-placeholder"></div>
    <script>
    (function() {
      var role = (localStorage.getItem('user') && JSON.parse(localStorage.getItem('user')).role) || null;
      var path = '../navbar.html';
      fetch(path)
        .then(function(res){ return res.text(); })
        .then(function(html){
          var temp = document.createElement('div');
          temp.innerHTML = html;
          var tplId = 'navbar-visitor';
          if (role === 'student') tplId = 'navbar-student';
          else if (role === 'enterprise') tplId = 'navbar-enterprise';
          else if (role === 'admin') tplId = 'navbar-admin';
          var tpl = temp.querySelector('#' + tplId);
          if (tpl) document.getElementById('navbar-placeholder').innerHTML = tpl.innerHTML;
        })
        .catch(function(e){ console.error('載入導航欄失敗', e); });
    })();
    </script>

    <!-- 主要內容 -->
    <main class="skill-radar-main">
        <div class="container">
            <!-- 頁面標題 -->
            <div class="page-header">
                <div class="header-content">
                    <div class="title-section">
                        <h1 class="page-title">
                            <i class="fas fa-chart-radar"></i>
                            技能雷達圖分析
                        </h1>
                        <p class="page-subtitle" id="pageSubtitle">基於您的作品自動生成技能分析雷達圖，幫助您了解自己的技能分布</p>
                    </div>
                    <div class="header-actions">
                        <button class="btn btn-outline" onclick="goBack()">
                            <i class="fas fa-arrow-left"></i>
                            返回
                        </button>
                        <button class="btn btn-secondary" onclick="refreshAnalysis()">
                            <i class="fas fa-sync-alt"></i>
                            重新分析
                        </button>
                    </div>
                </div>
            </div>

            <!-- 技能雷達圖容器 -->
            <div class="skill-radar-grid">
                <div class="radar-chart-section">
                    <div class="section-header">
                        <h2>技能分析雷達圖</h2>
                        <p>基於您的作品內容自動分析技能強度</p>
                    </div>
                    <div class="chart-container">
                        <div class="skill-radar-loading" id="loadingState">
                            <div class="loading-spinner">
                                <div class="spinner-ring"></div>
                                <div class="spinner-ring"></div>
                                <div class="spinner-ring"></div>
                            </div>
                            <p>正在分析您的技能...</p>
                        </div>
                        <div id="skillRadarChart"></div>
                    </div>
                </div>
                
                <div class="skill-details-section">
                    <div class="section-header">
                        <h2>技能詳細分析</h2>
                        <p>各項技能的具體表現與建議</p>
                    </div>
                    <div class="skill-breakdown" id="skillBreakdown">
                        <!-- 技能詳細分析將在這裡渲染 -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 頁腳 -->
    <div id="footer-placeholder"></div>

    <script src="../js/skill-radar-generator.js?v=2"></script>
    <script>
        // 載入頁腳
        (function() {
            fetch('../footer.html')
                .then(function(res) { return res.text(); })
                .then(function(html) {
                    document.getElementById('footer-placeholder').innerHTML = html;
                })
                .catch(function(e) { 
                    console.error('載入頁腳失敗', e); 
                });
        })();
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 從 localStorage 獲取當前登入的學生資訊
            const userStr = localStorage.getItem('user');
            
            if (!userStr) {
                // 未登入，重導向到登入頁面
                alert('請先登入');
                window.location.href = '../login.html';
                return;
            }
            
            const user = JSON.parse(userStr);
            
            // 確認是學生角色
            if (user.role !== 'student') {
                alert('此功能僅供學生使用');
                window.location.href = '../index.html';
                return;
            }
            
            // 使用當前登入學生的 ID 初始化技能雷達圖
            const studentId = user.id || user.user_id;
            
            if (!studentId) {
                alert('無法取得學生資訊');
                window.location.href = 'dashboard.html';
                return;
            }
            
            // 初始化技能雷達圖
            window.skillRadarGenerator = new SkillRadarGenerator('skillRadarChart', studentId);
        });

        function refreshAnalysis() {
            // 重新載入分析
            location.reload();
        }

        // 返回按鈕功能
        function goBack() {
            // 檢查是否有上一頁歷史記錄
            if (window.history.length > 1) {
                window.history.back();
            } else {
                // 如果沒有歷史記錄，返回學生儀表板
                window.location.href = 'dashboard.html';
            }
        }

        function exportRadarChart() {
            // 匯出圖表功能
            if (window.skillRadarGenerator) {
                window.skillRadarGenerator.exportChart();
            } else {
                // 備用方案：直接從 canvas 匯出
                const canvas = document.querySelector('#skillRadarChart canvas');
                if (canvas) {
                    const link = document.createElement('a');
                    link.download = 'skill-radar-chart.png';
                    link.href = canvas.toDataURL();
                    link.click();
                }
            }
        }
    </script>
</body>
</html>
