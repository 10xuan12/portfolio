<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜尋作品 - Portfolio+</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/student/search.css">
</head>
<body>
    <!-- 導覽列 -->
    <div id="navbar-placeholder"></div>
    <script>
    (function() {
      var role = (localStorage.getItem('user') && JSON.parse(localStorage.getItem('user')).role) || null;
      var path = '../navbar.html';
      fetch(path)
        .then(res => res.text())
        .then(html => {
          var temp = document.createElement('div');
          temp.innerHTML = html;
          var tplId = 'navbar-visitor';
          if (role === 'student') tplId = 'navbar-student';
          else if (role === 'enterprise') tplId = 'navbar-enterprise';
          else if (role === 'admin') tplId = 'navbar-admin';
          var tpl = temp.querySelector('#' + tplId);
          if (tpl) document.getElementById('navbar-placeholder').innerHTML = tpl.innerHTML;
        });
    })();
    </script>

    <!-- 搜尋標題 -->
    <section class="search-header">
        <div class="container">
            <div class="header-top">
                <button class="btn-back" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i>
                    返回
                </button>
            </div>
            <div class="search-form">
                <h1>搜尋作品</h1>
                <p>發現優秀的作品，啟發您的創意</p>
                
                <div class="search-input-group">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="search-input" id="searchInput" placeholder="搜尋作品、作者、技術標籤..." autocomplete="off">
                    <button class="btn btn-primary search-btn" onclick="performSearch()">
                        <i class="fas fa-search"></i>
                        搜尋
                    </button>
                    <div class="search-suggestions" id="searchSuggestions"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- 主要內容 -->
    <section class="search-container">
        <div class="container">
            <!-- 搜尋篩選 -->
            <div class="search-filters">
                <div class="filter-row">
                    <div class="filter-group">
                        <label>分類</label>
                        <select id="categoryFilter">
                            <option value="">全部分類</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>技術標籤</label>
                        <input type="text" id="tagFilter" placeholder="JavaScript, React, Python...">
                    </div>
                    <div class="filter-group">
                        <label>作者</label>
                        <input type="text" id="authorFilter" placeholder="搜尋作者姓名...">
                    </div>
                    <div class="filter-group">
                        <label>時間範圍</label>
                        <select id="timeFilter">
                            <option value="">全部時間</option>
                            <option value="week">本週</option>
                            <option value="month">本月</option>
                            <option value="year">今年</option>
                        </select>
                    </div>
                    <button class="btn btn-primary filter-btn" onclick="applyFilters()">
                        <i class="fas fa-filter"></i>
                        篩選
                    </button>
                </div>
            </div>

            <!-- 搜尋統計和排序 -->
            <div class="search-stats">
                <div class="results-count" id="resultsCount">
                    找到 0 個結果  
                </div>
                <div class="sort-options">
                    <button class="sort-btn active" data-sort="relevance" onclick="changeSort('relevance')">
                        相關性
                    </button>
                    <button class="sort-btn" data-sort="date" onclick="changeSort('date')">
                        最新
                    </button>
                    <button class="sort-btn" data-sort="views" onclick="changeSort('views')">
                        瀏覽量
                    </button>
                    <button class="sort-btn" data-sort="likes" onclick="changeSort('likes')">
                        讚數
                    </button>
                </div>
            </div>

            <!-- 搜尋結果 -->
            <div class="search-results" id="searchResults">
                <!-- 搜尋結果將由 JavaScript 動態載入 -->
                <div class="initial-state">
                    <i class="fas fa-search"></i>
                    <h3>開始搜尋</h3>
                    <p>輸入關鍵字來搜尋作品</p>
                </div>
            </div>

            <!-- 空狀態 -->
            <div class="empty-state" id="emptyState">
                <i class="fas fa-search"></i>
                <h3>沒有找到相關作品</h3>
                <p>嘗試調整搜尋條件或關鍵字</p>
            </div>

            <!-- 搜尋歷史 -->
            <div class="search-history" id="searchHistory">
                <div class="history-title">最近搜尋</div>
                <div class="history-tags" id="historyTags">
                    <span class="history-tag" onclick="searchFromHistory('JavaScript')">JavaScript</span>
                    <span class="history-tag" onclick="searchFromHistory('React')">React</span>
                    <span class="history-tag" onclick="searchFromHistory('UI/UX')">UI/UX</span>
                    <span class="history-tag" onclick="searchFromHistory('響應式')">響應式</span>
                </div>
            </div>
        </div>
    </section>

    <!-- 頁腳 -->
    <div id="footer-placeholder"></div>

    <!-- JavaScript 檔案 -->
    <script src="../js/config.js"></script>
    <script src="../js/api-service.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/student/search.js"></script>
    
    <script>
        // 初始化應用程式
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化 API 服務
            if (typeof initializeApiService === 'function') {
                initializeApiService();
            }
            
            // 載入導覽列
            if (typeof loadNavbar === 'function') {
                loadNavbar('student');
            }
            
            // 初始化搜尋功能
            if (typeof initializeSearch === 'function') {
                initializeSearch();
            }
        });

        // 回到上一頁
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
