<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Icons 測試</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .test-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
            margin: 0 auto;
        }
        
        .icon-test {
            display: flex;
            align-items: center;
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        .icon-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            background: #4CAF50;
            color: white;
        }
        
        .icon-text {
            flex: 1;
        }
        
        .icon-name {
            font-weight: bold;
            margin-bottom: 2px;
        }
        
        .icon-class {
            font-size: 12px;
            color: #666;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h2>Bootstrap Icons 測試</h2>
        
        <div class="icon-test">
            <div class="icon-circle">
                <i class="bi bi-box-arrow-in-right"></i>
            </div>
            <div class="icon-text">
                <div class="icon-name">登入圖標</div>
                <div class="icon-class">bi bi-box-arrow-in-right</div>
            </div>
        </div>
        
        <div class="icon-test">
            <div class="icon-circle">
                <i class="bi bi-cloud-upload"></i>
            </div>
            <div class="icon-text">
                <div class="icon-name">上傳圖標</div>
                <div class="icon-class">bi bi-cloud-upload</div>
            </div>
        </div>
        
        <div class="icon-test">
            <div class="icon-circle">
                <i class="bi bi-person-circle"></i>
            </div>
            <div class="icon-text">
                <div class="icon-name">個人檔案圖標</div>
                <div class="icon-class">bi bi-person-circle</div>
            </div>
        </div>
        
        <div class="icon-test">
            <div class="icon-circle">
                <i class="bi bi-star-fill"></i>
            </div>
            <div class="icon-text">
                <div class="icon-name">星星圖標</div>
                <div class="icon-class">bi bi-star-fill</div>
            </div>
        </div>
        
        <div class="icon-test">
            <div class="icon-circle">
                <i class="bi bi-fire"></i>
            </div>
            <div class="icon-text">
                <div class="icon-name">火焰圖標</div>
                <div class="icon-class">bi bi-fire</div>
            </div>
        </div>
        
        <div class="icon-test">
            <div class="icon-circle">
                <i class="bi bi-trophy-fill"></i>
            </div>
            <div class="icon-text">
                <div class="icon-name">獎盃圖標</div>
                <div class="icon-class">bi bi-trophy-fill</div>
            </div>
        </div>
        
        <div class="icon-test">
            <div class="icon-circle">
                <i class="bi bi-gem"></i>
            </div>
            <div class="icon-text">
                <div class="icon-name">寶石圖標</div>
                <div class="icon-class">bi bi-gem</div>
            </div>
        </div>
    </div>
    
    <script>
        // 檢查Bootstrap Icons是否載入
        console.log('Bootstrap Icons CDN 載入狀態:', document.querySelector('link[href*="bootstrap-icons"]') ? '已載入' : '未載入');
        
        // 檢查圖標元素
        const icons = document.querySelectorAll('.icon-circle i');
        console.log('找到的圖標元素數量:', icons.length);
        
        icons.forEach((icon, index) => {
            console.log(`圖標 ${index + 1}:`, {
                classList: icon.classList.toString(),
                computedStyle: window.getComputedStyle(icon).fontFamily
            });
        });
    </script>
</body>
</html>
