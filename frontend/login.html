<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - Portfolio+</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // 登入頁面樣式設定
    </script>
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: stretch;
            justify-content: center;
            background: var(--background-color);
            padding: 0;
            gap: 0;
        }
        
        .login-left {
            flex: 0 0 33.333%;
            display: flex;
            align-items: stretch;
            justify-content: center;
            padding: var(--spacing-lg);
        }
        
        .hero-image {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .hero-visual {
            position: relative;
            width: 100%;
            height: 100%;
        }
        
        .floating-card {
            position: absolute;
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: var(--spacing-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--spacing-sm);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        
        .floating-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-xl);
        }
        
        .floating-card i {
            font-size: var(--text-2xl);
            color: var(--primary-color);
        }
        
        .floating-card span {
            font-size: var(--text-sm);
            font-weight: 600;
            color: var(--gray-700);
            text-align: center;
        }
        
        .card-1 {
            top: 8%;
            left: 5%;
            right: auto;
            width: 120px;
            height: 100px;
            animation: float1 4s ease-in-out infinite;
            transform-origin: center;
        }
        
        .card-2 {
            top: 12%;
            left: auto;
            right: 8%;
            width: 120px;
            height: 100px;
            animation: float2 3.5s ease-in-out infinite 0.8s;
            transform-origin: center;
        }
        
        .card-3 {
            top: 38%;
            left: 5%;
            right: auto;
            width: 120px;
            height: 100px;
            animation: float3 4.2s ease-in-out infinite 1.5s;
            transform-origin: center;
        }
        
        .card-4 {
            top: 42%;
            left: auto;
            right: 3%;
            width: 120px;
            height: 100px;
            animation: float4 3.8s ease-in-out infinite 0.3s;
            transform-origin: center;
        }
        
        .card-5 {
            top: 52%;
            left: 29%;
            right: auto;
            width: 120px;
            height: 100px;
            animation: float5 4.5s ease-in-out infinite 2.1s;
            transform-origin: center;
        }
        
        .card-6 {
            top: 65%;
            left: auto;
            right: 6%;
            width: 120px;
            height: 100px;
            animation: float6 3.2s ease-in-out infinite 1.2s;
            transform-origin: center;
        }
        
        .card-7 {
            top: 23%;
            left: 45%;
            right: auto;
            width: 120px;
            height: 100px;
            animation: float7 4.1s ease-in-out infinite 0.6s;
            transform-origin: center;
        }
        
        @keyframes float1 {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        @keyframes float2 {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        
        @keyframes float3 {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        
        @keyframes float4 {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }
        
        @keyframes float5 {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        
        @keyframes float6 {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-14px); }
        }
        
        @keyframes float7 {
            0%, 100% { transform: translateX(-50%) translateY(0px); }
            50% { transform: translateX(-50%) translateY(-11px); }
        }
        
        
        .login-right {
            flex: 0 0 66.667%;
            display: flex;
            align-items: stretch;
            justify-content: center;
            background: var(--white);
            min-height: 100vh;
        }
        
        .login-card {
            background: var(--white);
            border-radius: 0;
            box-shadow: none;
            padding: var(--spacing-2xl);
            width: 100%;
            max-width: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }
        
        .login-header h1 {
            font-size: var(--text-2xl);
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: var(--spacing-sm);
        }
        
        .login-header p {
            color: var(--gray-600);
        }
        
        .role-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }
        
        .role-option {
            padding: var(--spacing-md);
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-lg);
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .role-option:hover {
            border-color: var(--primary-color);
        }
        
        .role-option.active {
            border-color: var(--primary-color);
            background: var(--primary-color);
            color: var(--white);
        }
        
        .role-option i {
            font-size: var(--text-xl);
            margin-bottom: var(--spacing-sm);
            display: block;
        }
        
        .form-group {
            margin-bottom: var(--spacing-lg);
        }
        
        .form-group label {
            display: block;
            font-weight: 500;
            color: var(--gray-700);
            margin-bottom: var(--spacing-xs);
        }
        
        .form-group input {
            width: 100%;
            padding: var(--spacing-md);
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-lg);
            font-size: var(--text-base);
            transition: border-color 0.2s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-xl);
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            cursor: pointer;
        }
        
        .remember-me input[type="checkbox"] {
            width: auto;
            margin: 0;
        }
        
        .forgot-password {
            color: var(--primary-color);
            text-decoration: none;
            font-size: var(--text-sm);
        }
        
        .forgot-password:hover {
            text-decoration: underline;
        }
        
        .login-btn {
            width: 100%;
            padding: var(--spacing-md);
            background: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: var(--radius-lg);
            font-size: var(--text-base);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
        }
        
        .login-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }
        
        .register-link {
            text-align: center;
            margin-top: var(--spacing-xl);
            color: var(--gray-600);
        }
        
        .register-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
        
        .register-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            position: absolute;
            top: var(--spacing-lg);
            left: var(--spacing-lg);
            color: var(--white);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            background: var(--primary-color);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-lg);
            transition: all 0.2s ease;
            z-index: 1000;
        }
        
        .back-home:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
            }
            
            .login-left {
                flex: 0 0 auto;
                order: 2;
                padding: var(--spacing-md);
                min-height: 200px;
            }
            
            .login-right {
                flex: 1;
                order: 1;
                min-height: auto;
            }
            
            .login-card {
                padding: var(--spacing-xl);
            }
            
            .hero-image {
                max-width: 300px;
                height: 200px;
            }
            
            .floating-card {
                width: 100px;
                height: 80px;
                padding: var(--spacing-md);
            }
            
            .floating-card i {
                font-size: var(--text-xl);
            }
            
            .floating-card span {
                font-size: var(--text-xs);
            }
        }
        
        @media (max-width: 480px) {
            .login-card {
                padding: var(--spacing-lg);
            }
            .hero-image {
                max-width: 250px;
                height: 150px;
            }
            
            .floating-card {
                width: 80px;
                height: 70px;
                padding: var(--spacing-sm);
            }
            
            .floating-card i {
                font-size: var(--text-lg);
            }
            
            .floating-card span {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-home">
        <i class="fas fa-arrow-left"></i>
        返回首頁
    </a>

    <div class="login-container">
        <div class="login-left">
            <div class="hero-image">
                <div class="hero-visual">
                    <div class="floating-card card-1">
                        <i class="fas fa-code"></i>
                        <span>程式作品</span>
                    </div>
                    <div class="floating-card card-2">
                        <i class="fas fa-palette"></i>
                        <span>設計作品</span>
                    </div>
                    <div class="floating-card card-3">
                        <i class="fas fa-chart-line"></i>
                        <span>數據分析</span>
                    </div>
                    <div class="floating-card card-4">
                        <i class="fas fa-camera"></i>
                        <span>攝影作品</span>
                    </div>
                    <div class="floating-card card-5">
                        <i class="fas fa-music"></i>
                        <span>音樂創作</span>
                    </div>
                    <div class="floating-card card-6">
                        <i class="fas fa-video"></i>
                        <span>影片製作</span>
                    </div>
                    <div class="floating-card card-7">
                        <i class="fas fa-pen-fancy"></i>
                        <span>寫作作品</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="login-right">
            <div class="login-card">
            <div class="login-header">
                <h1>登入 Portfolio+</h1>
                <p>選擇您的身份並登入</p>
            </div>

            <form id="loginForm">
                <div class="role-selector">
                    <div class="role-option active" data-role="student">
                        <i class="fas fa-user-graduate"></i>
                        <div>學生</div>
                    </div>
                    <div class="role-option" data-role="enterprise">
                        <i class="fas fa-building"></i>
                        <div>企業</div>
                    </div>
                    <div class="role-option" data-role="admin">
                        <i class="fas fa-user-shield"></i>
                        <div>管理員</div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email"><span id="emailLabel">電子郵件</span></label>
                    <input type="text" id="email" name="email" required placeholder="請輸入您的電子郵件或使用者名稱">
                    <div class="hint" id="loginHint" style="color: #6c757d; font-size: 12px; margin-top: 5px;"></div>
                </div>

                <div class="form-group">
                    <label for="password">密碼</label>
                    <input type="password" id="password" name="password" required placeholder="請輸入您的密碼">
                </div>

                <div class="form-actions">
                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        <span>記住我</span>
                    </label>
                    <a href="#" class="forgot-password">忘記密碼？</a>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    登入
                </button>
            </form>

            <div class="register-link">
                還沒有帳號？ <a href="register.html">立即註冊</a>
            </div>
            </div>
        </div>
    </div>

    <script>
        const roleOptions = document.querySelectorAll('.role-option');
        let selectedRole = 'student';

        roleOptions.forEach(option => {
            option.addEventListener('click', function() {
                // 移除所有 active 類別
                roleOptions.forEach(opt => opt.classList.remove('active'));
                // 添加 active 類別到選中的選項
                this.classList.add('active');
                // 更新選中的角色
                selectedRole = this.dataset.role;
                
                // 更新輸入提示
                const emailLabel = document.getElementById('emailLabel');
                const emailInput = document.getElementById('email');
                const loginHint = document.getElementById('loginHint');
                
                if (selectedRole === 'admin') {
                    emailLabel.textContent = '使用者名稱';
                    emailInput.placeholder = '請輸入管理員帳號';
                    emailInput.type = 'text';
                    loginHint.innerHTML = '<i class="fas fa-info-circle"></i> 提示：管理員請使用 <strong>admin</strong>，密碼：<strong>password</strong>';
                    loginHint.style.color = '#667eea';
                } else if (selectedRole === 'enterprise') {
                    emailLabel.textContent = '電子郵件';
                    emailInput.placeholder = '請輸入企業信箱';
                    emailInput.type = 'email';
                    loginHint.innerHTML = '<i class="fas fa-info-circle"></i> 企業用戶請使用註冊時的電子郵件';
                    loginHint.style.color = '#6c757d';
                } else {
                    emailLabel.textContent = '電子郵件';
                    emailInput.placeholder = '請輸入學生信箱';
                    emailInput.type = 'email';
                    loginHint.innerHTML = '<i class="fas fa-info-circle"></i> 學生用戶請使用註冊時的電子郵件';
                    loginHint.style.color = '#6c757d';
                }
            });
        });
        
        // 初始化管理員提示（因為預設選中學生）
        const loginHint = document.getElementById('loginHint');
        loginHint.innerHTML = '<i class="fas fa-info-circle"></i> 學生用戶請使用註冊時的電子郵件';
        loginHint.style.color = '#6c757d';

        // 實作登入表單提交
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('email').value; // 使用 email 欄位作為 username
            const password = document.getElementById('password').value;
            const remember = document.querySelector('input[name="remember"]').checked;

            console.log('登入資訊:', {
                role: selectedRole,
                username: username,
                password: password,
                remember: remember
            });

            try {
                // 根據選擇的角色決定 API 端點
                let apiEndpoint;
                let requestBody;
                
                switch(selectedRole) {
                    case 'student':
                        apiEndpoint = '/portfolio/api/student/auth-direct.php';
                        requestBody = {
                            action: 'login',
                            username: username,
                            password: password
                        };
                        break;
                    case 'enterprise':
                        apiEndpoint = '/portfolio/api/enterprise/auth.php';
                        requestBody = {
                            action: 'login',
                            email: username, // 企業端使用 email
                            password: password
                        };
                        break;
                    case 'admin':
                        apiEndpoint = '/portfolio/api/admin/auth.php';
                        requestBody = {
                            action: 'login',
                            username: username,
                            password: password
                        };
                        break;
                    default:
                        throw new Error('無效的角色選擇');
                }
                
                // 發送登入請求到對應的後端 API
                const response = await fetch(apiEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                const result = await response.json();
                console.log('登入回應:', result);

                if (result.status === 200) {
                    // 登入成功
                    const user = result.data;
                    const userData = {
                        id: user.user_id,
                        username: user.username,
                        email: user.email,
                        role: user.role,
                        name: user.display_name || user.first_name + ' ' + user.last_name
                    };
                    
                    // 設定 localStorage
                    localStorage.setItem('user', JSON.stringify(userData));
                    localStorage.setItem('auth_token', 'token_' + Date.now());
                    
                    console.log('登入成功，使用者資訊:', userData);
                    
                    // 根據角色導向不同的儀表板
                    switch(selectedRole) {
                        case 'student':
                            window.location.href = 'student/dashboard.html';
                            break;
                        case 'enterprise':
                            window.location.href = 'enterprise/dashboard.html';
                            break;
                        case 'admin':
                            window.location.href = 'admin/dashboard.html';
                            break;
                    }
                } else {
                    // 登入失敗
                    alert('登入失敗：' + (result.message || '未知錯誤'));
                }
            } catch (error) {
                console.error('登入錯誤:', error);
                
                // 更詳細的錯誤訊息
                let errorMessage = '登入失敗：';
                if (error.message.includes('JSON')) {
                    errorMessage += '伺服器返回格式錯誤，可能是資料庫連接問題。\n\n';
                    errorMessage += '請檢查：\n';
                    errorMessage += '1. XAMPP 的 Apache 和 MySQL 服務是否已啟動\n';
                    errorMessage += '2. 資料庫 eportfolio2 是否存在\n';
                    errorMessage += '3. 開啟瀏覽器開發者工具（F12）> Network 標籤查看詳細錯誤';
                } else {
                    errorMessage += error.message || '未知錯誤，請稍後再試';
                }
                
                alert(errorMessage);
            }
        });

        document.querySelector('.forgot-password').addEventListener('click', function(e) {
            e.preventDefault();
            try {
                const email = prompt('請輸入註冊時的電子郵件，用於重設密碼：');
                if (!email) return;
                const role = selectedRole || 'student';
                let endpoint = '';
                let payload = {};
                if (role === 'student') {
                    endpoint = '/portfolio/api/student/password.php';
                    payload = { action: 'request_reset', email };
                } else if (role === 'enterprise') {
                    endpoint = '/portfolio/api/enterprise/auth.php';
                    payload = { action: 'password_reset_request', email };
                } else {
                    endpoint = '/portfolio/api/admin/auth.php';
                    payload = { action: 'password_reset_request', email };
                }
                fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(r => r.json()).then(res => {
                    if (res && (res.status === 200 || res.success)) {
                        alert('我們已寄出密碼重設指示，請查收您的信箱。');
                    } else {
                        alert(res?.message || '無法送出重設請求，請稍後再試');
                    }
                }).catch(() => alert('網路或伺服器異常，請稍後再試'));
            } catch (_) {}
        });

        // 添加動畫樣式
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
            @keyframes slideOut {
                from {
                    transform: translateX(0);
                    opacity: 1;
                }
                to {
                    transform: translateX(100%);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
