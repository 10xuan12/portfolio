<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - Portfolio+</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            padding: var(--spacing-md);
        }
        
        .login-card {
            background: var(--white);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            padding: var(--spacing-2xl);
            width: 100%;
            max-width: 400px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }
        
        .login-header h1 {
            font-size: var(--text-2xl);
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: var(--spacing-sm);
        }
        
        .login-header p {
            color: var(--gray-600);
        }
        
        .role-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }
        
        .role-option {
            padding: var(--spacing-md);
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-lg);
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .role-option:hover {
            border-color: var(--primary-color);
        }
        
        .role-option.active {
            border-color: var(--primary-color);
            background: var(--primary-color);
            color: var(--white);
        }
        
        .role-option i {
            font-size: var(--text-xl);
            margin-bottom: var(--spacing-sm);
            display: block;
        }
        
        .form-group {
            margin-bottom: var(--spacing-lg);
        }
        
        .form-group label {
            display: block;
            font-weight: 500;
            color: var(--gray-700);
            margin-bottom: var(--spacing-xs);
        }
        
        .form-group input {
            width: 100%;
            padding: var(--spacing-md);
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-lg);
            font-size: var(--text-base);
            transition: border-color 0.2s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: var(--spacing-xl);
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
        }
        
        .remember-me input[type="checkbox"] {
            width: auto;
        }
        
        .forgot-password {
            color: var(--primary-color);
            text-decoration: none;
            font-size: var(--text-sm);
        }
        
        .forgot-password:hover {
            text-decoration: underline;
        }
        
        .login-btn {
            width: 100%;
            padding: var(--spacing-md);
            background: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: var(--radius-lg);
            font-size: var(--text-base);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        
        .login-btn:hover {
            background: var(--primary-dark);
        }
        
        .register-link {
            text-align: center;
            margin-top: var(--spacing-lg);
            color: var(--gray-600);
        }
        
        .register-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }
        
        .register-link a:hover {
            text-decoration: underline;
        }
        
        .back-home {
            position: absolute;
            top: var(--spacing-lg);
            left: var(--spacing-lg);
            color: var(--white);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            font-weight: 500;
        }
        
        .back-home:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 480px) {
            .login-card {
                padding: var(--spacing-xl);
            }
            
            .role-selector {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-home">
        <i class="fas fa-arrow-left"></i>
        返回首頁
    </a>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>登入 Portfolio+</h1>
                <p>選擇您的身份並登入</p>
            </div>

            <form id="loginForm">
                <div class="role-selector">
                    <div class="role-option active" data-role="student">
                        <i class="fas fa-user-graduate"></i>
                        <div>學生</div>
                    </div>
                    <div class="role-option" data-role="enterprise">
                        <i class="fas fa-building"></i>
                        <div>企業</div>
                    </div>
                    <div class="role-option" data-role="admin">
                        <i class="fas fa-user-shield"></i>
                        <div>管理員</div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">電子郵件</label>
                    <input type="email" id="email" name="email" required placeholder="請輸入您的電子郵件">
                </div>

                <div class="form-group">
                    <label for="password">密碼</label>
                    <input type="password" id="password" name="password" required placeholder="請輸入您的密碼">
                </div>

                <div class="form-actions">
                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        <span>記住我</span>
                    </label>
                    <a href="#" class="forgot-password">忘記密碼？</a>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    登入
                </button>
            </form>

            <div class="register-link">
                還沒有帳號？ <a href="register.html">立即註冊</a>
            </div>
        </div>
    </div>

    <script>
        // TODO: 實作角色選擇功能
        const roleOptions = document.querySelectorAll('.role-option');
        let selectedRole = 'student';

        roleOptions.forEach(option => {
            option.addEventListener('click', function() {
                // 移除所有 active 類別
                roleOptions.forEach(opt => opt.classList.remove('active'));
                // 添加 active 類別到選中的選項
                this.classList.add('active');
                // 更新選中的角色
                selectedRole = this.dataset.role;
            });
        });

        // TODO: 實作登入表單提交
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.querySelector('input[name="remember"]').checked;

            console.log('登入資訊:', {
                role: selectedRole,
                email: email,
                password: password,
                remember: remember
            });

            // TODO: 發送登入請求到後端 API
            // 例如：fetch('/api/login', {
            //     method: 'POST',
            //     headers: { 'Content-Type': 'application/json' },
            //     body: JSON.stringify({
            //         role: selectedRole,
            //         email: email,
            //         password: password,
            //         remember: remember
            //     })
            // })

            // 模擬登入成功
            alert(`登入成功！歡迎 ${selectedRole} 使用者`);
            
            // 根據角色導向不同的儀表板
            switch(selectedRole) {
                case 'student':
                    window.location.href = 'student/dashboard.html';
                    break;
                case 'enterprise':
                    window.location.href = 'enterprise/dashboard.html';
                    break;
                case 'admin':
                    window.location.href = 'admin/dashboard.html';
                    break;
            }
        });

        // TODO: 實作忘記密碼功能
        document.querySelector('.forgot-password').addEventListener('click', function(e) {
            e.preventDefault();
            alert('忘記密碼功能開發中...');
            // TODO: 實作忘記密碼流程
        });
    </script>
</body>
</html>
