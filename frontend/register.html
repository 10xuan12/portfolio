<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>註冊 - Portfolio+</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .register-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            padding: var(--spacing-md);
        }
        
        .register-card {
            background: var(--white);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            padding: var(--spacing-2xl);
            width: 100%;
            max-width: 500px;
        }
        
        .register-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }
        
        .register-header h1 {
            font-size: var(--text-2xl);
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: var(--spacing-sm);
        }
        
        .register-header p {
            color: var(--gray-600);
        }
        
        .role-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }
        
        .role-option {
            padding: var(--spacing-md);
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-lg);
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .role-option:hover {
            border-color: var(--primary-color);
        }
        
        .role-option.active {
            border-color: var(--primary-color);
            background: var(--primary-color);
            color: var(--white);
        }
        
        .role-option i {
            font-size: var(--text-xl);
            margin-bottom: var(--spacing-sm);
            display: block;
        }
        
        .form-section {
            margin-bottom: var(--spacing-xl);
        }
        
        .form-section h3 {
            font-size: var(--text-lg);
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: var(--spacing-md);
            padding-bottom: var(--spacing-sm);
            border-bottom: 2px solid var(--gray-200);
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
        }
        
        .form-group {
            margin-bottom: var(--spacing-lg);
        }
        
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        
        .form-group label {
            display: block;
            font-weight: 500;
            color: var(--gray-700);
            margin-bottom: var(--spacing-xs);
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: var(--spacing-md);
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-lg);
            font-size: var(--text-base);
            transition: border-color 0.2s ease;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        

        
        .register-btn {
            width: 100%;
            padding: var(--spacing-md);
            background: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: var(--radius-lg);
            font-size: var(--text-base);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        
        .register-btn:hover {
            background: var(--primary-dark);
        }
        
        .login-link {
            text-align: center;
            margin-top: var(--spacing-lg);
            color: var(--gray-600);
        }
        
        .login-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
        
        .back-home {
            position: absolute;
            top: var(--spacing-lg);
            left: var(--spacing-lg);
            color: var(--white);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            font-weight: 500;
        }
        
        .back-home:hover {
            text-decoration: underline;
        }
        
        .form-toggle {
            display: none;
        }
        
        .form-toggle.show {
            display: block;
        }
        
        @media (max-width: 480px) {
            .register-card {
                padding: var(--spacing-xl);
            }
            
            .role-selector {
                grid-template-columns: 1fr;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-home">
        <i class="fas fa-arrow-left"></i>
        返回首頁
    </a>

    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <h1>註冊 Portfolio+</h1>
                <p>選擇您的身份並建立帳號</p>
            </div>

            <form id="registerForm">
                <div class="role-selector">
                    <div class="role-option active" data-role="student">
                        <i class="fas fa-user-graduate"></i>
                        <div>學生</div>
                    </div>
                    <div class="role-option" data-role="enterprise">
                        <i class="fas fa-building"></i>
                        <div>企業</div>
                    </div>
                    <div class="role-option" data-role="admin">
                        <i class="fas fa-user-shield"></i>
                        <div>管理員</div>
                    </div>
                </div>

                <!-- 學生註冊表單 -->
                <div class="form-toggle show" id="studentForm">
                    <div class="form-section">
                        <h3>基本資料</h3>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="student-lastname">姓氏</label>
                                <input type="text" id="student-lastname" name="last_name" data-required="true" placeholder="請輸入您的姓氏">
                            </div>
                            <div class="form-group">
                                <label for="student-firstname">名字</label>
                                <input type="text" id="student-firstname" name="first_name" data-required="true" placeholder="請輸入您的名字">
                            </div>
                            <div class="form-group">
                                <label for="student-email">電子郵件</label>
                                <input type="email" id="student-email" name="email" data-required="true" placeholder="請輸入您的電子郵件">
                            </div>
                            <div class="form-group">
                                <label for="student-password">密碼</label>
                                <input type="password" id="student-password" name="password" data-required="true" placeholder="請輸入密碼">
                            </div>
                            <div class="form-group">
                                <label for="student-confirm-password">確認密碼</label>
                                <input type="password" id="student-confirm-password" name="confirm_password" data-required="true" placeholder="請再次輸入密碼">
                            </div>
                            <div class="form-group">
                                <label for="student-department">科系</label>
                                <select id="student-department" name="department" data-required="true">
                                    <option value="">請選擇科系</option>
                                    <option value="資訊管理學系">資訊管理學系</option>
                                    <option value="財務金融學系">財務金融學系</option>
                                    <option value="國際企業學系">國際企業學系</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="student-grade">年級</label>
                                <select id="student-grade" name="grade" data-required="true">
                                    <option value="">請選擇年級</option>
                                    <option value="大學三年級">大學三年級</option>
                                    <option value="大學四年級">大學四年級</option>
                                    <option value="碩士生">碩士生</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>聯絡資訊</h3>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="student-phone">聯絡電話</label>
                                <input type="tel" id="student-phone" name="phone" placeholder="請輸入聯絡電話">
                            </div>
                            <div class="form-group">
                                <label for="student-address">聯絡地址</label>
                                <input type="text" id="student-address" name="address" placeholder="請輸入聯絡地址">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 企業註冊表單 -->
                <div class="form-toggle" id="enterpriseForm">
                    <div class="form-section">
                        <h3>企業資料</h3>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="enterprise-name">公司名稱</label>
                                <input type="text" id="enterprise-name" name="enterprise_name" data-required="true" placeholder="請輸入公司名稱">
                            </div>
                            <div class="form-group">
                                <label for="enterprise-email">公司電子郵件</label>
                                <input type="email" id="enterprise-email" name="enterprise_email" data-required="true" placeholder="請輸入公司電子郵件">
                            </div>
                            <div class="form-group">
                                <label for="enterprise-password">密碼</label>
                                <input type="password" id="enterprise-password" name="enterprise_password" data-required="true" placeholder="請輸入密碼">
                            </div>
                            <div class="form-group">
                                <label for="enterprise-confirm-password">確認密碼</label>
                                <input type="password" id="enterprise-confirm-password" name="enterprise_confirm_password" data-required="true" placeholder="請再次輸入密碼">
                            </div>
                            <div class="form-group">
                                <label for="enterprise-industry">產業類型</label>
                                <select id="enterprise-industry" name="enterprise_industry" data-required="true">
                                    <option value="">請選擇產業類型</option>
                                    <option value="科技業">科技業</option>
                                    <option value="金融業">金融業</option>
                                    <option value="製造業">製造業</option>
                                    <option value="服務業">服務業</option>
                                    <option value="其他">其他</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="enterprise-size">公司規模</label>
                                <select id="enterprise-size" name="enterprise_size" data-required="true">
                                    <option value="">請選擇公司規模</option>
                                    <option value="1-10人">1-10人</option>
                                    <option value="11-50人">11-50人</option>
                                    <option value="51-200人">51-200人</option>
                                    <option value="201-1000人">201-1000人</option>
                                    <option value="1000人以上">1000人以上</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>聯絡資訊</h3>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="enterprise-phone">聯絡電話</label>
                                <input type="tel" id="enterprise-phone" name="enterprise_phone" placeholder="請輸入聯絡電話">
                            </div>
                            <div class="form-group">
                                <label for="enterprise-address">公司地址</label>
                                <input type="text" id="enterprise-address" name="enterprise_address" placeholder="請輸入公司地址">
                            </div>
                            <div class="form-group">
                                <label for="enterprise-website">公司網站</label>
                                <input type="url" id="enterprise-website" name="enterprise_website" placeholder="請輸入公司網站">
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>公司簡介</h3>
                                                    <div class="form-group full-width">
                                <label for="enterprise-description">公司描述</label>
                                <textarea id="enterprise-description" name="enterprise_description" placeholder="請簡介您的公司..."></textarea>
                            </div>
                    </div>
                </div>

                <!-- 管理員註冊表單 -->
                <div class="form-toggle" id="adminForm">
                    <div class="form-section">
                        <h3>管理員資料</h3>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="admin-name">姓名</label>
                                <input type="text" id="admin-name" name="admin_name" data-required="true" placeholder="請輸入您的姓名">
                            </div>
                            <div class="form-group">
                                <label for="admin-email">電子郵件</label>
                                <input type="email" id="admin-email" name="admin_email" data-required="true" placeholder="請輸入您的電子郵件">
                            </div>
                            <div class="form-group">
                                <label for="admin-password">密碼</label>
                                <input type="password" id="admin-password" name="admin_password" data-required="true" placeholder="請輸入密碼">
                            </div>
                            <div class="form-group">
                                <label for="admin-confirm-password">確認密碼</label>
                                <input type="password" id="admin-confirm-password" name="admin_confirm_password" data-required="true" placeholder="請再次輸入密碼">
                            </div>
                            <div class="form-group">
                                <label for="admin-role">管理員角色</label>
                                <select id="admin-role" name="admin_role" data-required="true">
                                    <option value="">請選擇角色</option>
                                    <option value="super_admin">超級管理員</option>
                                    <option value="content_moderator">內容審核員</option>
                                    <option value="user_manager">使用者管理員</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>



                <button type="submit" class="register-btn">
                    <i class="fas fa-user-plus"></i>
                    註冊帳號
                </button>
            </form>

            <div class="login-link">
                已有帳號？ <a href="login.html">立即登入</a>
            </div>
        </div>
    </div>

    <script>
        // 實作角色選擇功能
        const roleOptions = document.querySelectorAll('.role-option');
        const formToggles = document.querySelectorAll('.form-toggle');
        let selectedRole = 'student';

        roleOptions.forEach(option => {
            option.addEventListener('click', function() {
                // 移除所有 active 類別
                roleOptions.forEach(opt => opt.classList.remove('active'));
                // 添加 active 類別到選中的選項
                this.classList.add('active');
                // 更新選中的角色
                selectedRole = this.dataset.role;
                console.log('角色已切換為:', selectedRole);
                
                // 切換表單顯示
                formToggles.forEach(form => {
                    form.classList.remove('show');
                });
                const targetForm = document.getElementById(selectedRole + 'Form');
                if (targetForm) {
                    targetForm.classList.add('show');
                    console.log('表單已切換到:', selectedRole + 'Form');
                } else {
                    console.error('找不到表單:', selectedRole + 'Form');
                }
                
                // 重新驗證表單
                validateCurrentForm();
            });
        });
        
        // 驗證當前顯示的表單
        function validateCurrentForm() {
            const currentForm = document.getElementById(selectedRole + 'Form');
            if (!currentForm) return false;
            
            // 檢查所有 data-required 欄位
            const requiredFields = currentForm.querySelectorAll('[data-required="true"]');
            
            let isValid = true;
            requiredFields.forEach(field => {
                if (field.type === 'checkbox') {
                    if (!field.checked) {
                        field.setCustomValidity('此欄位為必填');
                        isValid = false;
                    } else {
                        field.setCustomValidity('');
                    }
                } else {
                    if (field.value === '') {
                        field.setCustomValidity('此欄位為必填');
                        isValid = false;
                    } else {
                        field.setCustomValidity('');
                    }
                }
            });
            

            
            return isValid;
        }

        // 實作密碼確認驗證
        function validatePasswords() {
            let passwordField, confirmPasswordField;
            
            if (selectedRole === 'student') {
                passwordField = document.getElementById('student-password');
                confirmPasswordField = document.getElementById('student-confirm-password');
            } else if (selectedRole === 'enterprise') {
                passwordField = document.getElementById('enterprise-password');
                confirmPasswordField = document.getElementById('enterprise-confirm-password');
            } else if (selectedRole === 'admin') {
                passwordField = document.getElementById('admin-password');
                confirmPasswordField = document.getElementById('admin-confirm-password');
            }
            
            if (passwordField && confirmPasswordField) {
                if (passwordField.value !== confirmPasswordField.value) {
                    confirmPasswordField.setCustomValidity('密碼不匹配');
                    return false;
                } else {
                    confirmPasswordField.setCustomValidity('');
                    return true;
                }
            }
            return true;
        }
        
        // 檢查密碼長度
        function validatePasswordLength(password) {
            return password.length >= 8;
        }
        
        // 頁面載入時初始化驗證
        document.addEventListener('DOMContentLoaded', function() {
            console.log('頁面載入完成，初始角色:', selectedRole);
            validateCurrentForm();
        });

        // 監聽密碼欄位變化
        document.addEventListener('input', function(e) {
            // 檢查是否為密碼欄位
            if (e.target.name && (e.target.name.includes('password') || e.target.name.includes('confirm_password'))) {
                validatePasswords();
            }
            
            // 即時驗證當前表單
            if (e.target.closest('#' + selectedRole + 'Form')) {
                validateCurrentForm();
            }
        });
        
        // 監聽表單提交前的驗證
        document.addEventListener('submit', function(e) {
            if (!validateCurrentForm()) {
                e.preventDefault();
                alert('請填寫所有必填欄位');
                return false;
            }
        });

        // 實作註冊表單提交
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // 驗證當前表單
            if (!validateCurrentForm()) {
                alert('請填寫所有必填欄位');
                return;
            }
            
            if (!validatePasswords()) {
                alert('請確認密碼輸入正確');
                return;
            }

            // 收集當前角色的表單資料
            console.log('當前選擇的角色:', selectedRole);
            const currentForm = document.getElementById(selectedRole + 'Form');
            console.log('找到的表單元素:', currentForm);
            
            if (!currentForm) {
                alert('找不到對應的表單，請重新選擇角色');
                return;
            }
            
            // 手動收集表單資料
            let formData = {};
            const inputs = currentForm.querySelectorAll('input, select, textarea');
            inputs.forEach(input => {
                if (input.name && input.value) {
                    formData[input.name] = input.value;
                }
            });
            
            let registerData = {
                action: 'register',
                role: selectedRole
            };

            // 根據角色收集對應的欄位資料
            if (selectedRole === 'student') {
                registerData.username = formData.email;
                registerData.email = formData.email;
                registerData.password = formData.password;
                
                // 直接使用分開的姓氏和名字欄位
                registerData.first_name = formData.first_name || '';
                registerData.last_name = formData.last_name || '';
                
                registerData.department = formData.department;
                registerData.grade = formData.grade;
                registerData.phone = formData.phone;
                registerData.address = formData.address;
            } else if (selectedRole === 'enterprise') {
                registerData.username = formData.enterprise_email;
                registerData.email = formData.enterprise_email;
                registerData.password = formData.enterprise_password;
                registerData.company_name = formData.enterprise_name;
                registerData.industry = formData.enterprise_industry;
                registerData.company_size = formData.enterprise_size; // 修正欄位名稱
                registerData.phone = formData.enterprise_phone;
                registerData.address = formData.enterprise_address;
                registerData.description = formData.enterprise_description;
                // 添加 contact_person 欄位，暫時使用企業名稱
                registerData.contact_person = formData.enterprise_name || '';
                // 注意：後端 API 沒有 website 欄位，暫時不發送
            } else if (selectedRole === 'admin') {
                registerData.username = formData.admin_email;
                registerData.email = formData.admin_email;
                registerData.password = formData.admin_password;
                registerData.first_name = formData.admin_name ? formData.admin_name.split(' ')[0] || formData.admin_name : '';
                registerData.last_name = formData.admin_name ? formData.admin_name.split(' ')[1] || '' : '';
                registerData.admin_role = formData.admin_role;
            }

            console.log('註冊資訊:', registerData);

            try {
                // 根據角色選擇對應的 API 端點
                let apiEndpoint = '';
                if (selectedRole === 'student') {
                    apiEndpoint = '/portfolio/api/student/auth-direct.php';
                } else if (selectedRole === 'enterprise') {
                    apiEndpoint = '/portfolio/api/enterprise/auth.php';
                } else if (selectedRole === 'admin') {
                    apiEndpoint = '/portfolio/api/student/auth-direct.php'; // 暫時使用學生 API，之後可以建立專門的管理員 API
                }

                console.log('使用 API 端點:', apiEndpoint);

                // 發送註冊請求到後端 API
                const response = await fetch(apiEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(registerData)
                });

                console.log('收到回應，狀態碼:', response.status);
                console.log('回應標頭:', response.headers);

                // 檢查回應是否為 JSON 格式
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error('回應不是 JSON 格式: ' + contentType);
                }

                const result = await response.json();
                console.log('註冊回應:', result);
                console.log('HTTP 狀態碼:', response.status);
                console.log('回應 status 欄位:', result.status);
                console.log('response.ok:', response.ok);

                // 簡化檢查邏輯：只要 HTTP 狀態碼是 200 或 201 就表示成功
                if (response.status === 200 || response.status === 201) {
                    console.log('註冊成功，準備轉向登入頁面');
                    console.log('response.status:', response.status);
                    console.log('result.status:', result.status);
                    console.log('result.message:', result.message);
                    
                    // 註冊成功
                    alert(`註冊成功！歡迎加入 Portfolio+ ${selectedRole} 社群`);
                    
                    // 導向登入頁面
                    setTimeout(() => {
                        console.log('開始轉向登入頁面');
                        window.location.href = 'login.html';
                    }, 1000); // 延遲 1 秒轉向，讓使用者看到成功訊息
                } else {
                    // 註冊失敗
                    console.log('註冊失敗，完整回應:', result);
                    console.log('response.status:', response.status);
                    console.log('result.status:', result.status);
                    console.log('result.message:', result.message);
                    alert('註冊失敗：' + (result.message || '未知錯誤'));
                }
            } catch (error) {
                console.error('註冊錯誤:', error);
                if (error.name === 'SyntaxError') {
                    alert('註冊失敗：伺服器回應格式錯誤，請稍後再試');
                } else {
                    alert('註冊失敗：' + error.message);
                }
            }
        });

        // 實作表單驗證
        // 添加即時驗證功能
        document.addEventListener('input', function(e) {
            const field = e.target;
            const value = field.value;
            
            // 只驗證當前角色的表單欄位
            if (!field.closest('#' + selectedRole + 'Form')) {
                return;
            }
            
            // 電子郵件驗證
            if (field.type === 'email') {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (value && !emailRegex.test(value)) {
                    field.setCustomValidity('請輸入有效的電子郵件地址');
                } else {
                    field.setCustomValidity('');
                }
            }
            
            // 密碼強度驗證
            if (field.type === 'password' && (field.name === 'password' || field.name === 'enterprise_password' || field.name === 'admin_password')) {
                if (value && value.length < 8) {
                    field.setCustomValidity('密碼至少需要 8 個字元');
                } else {
                    field.setCustomValidity('');
                }
            }
        });
    </script>
</body>
</html>
