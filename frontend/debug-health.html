<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio+ 健康檢查</title>
  <link rel="stylesheet" href="css/app.css" />
  <style>
    body { padding: 24px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', 'Helvetica Neue', Arial, 'Apple Color Emoji', 'Segoe UI Emoji'; }
    .ok { color: #16a34a; }
    .degraded, .warn { color: #ca8a04; }
    .error { color: #dc2626; }
    pre { background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 8px; overflow: auto; }
    .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    button { padding: 8px 12px; border: 1px solid #e5e7eb; border-radius: 6px; background: #111827; color: #fff; cursor: pointer; }
    button:disabled { background: #6b7280; cursor: not-allowed; }
  </style>
  <script src="js/config.js"></script>
  <script src="js/api-service.js"></script>
  <script>
    async function runHealth() {
      const output = document.getElementById('output');
      output.textContent = '檢查中...';
      try {
        const svc = window.apiService || window.initializeApiService?.();
        const url = svc?.getApiUrl ? svc.getApiUrl('health.php') : (typeof getApiUrl === 'function' ? getApiUrl('health.php') : '/api/health.php');
        const resp = await fetch(url);
        const text = await resp.text();
        let json = null;
        try { json = JSON.parse(text); } catch (_) {}
        const status = json?.status || (resp.ok ? 'ok' : 'error');
        document.getElementById('status').textContent = status;
        document.getElementById('status').className = status;
        output.textContent = json ? JSON.stringify(json, null, 2) : text;
      } catch (e) {
        document.getElementById('status').textContent = 'error';
        document.getElementById('status').className = 'error';
        output.textContent = e?.message || String(e);
      }
    }
    document.addEventListener('DOMContentLoaded', () => runHealth());
  </script>
  </head>
  <body>
    <h1>Portfolio+ 健康檢查：<span id="status" class="warn">pending</span></h1>
    <div class="card">
      <p>此頁會呼叫 <code>/api/health.php</code>，檢查資料庫連線與學生端點檔案存在性。</p>
      <button onclick="runHealth()">重新檢查</button>
    </div>
    <pre id="output">等待中...</pre>
  </body>
</html>
