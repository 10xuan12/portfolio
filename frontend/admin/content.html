<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>內容審核 - Portfolio+</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/admin/content.css">
</head>
<body>
    <!-- 導覽列 -->
    <div id="navbar-placeholder"></div>
    <script>
    (function() {
      var role = (localStorage.getItem('user') && JSON.parse(localStorage.getItem('user')).role) || null;
      var path = '../navbar.html';
      fetch(path)
        .then(res => res.text())
        .then(html => {
          var temp = document.createElement('div');
          temp.innerHTML = html;
          var tplId = 'navbar-visitor';
          if (role === 'student') tplId = 'navbar-student';
          else if (role === 'enterprise') tplId = 'navbar-enterprise';
          else if (role === 'admin') tplId = 'navbar-admin';
          var tpl = temp.querySelector('#' + tplId);
          if (tpl) document.getElementById('navbar-placeholder').innerHTML = tpl.innerHTML;
        });
    })();
    </script>

    <!-- 主要內容 -->
    <main class="content-container">
        <div class="container">
            <div class="header-top">
                <button class="btn-back" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i>
                    返回
                </button>
            </div>
            <div class="content-header">
                <h1 class="content-title">內容審核</h1>
                <div class="content-actions">
                    <button class="btn btn-outline" onclick="exportReviews()">
                        <i class="fas fa-download"></i>
                        匯出審核記錄
                    </button>
                    <button class="btn btn-primary" onclick="refreshReviews()">
                        <i class="fas fa-sync-alt"></i>
                        重新整理
                    </button>
                </div>
            </div>

            <!-- 統計卡片 -->
            <div class="stats-cards">
                <div class="stat-card">
                    <div class="number">12</div>
                    <div class="label">待審核作品</div>
                </div>
                <div class="stat-card">
                    <div class="number">3</div>
                    <div class="label">待審核職缺</div>
                </div>
                <div class="stat-card">
                    <div class="number">5</div>
                    <div class="label">待審核使用者</div>
                </div>
                <div class="stat-card">
                    <div class="number">8</div>
                    <div class="label">待處理報告</div>
                </div>
            </div>

            <!-- 內容標籤 -->
            <div class="content-white-wrap">
            <div class="content-tabs">
                <button class="content-tab active" onclick="switchTab('portfolios')">
                    <i class="fas fa-folder"></i>
                    作品審核
                </button>
                <button class="content-tab" onclick="switchTab('jobs')">
                    <i class="fas fa-briefcase"></i>
                    職缺審核
                </button>
                <button class="content-tab" onclick="switchTab('users')">
                    <i class="fas fa-users"></i>
                    使用者審核
                </button>
                <button class="content-tab" onclick="switchTab('reports')">
                    <i class="fas fa-flag"></i>
                    報告處理
                </button>
            </div>

            <!-- 篩選欄 -->
            <div class="filter-grid">
                    <div class="filter-group">
                        <label for="searchFilter">搜尋內容</label>
                        <input type="text" id="searchFilter" placeholder="搜尋標題、作者、描述...">
                    </div>
                    <div class="filter-group">
                        <label for="statusFilter">審核狀態</label>
                        <select id="statusFilter">
                            <option value="">全部狀態</option>
                            <option value="pending">待審核</option>
                            <option value="approved">已核准</option>
                            <option value="rejected">已拒絕</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="typeFilter">內容類型</label>
                        <select id="typeFilter">
                            <option value="">全部類型</option>
                            <option value="web">網頁設計</option>
                            <option value="mobile">行動應用</option>
                            <option value="design">UI/UX 設計</option>
                            <option value="data">數據分析</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="dateFilter">提交日期</label>
                        <select id="dateFilter">
                            <option value="">全部日期</option>
                            <option value="today">今天</option>
                            <option value="week">本週</option>
                            <option value="month">本月</option>
                        </select>
                    </div>
            </div>

            <!-- 作品審核 -->
            <div class="content-section active" id="portfoliosSection">
                <div class="review-grid" id="portfoliosGrid"></div>
            </div>

            <!-- 職缺審核 -->
            <div class="content-section" id="jobsSection">
                <div class="review-grid" id="jobsGrid"></div>
            </div>

            <!-- 使用者審核 -->
            <div class="content-section" id="usersSection">
                <div class="review-grid" id="usersGrid"></div>
            </div>

            <!-- 報告處理 -->
            <div class="content-section" id="reportsSection">
                <div class="review-grid" id="reportsGrid"></div>
            </div>
            </div>
        </div>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/api-service.js"></script>
    <script src="../js/admin/content.js"></script>
    <script>
        // 確保 goBack 函數立即可用
        if (typeof goBack === 'undefined') {
            function goBack() {
                window.history.back();
            }
            window.goBack = goBack;
        }
    </script>
</body>
</html>
