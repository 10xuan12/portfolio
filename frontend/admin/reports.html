<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>報告管理 - Portfolio+</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/admin/reports.css">
</head>
<body>
    <!-- 導覽列 -->
    <div id="navbar-placeholder"></div>
    <script>
    (function() {
      var role = (localStorage.getItem('user') && JSON.parse(localStorage.getItem('user')).role) || null;
      var path = '../navbar.html';
      fetch(path)
        .then(res => res.text())
        .then(html => {
          var temp = document.createElement('div');
          temp.innerHTML = html;
          var tplId = 'navbar-visitor';
          if (role === 'student') tplId = 'navbar-student';
          else if (role === 'enterprise') tplId = 'navbar-enterprise';
          else if (role === 'admin') tplId = 'navbar-admin';
          var tpl = temp.querySelector('#' + tplId);
          if (tpl) document.getElementById('navbar-placeholder').innerHTML = tpl.innerHTML;
        });
    })();
    </script>

    <!-- 主要內容 -->
    <main class="reports-container">
        <div class="container">
            <div class="header-top">
                <button class="btn-back" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i>
                    返回
                </button>
            </div>
            <div class="reports-header">
                <h1 class="reports-title">報告管理</h1>
                <div class="reports-actions">
                    <button class="btn btn-outline" onclick="exportReports()">
                        <i class="fas fa-download"></i>
                        匯出報告
                    </button>
                    <button class="btn btn-primary" onclick="refreshReports()">
                        <i class="fas fa-sync-alt"></i>
                        重新整理
                    </button>
                </div>
            </div>

            <!-- 統計卡片 -->
            <div class="stats-cards">
                <div class="stat-card">
                    <div class="stat-icon icon-pending">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="stat-number">8</div>
                    <div class="stat-label">待處理報告</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon icon-resolved">
                        <i class="fas fa-check"></i>
                    </div>
                    <div class="stat-number">23</div>
                    <div class="stat-label">已處理報告</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon icon-dismissed">
                        <i class="fas fa-times"></i>
                    </div>
                    <div class="stat-number">5</div>
                    <div class="stat-label">已駁回報告</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon icon-total">
                        <i class="fas fa-flag"></i>
                    </div>
                    <div class="stat-number">36</div>
                    <div class="stat-label">總報告數</div>
                </div>
            </div>

            <!-- 篩選欄 -->
            <div class="filter-bar">
                <div class="filter-grid">
                    <div class="filter-group">
                        <label for="searchFilter">搜尋報告</label>
                        <input type="text" id="searchFilter" placeholder="搜尋報告者、被報告者、原因...">
                    </div>
                    <div class="filter-group">
                        <label for="typeFilter">報告類型</label>
                        <select id="typeFilter">
                            <option value="">全部類型</option>
                            <option value="inappropriate">不當內容</option>
                            <option value="spam">垃圾訊息</option>
                            <option value="fake">虛假資訊</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="statusFilter">處理狀態</label>
                        <select id="statusFilter">
                            <option value="">全部狀態</option>
                            <option value="pending">待處理</option>
                            <option value="resolved">已處理</option>
                            <option value="dismissed">已駁回</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="dateFilter">報告日期</label>
                        <select id="dateFilter">
                            <option value="">全部日期</option>
                            <option value="today">今天</option>
                            <option value="week">本週</option>
                            <option value="month">本月</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 報告列表 -->
            <div class="reports-grid" id="reportsGrid"></div>

            <!-- 分頁 -->
            <div class="pagination">
                <button class="page-btn active" onclick="changePage(1)">1</button>
                <button class="page-btn" onclick="changePage(2)">2</button>
                <button class="page-btn" onclick="changePage(3)">3</button>
                <button class="page-btn" onclick="changePage(4)">4</button>
                <button class="page-btn" onclick="changePage(5)">5</button>
                <button class="page-btn" onclick="changePage('next')">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/api-service.js"></script>
    <script src="../js/admin/reports.js"></script>
    <script>
        // 確保 goBack 函數立即可用
        if (typeof goBack === 'undefined') {
            function goBack() {
                window.history.back();
            }
            window.goBack = goBack;
        }
    </script>
</body>
</html>
