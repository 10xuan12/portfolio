<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理員儀表板 - Portfolio+</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 響應式設計 -->
    <link rel="stylesheet" href="../css/mobile-responsive.css">
    <link rel="stylesheet" href="../css/admin/responsive.css">
    
    <link rel="stylesheet" href="../css/student/dashboard.css">
    <link rel="stylesheet" href="../css/admin/common.css">
    <link rel="stylesheet" href="../css/admin/dashboard.css">
    <script>
        // 套用與學生端一致的主題
        (function(){
            if (document && document.body) {
                document.body.classList.remove('admin-theme');
                document.body.classList.add('student-theme');
            } else {
                document.addEventListener('DOMContentLoaded', function(){
                    document.body.classList.remove('admin-theme');
                    document.body.classList.add('student-theme');
                });
            }
        })();
    </script>
</head>
<body>
    <!-- 導覽列 -->
    <div id="navbar-placeholder"></div>
    <script>
    (function() {
      var role = (localStorage.getItem('user') && JSON.parse(localStorage.getItem('user')).role) || null;
      var path = '../navbar.html';
      fetch(path)
        .then(res => res.text())
        .then(html => {
          var temp = document.createElement('div');
          temp.innerHTML = html;
          var tplId = 'navbar-visitor';
          if (role === 'student') tplId = 'navbar-student';
          else if (role === 'enterprise') tplId = 'navbar-enterprise';
          else if (role === 'admin') tplId = 'navbar-admin';
          var tpl = temp.querySelector('#' + tplId);
          if (tpl) document.getElementById('navbar-placeholder').innerHTML = tpl.innerHTML;
        });
    })();
    </script>

    <!-- 儀表板標題 -->
    <section class="dashboard-header">
        <div class="container">
            <h1>管理員儀表板</h1>
            <p>平台管理與監控中心</p>
            
            <div class="dashboard-stats">
                <div class="stat-card">
                    <div class="stat-content-box">
                        <div class="stat-icon"><i class="fas fa-users"></i></div>
                        <div class="stat-info">
                            <div class="number" id="statTotalUsers">0</div>
                            <div class="label">總使用者數</div>
                        </div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-content-box">
                        <div class="stat-icon"><i class="fas fa-briefcase"></i></div>
                        <div class="stat-info">
                            <div class="number" id="statTotalJobs">0</div>
                            <div class="label">總職缺數</div>
                        </div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-content-box">
                        <div class="stat-icon"><i class="fas fa-file-alt"></i></div>
                        <div class="stat-info">
                            <div class="number" id="statTotalApplications">0</div>
                            <div class="label">總申請數</div>
                        </div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-content-box">
                        <div class="stat-icon"><i class="fas fa-flag"></i></div>
                        <div class="stat-info">
                            <div class="number" id="statPendingReports">0</div>
                            <div class="label">待處理報告</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 主要內容 -->
    <section class="dashboard-content">
        <div class="container">
            <div class="dashboard-grid">
                <div class="main-content">
                    <h2>快速操作</h2>
                    <div class="quick-actions">
                        <a href="users.html" class="quick-action">
                            <i class="fas fa-users"></i>
                            <span>使用者管理</span>
                        </a>
                        <a href="analytics.html" class="quick-action">
                            <i class="fas fa-chart-line"></i>
                            <span>數據分析</span>
                        </a>
                        <a href="reports.html" class="quick-action">
                            <i class="fas fa-flag"></i>
                            <span>報告處理</span>
                        </a>
                        <a href="settings.html" class="quick-action">
                            <i class="fas fa-cog"></i>
                            <span>系統設定</span>
                        </a>
                    </div>

                    <h2>實習媒合概況</h2>
                    <div class="internship-overview">
                        <div class="overview-card">
                            <div class="overview-header">
                                <i class="fas fa-briefcase"></i>
                                <h3>職缺管理</h3>
                            </div>
                            <div class="overview-stats">
                                <div class="overview-stat">
                                    <span class="stat-value" id="overviewOpenJobs">0</span>
                                    <span class="stat-label">開放中</span>
                                </div>
                                <div class="overview-stat">
                                    <span class="stat-value" id="overviewTotalJobs">0</span>
                                    <span class="stat-label">總職缺數</span>
                                </div>
                            </div>
                            <a href="analytics.html" class="overview-link">查看職缺統計 <i class="fas fa-arrow-right"></i></a>
                        </div>
                        <div class="overview-card">
                            <div class="overview-header">
                                <i class="fas fa-file-alt"></i>
                                <h3>申請管理</h3>
                            </div>
                            <div class="overview-stats">
                                <div class="overview-stat">
                                    <span class="stat-value" id="overviewPendingApps">0</span>
                                    <span class="stat-label">待處理</span>
                                </div>
                                <div class="overview-stat">
                                    <span class="stat-value" id="overviewTotalApps">0</span>
                                    <span class="stat-label">總申請數</span>
                                </div>
                            </div>
                            <a href="analytics.html" class="overview-link">查看申請統計 <i class="fas fa-arrow-right"></i></a>
                        </div>
                    </div>

                    <h2>平台統計</h2>
                    <div class="chart-container">
                        <h3>使用者註冊趨勢</h3>
                        <div class="chart-placeholder">
                            <i class="fas fa-chart-line" style="font-size: var(--text-2xl); margin-right: var(--spacing-sm);"></i>
                            圖表載入中...
                        </div>
                    </div>

                    <h2>平台活動</h2>
                    <div class="activity-summary">
                        <div class="activity-item">
                            <i class="fas fa-user-plus"></i>
                            <div class="activity-info">
                                <span class="activity-label">最近註冊</span>
                                <span class="activity-value" id="recentRegistrations">0 人</span>
                            </div>
                        </div>
                        <div class="activity-item">
                            <i class="fas fa-briefcase"></i>
                            <div class="activity-info">
                                <span class="activity-label">新增職缺</span>
                                <span class="activity-value" id="recentJobs">0 個</span>
                            </div>
                        </div>
                        <div class="activity-item">
                            <i class="fas fa-file-alt"></i>
                            <div class="activity-info">
                                <span class="activity-label">新增申請</span>
                                <span class="activity-value" id="recentApplications">0 件</span>
                            </div>
                        </div>
                    </div>

                    <h2>系統狀態</h2>
                    <div class="system-health">
                        <!-- 由 frontend/js/admin/dashboard.js 動態渲染 -->
                    </div>
                </div>

                <div class="sidebar">
                    <div class="sidebar-card">
                        <h3>最近活動</h3>
                        <ul class="recent-activity"></ul>
                    </div>

                    <div class="sidebar-card">
                        <h3>平台統計</h3>
                        <div class="platform-stats">
                            <div class="platform-stat-item">
                                <span class="stat-label">學生使用者</span>
                                <span class="stat-value" id="sidebarStudents">0 人</span>
                            </div>
                            <div class="platform-stat-item">
                                <span class="stat-label">企業使用者</span>
                                <span class="stat-value" id="sidebarEnterprises">0 家</span>
                            </div>
                            <div class="platform-stat-item">
                                <span class="stat-label">已發布作品</span>
                                <span class="stat-value" id="sidebarPortfolios">0 件</span>
                            </div>
                            <div class="platform-stat-item">
                                <span class="stat-label">開放職缺</span>
                                <span class="stat-value" id="sidebarJobs">0 個</span>
                            </div>
                            <div class="platform-stat-item">
                                <span class="stat-label">待審核內容</span>
                                <span class="stat-value" id="sidebarPending">0 件</span>
                            </div>
                        </div>
                    </div>

                    <div class="sidebar-card">
                        <h3>系統狀態</h3>
                        <div class="system-status" id="systemStatus">
                            <!-- 由 dashboard.js 動態渲染 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 頁腳 -->
    <div id="footer-placeholder"></div>

    <script src="../js/config.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/api-service.js"></script>
    <script src="../js/admin/dashboard.js"></script>
    <script>
        // 載入管理員資料和統計資訊
        // API 端點：fetch('/api/admin/dashboard')
        console.log('載入管理員儀表板資料...');
        
        // 內容審核功能由 dashboard.js 中的 processReviews() 處理
        document.querySelectorAll('.btn-primary').forEach(button => {
            if (button.textContent === '審核') {
                button.addEventListener('click', function() {
                    console.log('執行內容審核...');
                    // API 端點：POST /api/admin/reviews/{id}/approve
                });
            }
        });
        
        // 系統監控功能 - 定期檢查系統服務狀態
        setInterval(() => {
            console.log('檢查系統狀態...');
            // API 端點：GET /api/admin/system/health
        }, 60000); // 每分鐘檢查一次
        
        // 即時通知功能（可使用輪詢或 SSE 替代 WebSocket）
        // 輪詢示例：setInterval(() => fetch('/api/admin/notifications/unread'), 30000)
        
        // 載入平台統計圖表
        setTimeout(() => {
            const chartPlaceholder = document.querySelector('.chart-placeholder');
            if (chartPlaceholder) {
                chartPlaceholder.innerHTML = '<i class="fas fa-chart-line" style="font-size: var(--text-2xl); margin-right: var(--spacing-sm);"></i>圖表載入完成';
            }
        }, 2000);
    </script>
    
    <!-- 移動選單腳本 -->
    <script src="../js/mobile-menu.js"></script>
</body>
</html>
