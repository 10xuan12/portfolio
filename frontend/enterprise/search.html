<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人才搜尋 - Portfolio+</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/enterprise/search.css">
</head>
<body>
    <!-- 導覽列 -->
    <div id="navbar-placeholder"></div>
    <script>
    (function() {
      var role = (localStorage.getItem('user') && JSON.parse(localStorage.getItem('user')).role) || null;
      var path = '../navbar.html';
      fetch(path)
        .then(res => res.text())
        .then(html => {
          var temp = document.createElement('div');
          temp.innerHTML = html;
          var tplId = 'navbar-visitor';
          if (role === 'student') tplId = 'navbar-student';
          else if (role === 'enterprise') tplId = 'navbar-enterprise';
          else if (role === 'admin') tplId = 'navbar-admin';
          var tpl = temp.querySelector('#' + tplId);
          if (tpl) document.getElementById('navbar-placeholder').innerHTML = tpl.innerHTML;
        });
    })();
    </script>

    <!-- 主要內容 -->
    <main class="search-container">
        <div class="container">
            <div class="header-top">
                <button class="btn-back" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i>
                    返回
                </button>
            </div>
            <div class="search-header">
                <h1 class="search-title">人才搜尋</h1>
                <div class="search-actions">
                    <button class="btn btn-primary" onclick="clearSearch()">
                        <i class="fas fa-times"></i>
                        清除搜尋
                    </button>
                </div>
            </div>

            <!-- 搜尋欄 -->
            <div class="search-bar">
                <div class="search-input-group">
                    <input type="text" class="search-input" id="searchInput" placeholder="搜尋技能、科系、姓名...">
                    <button class="search-btn" onclick="performSearch()">
                        <i class="fas fa-search"></i>
                        搜尋
                    </button>
                </div>
                
                <div class="advanced-filters">
                    <div class="filter-group">
                        <label for="departmentFilter">科系</label>
                        <select id="departmentFilter">
                            <option value="">全部科系</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="gradeFilter">年級</label>
                        <select id="gradeFilter">
                            <option value="">全部年級</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="skillTagInput">技能</label>
                        <div id="skillTagBox" class="tag-input">
                            <div id="skillTags" class="tag-list"></div>
                            <input type="text" id="skillTagInput" placeholder="輸入技能後按 Enter 新增">
                        </div>
                    </div>
                </div>
                
                <div class="search-suggestions">
                    <div class="suggestion-title">熱門搜尋</div>
                    <div class="suggestion-tags"></div>
                </div>
            </div>

            <!-- 搜尋結果 -->
            <div class="search-results" id="searchResults"></div>

            <!-- 空狀態 -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <i class="fas fa-search"></i>
                <h3>沒有找到符合條件的人才</h3>
                <p>請嘗試調整搜尋條件或關鍵字</p>
            </div>
        </div>
    </main>

    <script src="../js/config.js?v=20251104" defer></script>
    <script src="../js/api-service.js?v=20251104" defer></script>
    <script src="../js/app.js?v=20251104" defer></script>
    <script src="../js/enterprise/search.js?v=20251104" defer></script>
    <script>
    if (typeof goBack !== 'function') {
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'dashboard.html';
            }
        }
    }
    </script>
</body>
</html>
