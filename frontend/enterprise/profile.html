<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企業資料 - Portfolio+</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .profile-container {
            padding: var(--spacing-2xl) 0;
        }
        
        .profile-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: var(--spacing-xl);
            flex-wrap: wrap;
            gap: var(--spacing-md);
        }
        
        .profile-title {
            font-size: var(--text-2xl);
            font-weight: 700;
            color: var(--gray-900);
        }
        
        .profile-actions {
            display: flex;
            gap: var(--spacing-md);
        }
        
        .profile-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: var(--spacing-xl);
        }
        
        .main-content {
            background: var(--white);
            border-radius: var(--radius-xl);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-md);
        }
        
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
        }
        
        .sidebar-card {
            background: var(--white);
            border-radius: var(--radius-xl);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-md);
        }
        
        .form-section {
            margin-bottom: var(--spacing-xl);
        }
        
        .form-section h3 {
            font-size: var(--text-lg);
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: var(--spacing-md);
            border-bottom: 2px solid var(--gray-200);
            padding-bottom: var(--spacing-sm);
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: var(--spacing-md);
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group label {
            font-size: var(--text-sm);
            font-weight: 500;
            color: var(--gray-700);
            margin-bottom: var(--spacing-xs);
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: var(--spacing-sm);
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
        }
        
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        
        .avatar-section {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }
        
        .avatar-upload {
            position: relative;
            display: inline-block;
            cursor: pointer;
        }
        
        .avatar-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--gray-200);
            transition: all 0.2s ease;
        }
        
        .avatar-upload:hover .avatar-image {
            border-color: var(--primary-color);
        }
        
        .avatar-overlay {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--primary-color);
            color: var(--white);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--text-sm);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }
        
        .stat-item {
            text-align: center;
            padding: var(--spacing-md);
            background: var(--gray-50);
            border-radius: var(--radius-lg);
        }
        
        .stat-number {
            font-size: var(--text-2xl);
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: var(--spacing-xs);
        }
        
        .stat-label {
            font-size: var(--text-sm);
            color: var(--gray-600);
        }
        
        .activity-list {
            list-style: none;
        }
        
        .activity-item {
            padding: var(--spacing-sm) 0;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }
        
        .activity-item:last-child {
            border-bottom: none;
        }
        
        .activity-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--text-sm);
        }
        
        .activity-job { background: var(--primary-color); color: var(--white); }
        .activity-application { background: var(--success-color); color: var(--white); }
        .activity-view { background: var(--accent-color); color: var(--white); }
        .activity-contact { background: var(--warning-color); color: var(--white); }
        
        @media (max-width: 1024px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <!-- 導航欄 -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">
                <a href="../index.html" class="navbar-logo">
                    <i class="fas fa-briefcase"></i>
                    <span>Portfolio+</span>
                </a>
            </div>
            
            <div class="navbar-menu">
                <a href="dashboard.html" class="navbar-link">
                    <i class="fas fa-tachometer-alt"></i>
                    儀表板
                </a>
                <a href="portfolios.html" class="navbar-link">
                    <i class="fas fa-folder"></i>
                    作品瀏覽
                </a>
                <a href="search.html" class="navbar-link">
                    <i class="fas fa-search"></i>
                    人才搜尋
                </a>
                <a href="jobs.html" class="navbar-link">
                    <i class="fas fa-briefcase"></i>
                    職缺管理
                </a>
                <a href="profile.html" class="navbar-link active">
                    <i class="fas fa-building"></i>
                    企業資料
                </a>
                <a href="notifications.html" class="navbar-link">
                    <i class="fas fa-bell"></i>
                    通知
                </a>
                <a href="settings.html" class="navbar-link">
                    <i class="fas fa-cog"></i>
                    設定
                </a>
            </div>
            <div class="navbar-user">
                <div class="user-menu">
                    <img src="https://via.placeholder.com/32x32/667eea/ffffff?text=企" alt="企業頭像" class="user-avatar">
                    <span class="user-name">台灣微軟</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要內容 -->
    <main class="profile-container">
        <div class="container">
            <div class="profile-header">
                <h1 class="profile-title">企業資料</h1>
                <div class="profile-actions">
                    <button class="btn btn-outline" onclick="exportProfile()">
                        <i class="fas fa-download"></i>
                        匯出資料
                    </button>
                    <button class="btn btn-primary" onclick="saveProfile()">
                        <i class="fas fa-save"></i>
                        儲存變更
                    </button>
                </div>
            </div>

            <div class="profile-grid">
                <!-- 主要內容 -->
                <div class="main-content">
                    <form id="profileForm">
                        <!-- 企業標誌 -->
                        <div class="avatar-section">
                            <div class="avatar-upload" onclick="uploadLogo()">
                                <img src="https://via.placeholder.com/120x120/667eea/ffffff?text=微軟" alt="企業標誌" class="avatar-image" id="logoImage">
                                <div class="avatar-overlay">
                                    <i class="fas fa-camera"></i>
                                </div>
                            </div>
                            <p style="color: var(--gray-600); font-size: var(--text-sm); margin-top: var(--spacing-sm);">
                                點擊更換企業標誌
                            </p>
                        </div>

                        <!-- 基本資訊 -->
                        <div class="form-section">
                            <h3>基本資訊</h3>
                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="companyName">公司名稱 *</label>
                                    <input type="text" id="companyName" name="name" value="台灣微軟股份有限公司" required>
                                </div>
                                <div class="form-group">
                                    <label for="companyType">公司類型</label>
                                    <select id="companyType" name="type">
                                        <option value="科技公司" selected>科技公司</option>
                                        <option value="設計公司">設計公司</option>
                                        <option value="顧問公司">顧問公司</option>
                                        <option value="新創公司">新創公司</option>
                                        <option value="其他">其他</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="companySize">公司規模</label>
                                    <select id="companySize" name="size">
                                        <option value="1-10人">1-10人</option>
                                        <option value="11-50人">11-50人</option>
                                        <option value="51-200人" selected>51-200人</option>
                                        <option value="201-1000人">201-1000人</option>
                                        <option value="1000人以上">1000人以上</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="companyIndustry">產業別</label>
                                    <input type="text" id="companyIndustry" name="industry" value="軟體開發">
                                </div>
                            </div>
                        </div>

                        <!-- 聯絡資訊 -->
                        <div class="form-section">
                            <h3>聯絡資訊</h3>
                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="companyEmail">公司信箱 *</label>
                                    <input type="email" id="companyEmail" name="email" value="hr@microsoft.com.tw" required>
                                </div>
                                <div class="form-group">
                                    <label for="companyPhone">公司電話</label>
                                    <input type="tel" id="companyPhone" name="phone" value="02-2345-6789">
                                </div>
                                <div class="form-group">
                                    <label for="companyWebsite">公司網站</label>
                                    <input type="url" id="companyWebsite" name="website" value="https://www.microsoft.com/zh-tw">
                                </div>
                                <div class="form-group">
                                    <label for="companyAddress">公司地址</label>
                                    <input type="text" id="companyAddress" name="address" value="台北市信義區信義路五段7號">
                                </div>
                            </div>
                        </div>

                        <!-- 公司介紹 -->
                        <div class="form-section">
                            <h3>公司介紹</h3>
                            <div class="form-group full-width">
                                <label for="companyDescription">公司簡介</label>
                                <textarea id="companyDescription" name="description" rows="4">台灣微軟是微軟公司在台灣的分公司，致力於推動台灣的數位轉型。我們提供各種軟體解決方案，包括雲端服務、人工智慧、企業應用程式等。我們重視人才發展，提供良好的工作環境和學習機會。</textarea>
                            </div>
                        </div>

                        <!-- 招募資訊 -->
                        <div class="form-section">
                            <h3>招募資訊</h3>
                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="hrName">人資聯絡人</label>
                                    <input type="text" id="hrName" name="hrName" value="王小明">
                                </div>
                                <div class="form-group">
                                    <label for="hrEmail">人資信箱</label>
                                    <input type="email" id="hrEmail" name="hrEmail" value="hr@microsoft.com.tw">
                                </div>
                                <div class="form-group">
                                    <label for="hrPhone">人資電話</label>
                                    <input type="tel" id="hrPhone" name="hrPhone" value="02-2345-6789#123">
                                </div>
                                <div class="form-group">
                                    <label for="recruitmentProcess">招募流程</label>
                                    <select id="recruitmentProcess" name="recruitmentProcess">
                                        <option value="面試">面試</option>
                                        <option value="筆試+面試" selected>筆試+面試</option>
                                        <option value="專案測試+面試">專案測試+面試</option>
                                        <option value="其他">其他</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- 福利制度 -->
                        <div class="form-section">
                            <h3>福利制度</h3>
                            <div class="form-group full-width">
                                <label for="benefits">公司福利</label>
                                <textarea id="benefits" name="benefits" rows="4">• 具競爭力的薪資待遇
• 完善的保險制度（勞保、健保、團保）
• 年終獎金及績效獎金
• 教育訓練補助
• 員工旅遊
• 彈性工作時間
• 免費咖啡及零食
• 健身房補助</textarea>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- 側邊欄 -->
                <div class="sidebar">
                    <!-- 統計資料 -->
                    <div class="sidebar-card">
                        <h3>企業統計</h3>
                        <div class="stats-grid">
                            <div class="stat-item">
                                <div class="stat-number">5</div>
                                <div class="stat-label">發布職缺</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number">23</div>
                                <div class="stat-label">收到申請</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number">156</div>
                                <div class="stat-label">瀏覽次數</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number">8</div>
                                <div class="stat-label">聯絡學生</div>
                            </div>
                        </div>
                    </div>

                    <!-- 最近活動 -->
                    <div class="sidebar-card">
                        <h3>最近活動</h3>
                        <ul class="activity-list">
                            <!-- TODO: 從資料庫載入企業活動記錄 -->
                            <!-- 假資料開始 -->
                            <li class="activity-item">
                                <div class="activity-icon activity-job">
                                    <i class="fas fa-briefcase"></i>
                                </div>
                                <div>
                                    <div>發布了新職缺「前端開發實習生」</div>
                                    <small>2 小時前</small>
                                </div>
                            </li>
                            <li class="activity-item">
                                <div class="activity-icon activity-application">
                                    <i class="fas fa-file-alt"></i>
                                </div>
                                <div>
                                    <div>收到張小明的實習申請</div>
                                    <small>4 小時前</small>
                                </div>
                            </li>
                            <li class="activity-item">
                                <div class="activity-icon activity-view">
                                    <i class="fas fa-eye"></i>
                                </div>
                                <div>
                                    <div>瀏覽了李大明作品「行動應用程式」</div>
                                    <small>6 小時前</small>
                                </div>
                            </li>
                            <li class="activity-item">
                                <div class="activity-icon activity-contact">
                                    <i class="fas fa-envelope"></i>
                                </div>
                                <div>
                                    <div>聯絡了王小美討論實習機會</div>
                                    <small>1 天前</small>
                                </div>
                            </li>
                            <!-- 假資料結束 -->
                        </ul>
                    </div>

                    <!-- 快速操作 -->
                    <div class="sidebar-card">
                        <h3>快速操作</h3>
                        <div style="display: flex; flex-direction: column; gap: var(--spacing-sm);">
                            <button class="btn btn-outline" onclick="window.location.href='jobs.html'">
                                <i class="fas fa-plus"></i>
                                發布新職缺
                            </button>
                            <button class="btn btn-outline" onclick="window.location.href='search.html'">
                                <i class="fas fa-search"></i>
                                搜尋人才
                            </button>
                            <button class="btn btn-outline" onclick="window.location.href='applications.html'">
                                <i class="fas fa-list"></i>
                                查看申請
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/app.js"></script>
    <script src="profile.js"></script>
</body>
</html>
