<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>職缺申請管理 - Portfolio+</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/enterprise/job-application.css">
</head>
<body>
    <!-- 導覽列 -->
    <div id="navbar-placeholder"></div>
    <script>
    (function() {
      var role = (localStorage.getItem('user') && JSON.parse(localStorage.getItem('user')).role) || null;
      var path = '../navbar.html';
      fetch(path)
        .then(res => res.text())
        .then(html => {
          var temp = document.createElement('div');
          temp.innerHTML = html;
          var tplId = 'navbar-visitor';
          if (role === 'student') tplId = 'navbar-student';
          else if (role === 'enterprise') tplId = 'navbar-enterprise';
          else if (role === 'admin') tplId = 'navbar-admin';
          var tpl = temp.querySelector('#' + tplId);
          if (tpl) document.getElementById('navbar-placeholder').innerHTML = tpl.innerHTML;
        });
    })();
    </script>

    <!-- 主要內容 -->
    <main class="job-application-container">
        <div class="container">
            <div class="header-top">
                <button class="btn-back" onclick="goBack()">
                    <i class="bi bi-arrow-left"></i>
                    返回
                </button>
            </div>
            
            <div class="page-header">
                <h1 class="page-title">職缺申請管理</h1>
                <div class="page-actions">
                    <div class="filter-group">
                        <select id="jobFilter" class="filter-select">
                            <option value="">所有職缺</option>
                        </select>
                        <select id="statusFilter" class="filter-select">
                            <option value="">所有狀態</option>
                            <option value="pending">待審核</option>
                            <option value="reviewed">已審核</option>
                            <option value="interviewed">已面試</option>
                            <option value="accepted">已錄取</option>
                            <option value="rejected">已拒絕</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 統計卡片 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="bi bi-people"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="totalApplications">0</h3>
                        <p>總申請數</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon pending">
                        <i class="bi bi-clock"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="pendingApplications">0</h3>
                        <p>待審核</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon accepted">
                        <i class="bi bi-check-circle"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="acceptedApplications">0</h3>
                        <p>已錄取</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon rejected">
                        <i class="bi bi-x-circle"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="rejectedApplications">0</h3>
                        <p>已拒絕</p>
                    </div>
                </div>
            </div>

            <!-- 申請列表 -->
            <div class="applications-section">
                <div class="section-header">
                    <h2>申請列表</h2>
                    <div class="view-controls">
                        <button class="view-btn active" data-view="list" onclick="switchView('list')">
                            <i class="bi bi-list-ul"></i>
                        </button>
                        <button class="view-btn" data-view="grid" onclick="switchView('grid')">
                            <i class="bi bi-grid-3x3-gap"></i>
                        </button>
                    </div>
                </div>

                <div class="applications-container">
                    <div id="applicationsList" class="applications-list">
                        <!-- 申請列表內容將在這裡動態生成 -->
                    </div>
                </div>

                <!-- 分頁 -->
                <div class="pagination" id="pagination">
                    <!-- 分頁按鈕將在這裡動態生成 -->
                </div>
            </div>
        </div>
    </main>

    <!-- 申請詳情模態框 -->
    <div class="modal" id="applicationModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">申請詳情</h3>
                <button class="modal-close" onclick="closeModal()">
                    <i class="bi bi-x"></i>
                </button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- 申請詳情內容將在這裡動態生成 -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal()">關閉</button>
                <button class="btn btn-primary" onclick="updateApplicationStatus()">
                    <i class="bi bi-save"></i>
                    更新狀態
                </button>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api-service.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/enterprise/job-application.js"></script>
    <script>
    if (typeof goBack !== 'function') {
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'dashboard.html';
            }
        }
    }
    </script>
</body>
</html>
