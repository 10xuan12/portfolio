<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品瀏覽 - Portfolio+</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/enterprise/portfolio.css">
    
    <!-- 新功能樣式 -->
    <link rel="stylesheet" href="../css/popularity-tags.css">
    <link rel="stylesheet" href="../css/favorites-system.css">
    <link rel="stylesheet" href="../css/card-3d-flip.css">
</head>
<body>
    <!-- 導覽列 -->
    <div id="navbar-placeholder"></div>
    <script>
    (function() {
      var role = (localStorage.getItem('user') && JSON.parse(localStorage.getItem('user')).role) || null;
      var path = '../navbar.html';
      fetch(path)
        .then(res => res.text())
        .then(html => {
          var temp = document.createElement('div');
          temp.innerHTML = html;
          var tplId = 'navbar-visitor';
          if (role === 'student') tplId = 'navbar-student';
          else if (role === 'enterprise') tplId = 'navbar-enterprise';
          else if (role === 'admin') tplId = 'navbar-admin';
          var tpl = temp.querySelector('#' + tplId);
          if (tpl) document.getElementById('navbar-placeholder').innerHTML = tpl.innerHTML;
        });
    })();
    </script>

    <!-- 主要內容 -->
    <main class="portfolios-container">
        <div class="container">
            <div class="header-top">
                <button class="btn-back" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i>
                    返回
                </button>
            </div>
            <div class="portfolios-header">
                <h1 class="portfolios-title">作品瀏覽</h1>
            </div>

            <!-- 篩選欄 -->
            <div class="filter-bar">
                <div class="filter-grid">
                    <div class="filter-group">
                        <label for="searchFilter">搜尋關鍵字</label>
                        <input type="text" id="searchFilter" placeholder="搜尋作品標題、作者、描述...">
                    </div>
                    <div class="filter-group">
                        <label for="categoryFilter">作品學群</label>
                        <select id="categoryFilter">
                            <option value="">全部分類</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="departmentFilter">科系</label>
                        <select id="departmentFilter">
                            <option value="">全部科系</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="sortFilter">排序方式</label>
                        <select id="sortFilter">
                            <option value="relevance">相關度</option>
                            <option value="date">最新發布</option>
                            <option value="views">瀏覽次數</option>
                            <option value="likes">讚數</option>
                        </select>
                    </div>
                    <div class="filter-group search-group">
                        <button class="btn btn-primary" id="searchButton" title="搜尋" aria-label="搜尋"><i class="fas fa-search"></i> 搜尋</button>
                    </div>
                </div>
            </div>

            <!-- 作品列表 -->
            <div class="portfolios-grid" id="portfoliosGrid"></div>

            <!-- 空狀態 -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <i class="fas fa-search"></i>
                <h3>沒有找到符合條件的作品</h3>
                <p>請嘗試調整搜尋條件或篩選器</p>
            </div>
        </div>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/api-service.js"></script>
    <script src="../js/app.js"></script>
    
    <!-- 新功能腳本 -->
    <script src="../js/popularity-tags.js"></script>
    <script src="../js/favorites-system.js"></script>
    <script src="../js/card-3d-flip.js"></script>
    
    <script src="../js/enterprise/portfolios.js"></script>
    
    <script>
        // 監聽作品渲染完成事件，添加熱門度標籤
        document.addEventListener('DOMContentLoaded', function() {
            // 監聽作品列表更新
            const observer = new MutationObserver(function(mutations) {
                mutations.forEach(function(mutation) {
                    if (mutation.addedNodes.length > 0) {
                        addTagsToPortfolios();
                    }
                });
            });
            
            const portfoliosGrid = document.getElementById('portfoliosGrid');
            if (portfoliosGrid) {
                observer.observe(portfoliosGrid, { childList: true });
            }
        });
        
        // 為作品添加熱門度標籤
        function addTagsToPortfolios() {
            const portfolioCards = document.querySelectorAll('.portfolio-card[data-portfolio-id]');
            
            portfolioCards.forEach(card => {
                // 檢查是否已經添加過標籤
                if (card.querySelector('.popularity-tags')) {
                    return;
                }
                
                // 從卡片屬性中獲取作品數據
                const portfolioData = {
                    id: card.getAttribute('data-portfolio-id'),
                    createdAt: card.getAttribute('data-created-at'),
                    views: parseInt(card.getAttribute('data-views')) || 0,
                    likes: parseInt(card.getAttribute('data-likes')) || 0,
                    comments: parseInt(card.getAttribute('data-comments')) || 0,
                    shares: parseInt(card.getAttribute('data-shares')) || 0,
                    isFeatured: card.getAttribute('data-featured') === 'true'
                };
                
                // 添加熱門度標籤
                addPopularityTags(card, portfolioData);
            });
        }
    </script>
    <script>
    if (typeof goBack !== 'function') {
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'dashboard.html';
            }
        }
    }
    </script>
</body>
</html>
