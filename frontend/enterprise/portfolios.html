<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品瀏覽 - Portfolio+</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/enterprise/portfolio.css">
</head>
<body>
    <!-- 導覽列 -->
    <div id="navbar-placeholder"></div>
    <script>
    (function() {
      var role = (localStorage.getItem('user') && JSON.parse(localStorage.getItem('user')).role) || null;
      var path = '../navbar.html';
      fetch(path)
        .then(res => res.text())
        .then(html => {
          var temp = document.createElement('div');
          temp.innerHTML = html;
          var tplId = 'navbar-visitor';
          if (role === 'student') tplId = 'navbar-student';
          else if (role === 'enterprise') tplId = 'navbar-enterprise';
          else if (role === 'admin') tplId = 'navbar-admin';
          var tpl = temp.querySelector('#' + tplId);
          if (tpl) document.getElementById('navbar-placeholder').innerHTML = tpl.innerHTML;
        });
    })();
    </script>

    <!-- 主要內容 -->
    <main class="portfolios-container">
        <div class="container">
            <div class="header-top">
                <button class="btn-back" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i>
                    返回
                </button>
            </div>
            <div class="portfolios-header">
                <h1 class="portfolios-title">作品瀏覽</h1>
                <div class="portfolios-actions">
                    <button class="btn btn-outline" onclick="exportPortfolios()">
                        <i class="fas fa-download"></i>
                        匯出結果
                    </button>
                    <button class="btn btn-primary" onclick="refreshPortfolios()">
                        <i class="fas fa-sync-alt"></i>
                        重新整理
                    </button>
                </div>
            </div>

            <!-- 篩選欄 -->
            <div class="filter-bar">
                <div class="filter-grid">
                    <div class="filter-group">
                        <label for="searchFilter">搜尋關鍵字</label>
                        <input type="text" id="searchFilter" placeholder="搜尋作品標題、作者、描述...">
                    </div>
                    <div class="filter-group">
                        <label for="categoryFilter">作品分類</label>
                        <select id="categoryFilter">
                            <option value="">全部分類</option>
                            <option value="web">網頁設計</option>
                            <option value="mobile">行動應用</option>
                            <option value="design">UI/UX 設計</option>
                            <option value="data">數據分析</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="departmentFilter">科系</label>
                        <select id="departmentFilter">
                            <option value="">全部科系</option>
                            <option value="資訊管理學系">資訊管理學系</option>
                            <option value="資訊工程學系">資訊工程學系</option>
                            <option value="設計學系">設計學系</option>
                            <option value="商學院">商學院</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="sortFilter">排序方式</label>
                        <select id="sortFilter">
                            <option value="relevance">相關度</option>
                            <option value="date">最新發布</option>
                            <option value="views">瀏覽次數</option>
                            <option value="likes">讚數</option>
                        </select>
                    </div>
                    <div class="filter-group search-group">
                        <button class="btn btn-primary" id="searchButton" title="搜尋" aria-label="搜尋"><i class="fas fa-search"></i> 搜尋</button>
                    </div>
                </div>
            </div>

            <!-- 作品列表 -->
            <div class="portfolios-grid" id="portfoliosGrid"></div>

            <!-- 空狀態 -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <i class="fas fa-search"></i>
                <h3>沒有找到符合條件的作品</h3>
                <p>請嘗試調整搜尋條件或篩選器</p>
            </div>
        </div>
    </main>

    <script src="../js/app.js"></script>
    <script src="../js/enterprise/portfolios.js"></script>
    <script>
    if (typeof goBack !== 'function') {
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'dashboard.html';
            }
        }
    }
    </script>
</body>
</html>
