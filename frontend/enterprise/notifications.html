<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通知 - Portfolio+</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/enterprise/notification.css">
</head>
<body>
    <!-- 導覽列 -->
    <div id="navbar-placeholder"></div>
    <script>
    (function() {
      var role = (localStorage.getItem('user') && JSON.parse(localStorage.getItem('user')).role) || null;
      var path = '../navbar.html';
      fetch(path)
        .then(res => res.text())
        .then(html => {
          var temp = document.createElement('div');
          temp.innerHTML = html;
          var tplId = 'navbar-visitor';
          if (role === 'student') tplId = 'navbar-student';
          else if (role === 'enterprise') tplId = 'navbar-enterprise';
          else if (role === 'admin') tplId = 'navbar-admin';
          var tpl = temp.querySelector('#' + tplId);
          if (tpl) document.getElementById('navbar-placeholder').innerHTML = tpl.innerHTML;
        });
    })();
    </script>

    <!-- 主要內容 -->
    <main class="notifications-container">
        <div class="container">
            <div class="header-top">
                <button class="btn-back" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i>
                    返回
                </button>
            </div>
            <div class="notifications-header">
                <h1 class="notifications-title">通知</h1>
                <div class="notifications-actions">
                    <button class="btn btn-outline" onclick="markAllAsRead()">
                        <i class="fas fa-check-double"></i>
                        全部標記已讀
                    </button>
                    <button class="btn btn-outline" onclick="clearNotifications()">
                        <i class="fas fa-trash"></i>
                        清除通知
                    </button>
                </div>
            </div>

            <div class="notifications-grid">
                <!-- 通知列表 -->
                <div class="notifications-list">
                    <div class="notifications-header-bar">
                        <div class="notifications-count">
                            <span id="notificationsCount">0</span> 個通知
                        </div>
                        <div class="notifications-filters">
                            <button class="filter-btn active" onclick="filterNotifications('all')">全部</button>
                            <button class="filter-btn" onclick="filterNotifications('unread')">未讀</button>
                            <button class="filter-btn" onclick="filterNotifications('application')">申請</button>
                            <button class="filter-btn" onclick="filterNotifications('job')">職缺</button>
                            <button class="filter-btn" onclick="filterNotifications('system')">系統</button>
                        </div>
                    </div>
                    
                    <div id="notificationsList"><!-- 通知列表由 JS 動態載入 --></div>
                </div>

                <!-- 側邊欄 -->
                <div class="notification-sidebar">
                    <!-- 通知統計 -->
                    <div class="sidebar-card">
                        <h3>通知統計</h3>
                        <div class="notification-stats">
                            <div class="stat-card">
                                <div class="stat-content-box">
                                    <div class="number">0</div>
                                    <div class="label">總通知</div>
                                </div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-content-box">
                                    <div class="number">0</div>
                                    <div class="label">未讀</div>
                                </div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-content-box">
                                    <div class="number">0</div>
                                    <div class="label">申請</div>
                                </div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-content-box">
                                    <div class="number">0</div>
                                    <div class="label">職缺</div>
                                </div>
                            </div>
                        </div>
                    </div>
                            </li>
                            <li class="type-item">
                                <div class="type-label">
                                    <div class="type-icon notification-view"></div>
                                    瀏覽通知
                                </div>
                                <span class="type-count">4</span>
                            </li>
                            <li class="type-item">
                                <div class="type-label">


                    <!-- 快速操作 -->
                    <div class="sidebar-card">
                        <h3>快速操作</h3>
                        <div style="display: flex; flex-direction: column; gap: var(--spacing-sm);">
                            <button class="btn btn-outline" onclick="window.location.href='applications.html'">
                                <i class="fas fa-list"></i>
                                查看所有申請
                            </button>
                            <button class="btn btn-outline" onclick="window.location.href='jobs.html'">
                                <i class="fas fa-briefcase"></i>
                                管理職缺
                            </button>
                            <button class="btn btn-outline" onclick="window.location.href='search.html'">
                                <i class="fas fa-search"></i>
                                搜尋人才
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/app.js"></script>
    <script src="../js/enterprise/notifications.js"></script>
    <script>
    if (typeof goBack !== 'function') {
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'dashboard.html';
            }
        }
    }
    </script>
</body>
</html>
