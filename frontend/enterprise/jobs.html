<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>職缺管理 - Portfolio+</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/enterprise/job.css">
</head>
<body>
    <!-- 導覽列 -->
    <div id="navbar-placeholder"></div>
    <script>
    (function() {
      var role = (localStorage.getItem('user') && JSON.parse(localStorage.getItem('user')).role) || null;
      var path = '../navbar.html';
      fetch(path)
        .then(res => res.text())
        .then(html => {
          var temp = document.createElement('div');
          temp.innerHTML = html;
          var tplId = 'navbar-visitor';
          if (role === 'student') tplId = 'navbar-student';
          else if (role === 'enterprise') tplId = 'navbar-enterprise';
          else if (role === 'admin') tplId = 'navbar-admin';
          var tpl = temp.querySelector('#' + tplId);
          if (tpl) document.getElementById('navbar-placeholder').innerHTML = tpl.innerHTML;
        });
    })();
    </script>

    <!-- 主要內容 -->
    <main class="jobs-container-v2">
        <div class="container-v2">
            <!-- 頂部標題區域 -->
            <div class="page-header">
                <div class="header-top">
                    <button class="btn-back" onclick="goBack()">
                        <i class="bi bi-arrow-left"></i>
                        返回
                    </button>
                </div>
                <div class="header-content">
                    <div>
                        <h1 class="page-title">職缺管理</h1>
                        <p class="page-subtitle">管理您的招募職缺，尋找最適合的人才</p>
                    </div>
                    <div class="header-actions">
                        <button class="btn-icon" onclick="refreshJobs()" title="重新整理">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                        <button class="btn-primary-v2" onclick="showJobForm()">
                            <i class="bi bi-plus-lg"></i>
                            <span>發布新職缺</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 篩選和排序 -->
            <div class="toolbar">
                <div class="filter-tabs">
                    <button class="filter-tab active" data-status="all" onclick="filterJobs('all')">
                        全部職缺
                    </button>
                    <button class="filter-tab" data-status="active" onclick="filterJobs('active')">
                        招募中
                    </button>
                    <button class="filter-tab" data-status="paused" onclick="filterJobs('paused')">
                        暫停中
                    </button>
                    <button class="filter-tab" data-status="closed" onclick="filterJobs('closed')">
                        已關閉
                    </button>
                </div>
                <div class="toolbar-right">
                    <div class="search-box">
                        <i class="bi bi-search"></i>
                        <input type="text" id="searchInput" placeholder="搜尋職缺..." onkeyup="searchJobs()">
                    </div>
                    <select class="sort-select" id="sortSelect" onchange="sortJobs()">
                        <option value="newest">最新發布</option>
                        <option value="oldest">最舊發布</option>
                        <option value="applications">應徵數</option>
                        <option value="views">瀏覽數</option>
                    </select>
                </div>
            </div>

            <!-- 職缺管理區域 -->
            <div class="jobs-management-grid">
                <!-- 職缺列表 -->
                <div class="jobs-list-section">
                    <div class="jobs-grid-v2" id="jobsListV2">
                        <!-- 職缺卡片將由 JavaScript 動態生成 -->
                    </div>

                    <!-- 空狀態 -->
                    <div class="empty-state-v2" id="emptyState" style="display: none;">
                        <div class="empty-icon">
                            <i class="bi bi-inbox"></i>
                        </div>
                        <h3>尚未發布任何職缺</h3>
                        <p>開始發布您的第一個職缺，吸引優秀人才加入團隊</p>
                        <button class="btn-primary-v2" onclick="showJobForm()">
                            <i class="bi bi-plus-lg"></i>
                            <span>發布新職缺</span>
                        </button>
                    </div>
                </div>

                <!-- 職缺表單 -->
                <div class="job-form-section" id="jobFormSection" style="display: none;">
                    <div class="form-header-v2">
                        <h2 class="form-title-v2" id="formTitle">發布新職缺</h2>
                        <button class="btn-close-form" onclick="hideJobForm()">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>

                    <form id="jobFormV2">
                        <input type="hidden" id="jobId" name="jobId">

                        <!-- 基本資訊 -->
                        <div class="form-section-v2">
                            <h3 class="section-title-simple">
                                <i class="bi bi-info-circle-fill"></i>
                                基本資訊
                            </h3>
                            <div class="form-grid-v2">
                                <div class="form-field-v2 full-width">
                                    <label>職缺標題 <span class="required">*</span></label>
                                    <input type="text" id="jobTitle" name="title" placeholder="例：前端工程師 (React)" required>
                                </div>
                                <div class="form-field-v2">
                                    <label>部門 <span class="required">*</span></label>
                                    <select id="jobDepartment" name="department" required>
                                        <option value="">請選擇部門</option>
                                        <!-- 選項將由 JavaScript 動態載入 -->
                                    </select>
                                </div>
                                <div class="form-field-v2">
                                    <label>職缺類型 <span class="required">*</span></label>
                                    <select id="jobType" name="type" required>
                                        <option value="">請選擇類型</option>
                                        <!-- 選項將由 JavaScript 動態載入 -->
                                    </select>
                                </div>
                                <div class="form-field-v2">
                                    <label>工作地點 <span class="required">*</span></label>
                                    <input type="text" id="jobLocation" name="location" placeholder="例：台北市信義區" required>
                                </div>
                                <div class="form-field-v2">
                                    <label>申請截止日期</label>
                                    <input type="date" id="deadline" name="deadline">
                                </div>
                            </div>
                        </div>

                        <!-- 職缺描述 -->
                        <div class="form-section-v2">
                            <h3 class="section-title-simple">
                                <i class="bi bi-file-text-fill"></i>
                                職缺描述
                            </h3>
                            <div class="form-grid-v2">
                                <div class="form-field-v2 full-width">
                                    <label>工作描述 <span class="required">*</span></label>
                                    <textarea id="jobDescription" name="description" rows="4" placeholder="描述這個職位的主要工作內容、團隊環境等..." required></textarea>
                                </div>
                                <div class="form-field-v2 full-width">
                                    <label>工作職責</label>
                                    <textarea id="responsibilities" name="responsibilities" rows="3" placeholder="列出具體的工作職責和日常任務..."></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- 技能要求 -->
                        <div class="form-section-v2">
                            <h3 class="section-title-simple">
                                <i class="bi bi-check2-square"></i>
                                技能要求
                            </h3>
                            <div class="form-grid-v2">
                                <div class="form-field-v2 full-width">
                                    <div class="skills-input-wrapper">
                                        <input type="text" id="requirementInput" placeholder="輸入技能後按 Enter 新增...">
                                        <button type="button" class="btn-add-skill" onclick="addRequirement()">
                                            <i class="bi bi-plus-lg"></i>
                                            新增
                                        </button>
                                    </div>
                                    <div class="skills-tags" id="requirementsList">
                                        <!-- 技能標籤將在這裡動態生成 -->
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 職位要求 -->
                        <div class="form-section-v2">
                            <h3 class="section-title-simple">
                                <i class="bi bi-person-check-fill"></i>
                                職位要求
                            </h3>
                            <div class="form-grid-v2">
                                <div class="form-field-v2">
                                    <label>經驗要求 <span class="required">*</span></label>
                                    <select id="experienceLevel" name="experience_level" required>
                                        <option value="">請選擇經驗要求</option>
                                        <!-- 選項將由 JavaScript 動態載入 -->
                                    </select>
                                </div>
                                <div class="form-field-v2">
                                    <label>學歷要求 <span class="required">*</span></label>
                                    <select id="educationLevel" name="education_level" required>
                                        <option value="">請選擇學歷要求</option>
                                        <!-- 選項將由 JavaScript 動態載入 -->
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- 薪資與福利 -->
                        <div class="form-section-v2">
                            <h3 class="section-title-simple">
                                <i class="bi bi-cash-coin"></i>
                                薪資與福利
                            </h3>
                            <div class="form-grid-v2">
                                <div class="form-field-v2">
                                    <label>最低薪資</label>
                                    <input type="number" id="salaryMin" name="salary_min" placeholder="30000">
                                </div>
                                <div class="form-field-v2">
                                    <label>最高薪資</label>
                                    <input type="number" id="salaryMax" name="salary_max" placeholder="50000">
                                </div>
                                <div class="form-field-v2">
                                    <label>薪資類型 <span class="required">*</span></label>
                                    <select id="salaryType" name="salary_type" required>
                                        <option value="">請選擇薪資類型</option>
                                        <!-- 選項將由 JavaScript 動態載入 -->
                                    </select>
                                </div>
                                <div class="form-field-v2 full-width">
                                    <label>福利待遇</label>
                                    <textarea id="benefits" name="benefits" rows="3" placeholder="例：員工旅遊、年終獎金、彈性工時"></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- 表單按鈕 -->
                        <div class="form-actions-v2">
                            <button type="button" class="btn-outline-v2" onclick="hideJobForm()">
                                取消
                            </button>
                            <button type="submit" class="btn-primary-v2">
                                <i class="bi bi-save"></i>
                                儲存職缺
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/api-service.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/enterprise/jobs.js?v=20251205"></script>
    <script>
    if (typeof goBack !== 'function') {
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'dashboard.html';
            }
        }
    }
    </script>
</body>
</html>
