<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>職缺管理 - Portfolio+</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/enterprise/job.css">
</head>
<body>
    <!-- 導覽列 -->
    <div id="navbar-placeholder"></div>
    <script>
    (function() {
      var role = (localStorage.getItem('user') && JSON.parse(localStorage.getItem('user')).role) || null;
      var path = '../navbar.html';
      fetch(path)
        .then(res => res.text())
        .then(html => {
          var temp = document.createElement('div');
          temp.innerHTML = html;
          var tplId = 'navbar-visitor';
          if (role === 'student') tplId = 'navbar-student';
          else if (role === 'enterprise') tplId = 'navbar-enterprise';
          else if (role === 'admin') tplId = 'navbar-admin';
          var tpl = temp.querySelector('#' + tplId);
          if (tpl) document.getElementById('navbar-placeholder').innerHTML = tpl.innerHTML;
        });
    })();
    </script>

    <!-- 主要內容 -->
    <main class="jobs-container">
        <div class="container">
            <div class="header-top">
                <button class="btn-back" onclick="goBack()">
                    <i class="bi bi-arrow-left"></i>
                    返回
                </button>
            </div>
            <div class="jobs-header">
                <h1 class="jobs-title">職缺管理</h1>
                <div class="jobs-actions">
                    <button class="btn btn-primary" onclick="createNewJob()">
                        <i class="bi bi-plus-lg"></i>
                        發布新職缺
                    </button>
                </div>
            </div>

            <div class="jobs-grid">
                <!-- 職缺列表 -->
                <div class="jobs-list">
                    <h2>我的職缺</h2>
                    <div id="jobsList"></div>
                </div>


                <!-- 職缺表單 -->
                <div class="job-form" id="jobForm" style="display: none;">
                    <h2 id="formTitle">發布新職缺</h2>
                    <form id="jobFormElement">
                        <input type="hidden" id="jobId" name="jobId">
                        
                        <div class="form-section">
                            <h3>基本資訊</h3>
                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="jobTitle">職缺標題</label>
                                    <input type="text" id="jobTitle" name="title" required>
                                </div>
                                <div class="form-group">
                                    <label for="jobDepartment">部門</label>
                                    <select id="jobDepartment" name="department" required>
                                        <option value="">請選擇部門</option>
                                        <option value="技術部">技術部</option>
                                        <option value="設計部">設計部</option>
                                        <option value="行銷部">行銷部</option>
                                        <option value="業務部">業務部</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="jobType">職缺類型</label>
                                    <select id="jobType" name="type" required>
                                        <option value="">請選擇類型</option>
                                        <option value="實習">實習</option>
                                        <option value="正職">正職</option>
                                        <option value="兼職">兼職</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="jobLocation">工作地點</label>
                                    <input type="text" id="jobLocation" name="location" required>
                                </div>
                            </div>
                        </div>

                        <div class="form-section">
                            <h3>職缺描述</h3>
                            <div class="form-group full-width">
                                <label for="jobDescription">工作描述</label>
                                <textarea id="jobDescription" name="description" rows="4" required></textarea>
                            </div>
                        </div>

                        <div class="form-section">
                            <h3>技能要求</h3>
                            <div class="requirements-input">
                                <input type="text" id="requirementInput" placeholder="輸入技能要求...">
                                <button type="button" class="add-requirement-btn" onclick="addRequirement()">
                                    <i class="bi bi-plus-lg"></i> 新增
                                </button>
                            </div>
                            <div class="requirements-list-edit" id="requirementsList">
                                <!-- 技能標籤將在這裡動態生成 -->
                            </div>
                        </div>

                        <div class="form-section">
                            <h3>薪資與福利</h3>
                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="salaryMin">最低薪資</label>
                                    <input type="number" id="salaryMin" name="salary_min" placeholder="例：30000">
                                </div>
                                <div class="form-group">
                                    <label for="salaryMax">最高薪資</label>
                                    <input type="number" id="salaryMax" name="salary_max" placeholder="例：50000">
                                </div>
                                <div class="form-group">
                                    <label for="salaryType">薪資類型</label>
                                    <select id="salaryType" name="salary_type" required>
                                        <option value="">請選擇薪資類型</option>
                                        <option value="月薪">月薪</option>
                                        <option value="年薪">年薪</option>
                                        <option value="時薪">時薪</option>
                                        <option value="面議">面議</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="benefits">福利待遇</label>
                                    <textarea id="benefits" name="benefits" rows="3" placeholder="例：員工旅遊、年終獎金、彈性工時"></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="form-section">
                            <h3>職位要求</h3>
                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="experienceLevel">經驗要求</label>
                                    <select id="experienceLevel" name="experience_level" required>
                                        <option value="">請選擇經驗要求</option>
                                        <option value="無經驗">無經驗</option>
                                        <option value="1-3年">1-3年</option>
                                        <option value="3-5年">3-5年</option>
                                        <option value="5-10年">5-10年</option>
                                        <option value="10年以上">10年以上</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="educationLevel">學歷要求</label>
                                    <select id="educationLevel" name="education_level" required>
                                        <option value="">請選擇學歷要求</option>
                                        <option value="高中">高中</option>
                                        <option value="專科">專科</option>
                                        <option value="大學">大學</option>
                                        <option value="碩士">碩士</option>
                                        <option value="博士">博士</option>
                                        <option value="不拘">不拘</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="deadline">申請截止日期</label>
                                    <input type="date" id="deadline" name="deadline">
                                </div>
                                <div class="form-group">
                                    <label for="responsibilities">工作職責</label>
                                    <textarea id="responsibilities" name="responsibilities" rows="3" placeholder="描述具體的工作職責和任務"></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="button" class="btn btn-outline" onclick="cancelJobForm()">
                                取消
                            </button>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save"></i>
                                儲存職缺
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/api-service.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/enterprise/jobs.js?v=20251104"></script>
    <script>
    if (typeof goBack !== 'function') {
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'dashboard.html';
            }
        }
    }
    </script>
</body>
</html>
