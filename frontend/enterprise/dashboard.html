<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企業儀表板 - Portfolio+</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/student/dashboard.css">
    
    <!-- 新功能樣式 -->
    <link rel="stylesheet" href="../css/featured-daily.css">
    <link rel="stylesheet" href="../css/popularity-tags.css">
    <link rel="stylesheet" href="../css/favorites-system.css">
    <link rel="stylesheet" href="../css/card-3d-flip.css">
    <!-- 作品對比功能樣式 -->
    <link rel="stylesheet" href="../css/portfolio-comparison.css">
    <script>
        // 套用與學生端一致的主題
        (function(){
            if (document && document.body) {
                document.body.classList.remove('enterprise-theme');
                document.body.classList.add('student-theme');
            } else {
                document.addEventListener('DOMContentLoaded', function(){
                    document.body.classList.remove('enterprise-theme');
                    document.body.classList.add('student-theme');
                });
            }
        })();
    </script>
    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid transparent;
            border-radius: 4px;
        }
        
        .alert-danger {
            color: #721c24;
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }
        
        .alert i {
            margin-right: 8px;
        }

        /* 搜尋篩選：企業儀表板本頁圓潤樣式覆蓋 */
        /* 另外移除任何頁首漸層背景 */
        .dashboard-header { background: none !important; }
        .dashboard-header::before { display: none !important; }

        .search-filters {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
            border: 1px solid #f5f5f5;
            display: flex;
            align-items: stretch;
            gap: 16px;
            flex-wrap: wrap;
            overflow-x: visible;
            -webkit-overflow-scrolling: touch;
        }

        .search-filters .filter-row {
            display: flex;
            width: 100%;
            gap: 16px;
            margin-bottom: 16px;
            align-items: flex-end;
        }

        /* 統一欄位內距與堆疊 */
        .search-filters .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 180px;
        }

        .search-filters .filter-group select,
        .search-filters .filter-group input[type="text"] {
            height: 40px;
            line-height: 40px;
        }

        /* 第一行三欄等寬 */
        .search-filters .row-1 .filter-group { flex: 1 1 0; }

        /* 第二行前兩欄等寬，按鈕靠右且不撐寬 */
        .search-filters .row-2 .filter-group { flex: 1 1 0; }
        .search-filters .row-2 .filter-group:last-child { flex: 0 0 auto; margin-left: auto; }

        /* 讓每行的最後一個欄位（年級／搜尋按鈕）靠右對齊 */
        .search-filters .filter-row .filter-group:last-child {
            margin-left: auto;
        }

        .search-filters .filter-group {
            background: transparent;
            border-radius: 24px;
            padding: 0;
            border: none;
            transition: transform 0.1s ease;
        }

        .filter-card { display: contents; }

        .filter-card:hover {
            box-shadow: 0 12px 26px rgba(0,0,0,0.09);
            border-color: var(--gray-300);
            transform: translateY(-1px);
        }

        .filter-thumb { display: none; }

        .filter-content { display: flex; flex-direction: column; gap: 6px; }

        .search-filters .filter-group:focus-within {
            transform: translateY(-1px);
        }

        .search-filters .filter-group label {
            font-size: var(--text-xs);
            color: var(--gray-600);
            padding-left: 2px;
        }

        .search-filters .filter-group select,
        .search-filters .filter-group input[type="text"] {
            width: 100%;
            padding: 8px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            font-size: 14px;
            color: #333;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-filters .filter-group select:focus,
        .search-filters .filter-group input[type="text"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(39, 62, 195, 0.12);
        }

        .search-filters .btn.btn-primary {
            border-radius: 8px;
            padding: 0 20px;
            width: auto;
            white-space: nowrap;
            box-shadow: none !important;
            transition: all 0.2s ease;
            height: 40px;
            background: var(--primary-color) !important;
            color: #fff !important;
            border: 1px solid var(--primary-color) !important;
            font-weight: 500;
        }

        .search-filters .btn.btn-primary:hover {
            transform: none;
            box-shadow: none !important;
            background: var(--primary-dark) !important;
            border-color: var(--primary-dark) !important;
        }

        .search-filters .btn.btn-primary:active {
            transform: none;
            box-shadow: none !important;
            background: var(--primary-color) !important;
            border-color: var(--primary-color) !important;
        }

        @media (max-width: 768px) {
            .filter-card { min-width: 180px; }
        }

        /* 推薦人才條列式顯示 */
        .candidate-grid {
            display: flex !important;
            flex-direction: column !important;
            gap: 16px !important;
        }

        .candidate-grid .student-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: white;
            border-radius: 12px;
            border: 1px solid #f0f0f0;
            transition: all 0.3s ease;
            margin-bottom: 0 !important;
            border-bottom: none !important;
            padding-bottom: 16px !important;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .candidate-grid .student-item:hover {
            background: #f8f9fa;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            border-color: #e0e0e0;
        }

        .candidate-grid .student-item:last-child {
            border-bottom: none;
            padding-bottom: 12px;
            margin-bottom: 0;
        }

        /* 縮小頭像尺寸 */
        .candidate-grid .student-avatar {
            width: 48px !important;
            height: 48px !important;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid #f0f0f0;
        }

        .candidate-grid .student-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 學生資訊區域 */
        .candidate-grid .student-info {
            flex: 1;
            min-width: 0;
        }

        .candidate-grid .student-info h4 {
            margin: 0 0 6px 0;
            font-size: 15px;
            font-weight: 600;
            color: #1a1a1a;
            line-height: 1.2;
        }

        .candidate-grid .student-info p {
            margin: 0;
            font-size: 13px;
            color: #666;
            line-height: 1.3;
        }

        .candidate-grid .student-info .student-major {
            margin-bottom: 2px;
        }

        .candidate-grid .student-info .student-skills {
            color: #888;
            font-size: 11px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 操作按鈕 */
        .candidate-grid .student-actions {
            flex-shrink: 0;
        }

        .candidate-grid .student-actions .btn {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
            white-space: nowrap;
        }

        /* 企業主頁專業化排版 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 320px; /* 增加右側欄位寬度 */
            gap: 40px; /* 增加間距 */
            align-items: start;
            max-width: 1400px; /* 限制最大寬度 */
            margin: 0 auto; /* 置中對齊 */
        }

        .main-content {
            margin-right: 0;
            background: transparent; /* 移除背景，讓內容更透氣 */
            border-radius: 0;
            padding: 0;
            box-shadow: none;
        }

        .sidebar {
            width: 320px; /* 增加寬度 */
            position: sticky;
            top: 30px; /* 增加頂部間距 */
        }

        .sidebar-card {
            background: white;
            border-radius: 16px;
            padding: 24px; /* 增加內邊距 */
            margin-bottom: 24px; /* 增加間距 */
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06); /* 更柔和的陰影 */
            border: 1px solid #f5f5f5; /* 更淡的邊框 */
            min-height: auto; /* 移除固定高度 */
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease; /* 添加過渡效果 */
        }

        .sidebar-card:hover {
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .sidebar-card h3 {
            color: #1a1a1a;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: 600;
            border-bottom: 1px solid #e8e8e8;
            padding-bottom: 12px;
            position: relative;
        }

        .sidebar-card h3::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 30px;
            height: 2px;
            background: var(--primary-color);
            border-radius: 1px;
        }

        /* 最近活動區塊 */
        .recent-activities {
            flex: 1;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .recent-activities li {
            padding: 12px 0;
            border-bottom: 1px solid #f5f5f5;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .recent-activities li:last-child {
            border-bottom: none;
        }

        .recent-activities .activity-icon {
            width: 32px;
            height: 32px;
            background: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
        }

        .recent-activities .activity-content {
            flex: 1;
            font-size: 14px;
            line-height: 1.4;
        }

        .recent-activities .activity-time {
            color: #666;
            font-size: 12px;
            margin-top: 2px;
        }

        /* 最近瀏覽區塊 */
        .recent-portfolios {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .recent-portfolio-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .recent-portfolio-item:hover {
            background: #f8f9fa;
        }

        .recent-portfolio-thumb {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            background: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
        }

        .recent-portfolio-info {
            flex: 1;
            font-size: 13px;
            line-height: 1.3;
        }

        .recent-portfolio-title {
            font-weight: 500;
            color: #333;
            margin-bottom: 2px;
        }

        .recent-portfolio-author {
            color: #666;
            font-size: 12px;
        }

        /* 職缺統計區塊 */
        .job-postings {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .job-stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .job-stat-label {
            font-size: 14px;
            color: #333;
        }

        .job-stat-value {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary-color);
        }

        /* 主內容區域優化 */
        .main-content h2 {
            color: #1a1a1a;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 24px;
            margin-top: 0;
            position: relative;
            padding-bottom: 12px;
        }

        .main-content h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 40px;
            height: 3px;
            background: var(--primary-color);
            border-radius: 2px;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 48px;
        }

        .quick-action {
            background: white;
            border: 1px solid #e8e8e8;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: #4a4a4a;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .quick-action:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-3px);
            box-shadow: 0 4px 16px rgba(39, 62, 195, 0.15);
        }

        .quick-action i {
            font-size: 24px;
            margin-bottom: 12px;
            display: block;
        }

        .quick-action span {
            font-size: 14px;
            font-weight: 500;
        }

        /* 區塊間距優化 */
        .main-content > * + * {
            margin-top: 48px;
        }

        /* 響應式調整 */
        @media (max-width: 1200px) {
            .dashboard-grid {
                grid-template-columns: 1fr 300px;
                gap: 32px;
            }
            
            .sidebar {
                width: 300px;
            }
        }

        @media (max-width: 992px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .sidebar {
                width: 100%;
                position: static;
            }
            
            .sidebar-card {
                min-height: auto;
            }
        }
    </style>
</head>
<body>
    <!-- 導覽列 -->
    <div id="navbar-placeholder"></div>
    <script>
    (function() {
      var role = (localStorage.getItem('user') && JSON.parse(localStorage.getItem('user')).role) || null;
      var path = '../navbar.html';
      fetch(path)
        .then(res => res.text())
        .then(html => {
          var temp = document.createElement('div');
          temp.innerHTML = html;
          var tplId = 'navbar-visitor';
          if (role === 'student') tplId = 'navbar-student';
          else if (role === 'enterprise') tplId = 'navbar-enterprise';
          else if (role === 'admin') tplId = 'navbar-admin';
          var tpl = temp.querySelector('#' + tplId);
          if (tpl) document.getElementById('navbar-placeholder').innerHTML = tpl.innerHTML;
        });
    })();
    </script>

    <script>
        // 初始化企業端新功能
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(initEnterpriseFeaturedDaily, 1000);
            setTimeout(loadFilterOptions, 500); // 載入篩選選項
        });
        
        // 初始化每日精選作品
        async function initEnterpriseFeaturedDaily() {
            try {
                // 從 API 獲取推薦作品
                const response = await fetch('/portfolio/api/random-portfolios.php?limit=5');
                const result = await response.json();
                
                if (result.status === 200 && result.data && result.data.length > 0) {
                    const portfolios = result.data;
                    
                    // 轉換數據格式
                    const featuredData = portfolios.map(p => ({
                        id: p.id,
                        title: p.title,
                        description: p.description || '精彩的作品展示',
                        category: p.category || '作品展示',
                        imageUrl: p.thumbnail_url && p.thumbnail_url !== 'null' ? getImageUrl(p.thumbnail_url) : getDefaultThumbnail(p.category),
                        authorName: p.author_name || p.student_name || '學生',

                        comments: p.comment_count || 0,
                        shares: p.share_count || 0,
                        createdAt: p.created_at,
                        isFeatured: p.is_featured || false
                    }));
                    
                    // 創建每日精選輪播
                    createFeaturedDaily('enterpriseFeaturedDaily', featuredData, {
                        autoPlay: true,
                        autoPlayInterval: 6000,
                        maxFeatured: 5,
                        onPortfolioClick: (portfolio) => {
                            window.location.href = `student-profile.html?portfolio_id=${portfolio.id}`;

                console.error('載入精選作品失敗:', error);

                    // 載入科系選項
                    const deptSelect = document.getElementById('dash-dept-select');
                    if (deptSelect) {

                            deptSelect.appendChild(option);

                    // 載入年級選項

                    loadDefaultFilterOptions();

                console.error('載入篩選選項錯誤:', error);

                loadDefaultFilterOptions();
            }
        }

        // 處理圖片 URL（避免路徑重複）
        function getImageUrl(url) {
            if (!url || url === 'null') return '';
            
            // 如果已經是完整 URL（http 開頭）
            if (url.startsWith('http://') || url.startsWith('https://')) {
                return url;
            }
            
            // 如果已經包含 /portfolio/，直接返回
            if (url.startsWith('/portfolio/')) {
                return url;
            }
            
            // 如果包含 portfolio/ 但沒有前綴 /
            if (url.startsWith('portfolio/')) {
                return '/' + url;
            }
            
            // 其他情況，添加 /portfolio/ 前綴
            return '/portfolio/' + url;
        }

    <script>
        // 檢查配置狀態
        
        console.log('環境:', getEnvironment());

        // 儀表板搜尋篩選：以人才搜尋 API 更新推薦區塊內容
        (function attachDashboardFilters(){
            const btn = document.getElementById('dash-search-btn');
            const keyword = document.getElementById('dash-keyword');
            const skillSel = document.getElementById('dash-skill-select');
            const deptSel = document.getElementById('dash-dept-select');
            const gradeSel = document.getElementById('dash-grade-select');
            const sortSel = document.getElementById('dash-sort-select');

            async function runFilterSearch(){
                try {
                    const svc = window.apiService || window.initializeApiService?.();
                    if (!svc) throw new Error('API 服務未就緒');

                    const q = (keyword?.value || '').trim();
                    const skills = (skillSel?.value || '').replace('全部技能','').trim();
                    // 將常見顯示文字對應成後端 department 關鍵字
                    const department = (deptSel?.value || '').replace('全部科系','').trim();
                    const grade = (gradeSel?.value || '').replace('全部年級','').trim();

                    const params = new URLSearchParams({
                        q,
                        skills,
                        department,
                        grade,
                        minMatch: '0',
                        page: '1',
                        limit: '8'
                    });

                    const res = await svc.request(`enterprise/search.php?${params.toString()}`);
                    const list = res?.data?.students || res?.students || [];

                    const mapped = (Array.isArray(list)? list: []).map(s => ({
                        id: s.id,
                        name: s.name,
                        avatar_url: s.avatar,
                        major: s.department,
                        university: '',
                        skills: Array.isArray(s.skills) ? s.skills.join(', ') : ''
                    }));
                    // 直接覆蓋推薦區塊
                    if (typeof renderRecommendedStudents === 'function') {
                        renderRecommendedStudents(mapped);
                    }
                } catch (e) {
                    console.error('儀表板篩選搜尋失敗:', e);
                }
            }

            if (btn) btn.addEventListener('click', runFilterSearch);
            if (keyword) keyword.addEventListener('keypress', (e)=>{ if (e.key==='Enter') runFilterSearch(); });
            if (skillSel) skillSel.addEventListener('change', runFilterSearch);
            if (deptSel) deptSel.addEventListener('change', runFilterSearch);
            if (gradeSel) gradeSel.addEventListener('change', runFilterSearch);
            if (sortSel) sortSel.addEventListener('change', runFilterSearch); // 目前僅觸發重新查詢
        })();

        // 即時通知、收藏、聯絡：屬進階功能，待啟用 WebSocket / 互動入口後實作
    </script>
