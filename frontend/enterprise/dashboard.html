<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企業儀表板 - Portfolio+</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/enterprise/dashboard.css">
    <script>
        // 設定企業端主題
        document.body.classList.add('enterprise-theme');
    </script>
    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid transparent;
            border-radius: 4px;
        }
        
        .alert-danger {
            color: #721c24;
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }
        
        .alert i {
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <!-- 導覽列 -->
    <div id="navbar-placeholder"></div>
    <script>
    (function() {
      var role = (localStorage.getItem('user') && JSON.parse(localStorage.getItem('user')).role) || null;
      var path = '../navbar.html';
      fetch(path)
        .then(res => res.text())
        .then(html => {
          var temp = document.createElement('div');
          temp.innerHTML = html;
          var tplId = 'navbar-visitor';
          if (role === 'student') tplId = 'navbar-student';
          else if (role === 'enterprise') tplId = 'navbar-enterprise';
          else if (role === 'admin') tplId = 'navbar-admin';
          var tpl = temp.querySelector('#' + tplId);
          if (tpl) document.getElementById('navbar-placeholder').innerHTML = tpl.innerHTML;
        });
    })();
    </script>

    <!-- 載入指示器 -->
    <div id="loading-indicator" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);">
        <div style="text-align: center;">
            <div class="loading-spinner" style="width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 10px;"></div>
            <p>載入中...</p>
        </div>
    </div>

    <!-- 錯誤容器 -->
    <div id="error-container" style="display: none; margin: 20px;"></div>

    <!-- 儀表板標題 -->
    <section class="dashboard-header">
        <div class="container">
            <div class="dashboard-stats">
                <div class="stat-card">
                    <div class="stat-content-box">
                        <div class="stat-number" id="total-views">0</div>
                        <div class="label">瀏覽作品數</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-content-box">
                        <div class="stat-number" id="total-favorites">0</div>
                        <div class="label">收藏作品</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-content-box">
                        <div class="stat-number" id="total-contacts">0</div>
                        <div class="label">聯絡學生</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-content-box">
                        <div class="stat-number" id="total-jobs">0</div>
                        <div class="label">發布職缺</div>
                    </div>
                </div>
            </div>
            
            <h1>歡迎回來，<span id="company-name">企業</span>！</h1>
            <p>以下是您的人才搜尋概況</p>
            <button class="refresh-btn" style="background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 10px;">
                <i class="fas fa-sync-alt"></i> 重新整理
            </button>
        </div>
    </section>

    <!-- 主要內容 -->
    <section class="dashboard-content">
        <div class="container">
            <div class="dashboard-grid">
                <div class="main-content">
                    <h2>快速操作</h2>
                    <div class="quick-actions">
                        <a href="portfolios.html" class="quick-action">
                            <i class="fas fa-search"></i>
                            <span>瀏覽作品</span>
                        </a>
                        <a href="jobs.html" class="quick-action">
                            <i class="fas fa-briefcase"></i>
                            <span>發布職缺</span>
                        </a>
                        <a href="profile.html" class="quick-action">
                            <i class="fas fa-building"></i>
                            <span>企業資料</span>
                        </a>
                        <a href="analytics.html" class="quick-action">
                            <i class="fas fa-chart-bar"></i>
                            <span>數據分析</span>
                        </a>
                    </div>

                    <h2>搜尋篩選</h2>
                    <div class="search-filters">
                        <div class="filter-row">
                            <div class="filter-group">
                                <label>技能</label>
                                <select>
                                    <option>全部技能</option>
                                    <option>JavaScript</option>
                                    <option>React</option>
                                    <option>Python</option>
                                    <option>UI/UX 設計</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label>科系</label>
                                <select>
                                    <option>全部科系</option>
                                    <option>資訊管理學系</option>
                                    <option>財務金融學系</option>
                                    <option>國際企業學系</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label>年級</label>
                                <select>
                                    <option>全部年級</option>
                                    <option>大學三年級</option>
                                    <option>大學四年級</option>
                                    <option>碩士生</option>
                                </select>
                            </div>
                        </div>
                        <div class="filter-row">
                            <div class="filter-group">
                                <label>關鍵字搜尋</label>
                                <input type="text" placeholder="搜尋作品標題或描述...">
                            </div>
                            <div class="filter-group">
                                <label>排序方式</label>
                                <select>
                                    <option>最新上傳</option>
                                    <option>最多瀏覽</option>
                                    <option>最多讚數</option>
                                    <option>最多評論</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label>&nbsp;</label>
                                <button class="btn btn-primary" style="width: 100%;">搜尋</button>
                            </div>
                        </div>
                    </div>

                    <h2>推薦人才</h2>
                    <div class="candidate-grid recommended-students">
                        <!-- 資料將由 JavaScript 動態載入 -->
                    </div>
                </div>

                <div class="sidebar">
                    <div class="sidebar-card">
                        <h3>最近活動</h3>
                        <ul class="recent-activity recent-activities">
                            <!-- 資料將由 JavaScript 動態載入 -->
                        </ul>
                    </div>

                    <div class="sidebar-card">
                        <h3>最近瀏覽</h3>
                        <div class="recent-portfolios">
                            <!-- 資料將由 JavaScript 動態載入 -->
                        </div>
                    </div>

                    <div class="sidebar-card">
                        <h3>職缺統計</h3>
                        <div class="job-postings">
                            <!-- 資料將由 JavaScript 動態載入 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 頁腳 -->
    <div id="footer-placeholder"></div>

    <script src="../js/config.js"></script>
    <script src="../js/mock-data.js"></script>
    <script src="../js/api-service.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/enterprise/dashboard.js"></script>

</body>
</html>
