<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人資料調試 - Portfolio+</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .error { color: red; }
        .success { color: green; }
        .info { color: blue; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 3px; overflow-x: auto; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>個人資料 API 調試工具</h1>
    
    <div class="debug-section">
        <h3>1. 檢查 Local Storage</h3>
        <button onclick="checkLocalStorage()">檢查 Local Storage</button>
        <div id="localStorageResult"></div>
    </div>
    
    <div class="debug-section">
        <h3>2. 測試個人資料 API</h3>
        <button onclick="testProfileAPI()">測試 API</button>
        <div id="apiResult"></div>
    </div>
    
    <div class="debug-section">
        <h3>3. 手動設定使用者資料</h3>
        <input type="text" id="userId" placeholder="使用者 ID" style="width: 100px;">
        <button onclick="setUserData()">設定使用者資料</button>
        <div id="setUserResult"></div>
    </div>
    
    <div class="debug-section">
        <h3>4. 載入個人資料</h3>
        <button onclick="loadProfileData()">載入資料</button>
        <div id="loadResult"></div>
    </div>

    <script>
        // 檢查 Local Storage
        function checkLocalStorage() {
            const resultDiv = document.getElementById('localStorageResult');
            const user = localStorage.getItem('user');
            
            if (user) {
                try {
                    const userData = JSON.parse(user);
                    resultDiv.innerHTML = `
                        <div class="success">✅ Local Storage 中有使用者資料：</div>
                        <pre>${JSON.stringify(userData, null, 2)}</pre>
                    `;
                } catch (e) {
                    resultDiv.innerHTML = `<div class="error">❌ Local Storage 資料格式錯誤：${e.message}</div>`;
                }
            } else {
                resultDiv.innerHTML = '<div class="error">❌ Local Storage 中沒有使用者資料</div>';
            }
        }
        
        // 測試個人資料 API
        async function testProfileAPI() {
            const resultDiv = document.getElementById('apiResult');
            resultDiv.innerHTML = '<div class="info">🔄 正在測試 API...</div>';
            
            try {
                const response = await fetch('/portfolio/api/student/profile.php?action=get&user_id=1', {
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">✅ API 回應成功：</div>
                        <pre>狀態碼: ${response.status}</pre>
                        <pre>回應內容: ${JSON.stringify(result, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">❌ API 回應失敗：</div>
                        <pre>狀態碼: ${response.status}</pre>
                        <pre>錯誤訊息: ${JSON.stringify(result, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">❌ API 請求失敗：</div>
                    <pre>${error.message}</pre>
                `;
            }
        }
        
        // 手動設定使用者資料
        function setUserData() {
            const userId = document.getElementById('userId').value;
            const resultDiv = document.getElementById('setUserResult');
            
            if (!userId) {
                resultDiv.innerHTML = '<div class="error">❌ 請輸入使用者 ID</div>';
                return;
            }
            
            const userData = {
                id: parseInt(userId),
                username: 'selina101292@gmail.com',
                email: 'selina101292@gmail.com',
                role: 'student'
            };
            
            localStorage.setItem('user', JSON.stringify(userData));
            resultDiv.innerHTML = `
                <div class="success">✅ 已設定使用者資料：</div>
                <pre>${JSON.stringify(userData, null, 2)}</pre>
            `;
        }
        
        // 載入個人資料
        async function loadProfileData() {
            const resultDiv = document.getElementById('loadResult');
            const user = localStorage.getItem('user');
            
            if (!user) {
                resultDiv.innerHTML = '<div class="error">❌ 請先設定使用者資料</div>';
                return;
            }
            
            try {
                const userData = JSON.parse(user);
                resultDiv.innerHTML = '<div class="info">🔄 正在載入個人資料...</div>';
                
                const response = await fetch(`/portfolio/api/student/profile.php?action=get&user_id=${userData.id}`, {
                    headers: {
                        'Content-Type': 'application/json',
                        'X-User-ID': userData.id
                    }
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">✅ 個人資料載入成功：</div>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">❌ 個人資料載入失敗：</div>
                        <pre>狀態碼: ${response.status}</pre>
                        <pre>錯誤訊息: ${JSON.stringify(result, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">❌ 載入失敗：</div>
                    <pre>${error.message}</pre>
                `;
            }
        }
        
        // 頁面載入時自動檢查
        document.addEventListener('DOMContentLoaded', function() {
            checkLocalStorage();
        });
    </script>
</body>
</html>
