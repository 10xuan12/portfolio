<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 服務測試 - Portfolio+</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .error { color: red; }
        .success { color: green; }
        .info { color: blue; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 3px; overflow-x: auto; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>API 服務測試工具</h1>
    
    <div class="test-section">
        <h3>1. 檢查腳本載入</h3>
        <button onclick="checkScripts()">檢查腳本</button>
        <div id="scriptResult"></div>
    </div>
    
    <div class="test-section">
        <h3>2. 檢查全域函數</h3>
        <button onclick="checkGlobalFunctions()">檢查全域函數</button>
        <div id="globalResult"></div>
    </div>
    
    <div class="test-section">
        <h3>3. 檢查 API 服務</h3>
        <button onclick="checkApiService()">檢查 API 服務</button>
        <div id="apiResult"></div>
    </div>
    
    <div class="test-section">
        <h3>4. 測試 API 調用</h3>
        <button onclick="testApiCall()">測試 API 調用</button>
        <div id="testResult"></div>
    </div>

    <!-- 載入必要的腳本，注意順序 -->
    <script src="js/config.js"></script>
    <script src="js/mock-data.js"></script>
    <script src="js/api-service.js"></script>
    <script src="js/app.js"></script>
    
    <script>
        // 等待所有腳本載入完成後再檢查
        window.addEventListener('load', function() {
            console.log('所有腳本載入完成，開始檢查...');
            setTimeout(() => {
                checkScripts();
                checkGlobalFunctions();
                checkApiService();
            }, 200);
        });
        
        // 檢查腳本載入
        function checkScripts() {
            const resultDiv = document.getElementById('scriptResult');
            const scripts = [
                'config.js',
                'mock-data.js',
                'api-service.js',
                'app.js'
            ];
            
            let result = '<h4>腳本載入狀態：</h4>';
            scripts.forEach(script => {
                const scriptElement = document.querySelector(`script[src*="${script}"]`);
                if (scriptElement) {
                    result += `<div class="success">✅ ${script} 已載入</div>`;
                } else {
                    result += `<div class="error">❌ ${script} 未載入</div>`;
                }
            });
            
            resultDiv.innerHTML = result;
        }
        
        // 檢查全域函數
        function checkGlobalFunctions() {
            const resultDiv = document.getElementById('globalResult');
            let result = '<h4>全域函數狀態：</h4>';
            
            const functions = [
                'debugLog',
                'getConfig',
                'getApiBaseUrl',
                'isUsingMockData',
                'mockApiDelay',
                'MockData'
            ];
            
            functions.forEach(funcName => {
                if (typeof window[funcName] === 'function') {
                    result += `<div class="success">✅ ${funcName} 函數存在</div>`;
                } else if (typeof window[funcName] !== 'undefined') {
                    result += `<div class="success">✅ ${funcName} 物件存在</div>`;
                } else {
                    result += `<div class="error">❌ ${funcName} 未定義</div>`;
                }
            });
            
            resultDiv.innerHTML = result;
        }
        
        // 檢查 API 服務
        function checkApiService() {
            const resultDiv = document.getElementById('apiResult');
            let result = '<h4>API 服務狀態：</h4>';
            
            // 檢查全域變數
            if (typeof apiService !== 'undefined') {
                result += `<div class="success">✅ apiService 已定義</div>`;
                result += `<pre>類型: ${typeof apiService}</pre>`;
                if (apiService) {
                    result += `<div class="success">✅ apiService 物件存在</div>`;
                } else {
                    result += `<div class="error">❌ apiService 物件為 null</div>`;
                }
            } else {
                result += `<div class="error">❌ apiService 未定義</div>`;
            }
            
            // 檢查初始化函數
            if (typeof window.initializeApiService === 'function') {
                result += `<div class="success">✅ initializeApiService 函數存在</div>`;
            } else {
                result += `<div class="error">❌ initializeApiService 函數不存在</div>`;
            }
            
            // 檢查 window 物件
            result += `<h4>Window 物件檢查：</h4>`;
            result += `<pre>window.apiService: ${typeof window.apiService}</pre>`;
            result += `<pre>window.initializeApiService: ${typeof window.initializeApiService}</pre>`;
            
            resultDiv.innerHTML = result;
        }
        
        // 測試 API 調用
        async function testApiCall() {
            const resultDiv = document.getElementById('testResult');
            resultDiv.innerHTML = '<div class="info">🔄 正在測試 API 調用...</div>';
            
            try {
                if (typeof apiService === 'undefined' || !apiService) {
                    throw new Error('API 服務未初始化');
                }
                
                // 測試一個簡單的 API 調用
                const result = await apiService.getStats('student');
                resultDiv.innerHTML = `
                    <div class="success">✅ API 調用成功！</div>
                    <pre>回應: ${JSON.stringify(result, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">❌ API 調用失敗：</div>
                    <pre>錯誤: ${error.message}</pre>
                `;
            }
        }
    </script>
</body>
</html>
