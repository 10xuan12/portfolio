<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio+ - 快速訪問</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .access-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            padding: var(--spacing-md);
        }
        
        .access-card {
            background: var(--white);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            padding: var(--spacing-2xl);
            width: 100%;
            max-width: 600px;
        }
        
        .access-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }
        
        .access-header h1 {
            font-size: var(--text-2xl);
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: var(--spacing-sm);
        }
        
        .access-header p {
            color: var(--gray-600);
        }
        
        .role-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-xl);
        }
        
        .role-btn {
            padding: var(--spacing-lg);
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-lg);
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            color: var(--gray-700);
            background: var(--white);
        }
        
        .role-btn:hover {
            border-color: var(--primary-color);
            background: var(--primary-color);
            color: var(--white);
            transform: translateY(-2px);
        }
        
        .role-btn i {
            font-size: var(--text-2xl);
            margin-bottom: var(--spacing-sm);
            display: block;
        }
        
        .role-btn h3 {
            font-size: var(--text-lg);
            font-weight: 600;
            margin-bottom: var(--spacing-xs);
        }
        
        .role-btn p {
            font-size: var(--text-sm);
            opacity: 0.8;
        }
        
        .test-accounts {
            margin-top: var(--spacing-xl);
            padding: var(--spacing-lg);
            background: var(--gray-50);
            border-radius: var(--radius-lg);
            border: 1px solid var(--gray-200);
        }
        
        .test-accounts h3 {
            margin-bottom: var(--spacing-md);
            color: var(--gray-700);
            font-size: var(--text-lg);
        }
        
        .account-list {
            display: grid;
            gap: var(--spacing-sm);
        }
        
        .account-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-sm);
            background: var(--white);
            border-radius: var(--radius-md);
            border: 1px solid var(--gray-200);
        }
        
        .account-info {
            flex: 1;
        }
        
        .account-role {
            font-weight: 600;
            color: var(--primary-color);
            font-size: var(--text-sm);
        }
        
        .account-email {
            color: var(--gray-600);
            font-size: var(--text-sm);
        }
        
        .account-password {
            color: var(--gray-500);
            font-family: monospace;
            font-size: var(--text-xs);
        }
        
        .back-link {
            text-align: center;
            margin-top: var(--spacing-xl);
        }
        
        .back-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="access-container">
        <div class="access-card">
            <div class="access-header">
                <h1>Portfolio+ 快速訪問</h1>
                <p>選擇您要查看的頁面，或使用測試帳號登入</p>
            </div>
            
            <div class="role-buttons">
                <a href="student/dashboard.html" class="role-btn">
                    <i class="fas fa-user-graduate"></i>
                    <h3>學生儀表板</h3>
                    <p>查看學生端功能</p>
                </a>
                
                <a href="enterprise/dashboard.html" class="role-btn">
                    <i class="fas fa-building"></i>
                    <h3>企業儀表板</h3>
                    <p>查看企業端功能</p>
                </a>
                
                <a href="admin/dashboard.html" class="role-btn">
                    <i class="fas fa-user-shield"></i>
                    <h3>管理員儀表板</h3>
                    <p>查看管理員功能</p>
                </a>
            </div>
            
            <div class="test-accounts">
                <h3><i class="fas fa-info-circle"></i> 測試帳號資訊</h3>
                <div class="account-list">
                    <div class="account-item">
                        <div class="account-info">
                            <div class="account-role">學生帳號</div>
                            <div class="account-email">student@test.com</div>
                        </div>
                        <div class="account-password">password123</div>
                    </div>
                    
                    <div class="account-item">
                        <div class="account-info">
                            <div class="account-role">企業帳號</div>
                            <div class="account-email">enterprise@test.com</div>
                        </div>
                        <div class="account-password">password123</div>
                    </div>
                    
                    <div class="account-item">
                        <div class="account-info">
                            <div class="account-role">管理員帳號</div>
                            <div class="account-email">admin@test.com</div>
                        </div>
                        <div class="account-password">password123</div>
                    </div>
                </div>
            </div>
            
            <div class="back-link">
                <a href="index.html"><i class="fas fa-arrow-left"></i> 返回首頁</a>
            </div>
        </div>
    </div>
</body>
</html>
