<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>徽章系統測試</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <style>
        .badge-test-card {
            margin-bottom: 20px;
        }
        .test-result {
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
        }
        .success { background-color: #d4edda; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; border: 1px solid #f5c6cb; }
        .info { background-color: #d1ecf1; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">徽章系統測試</h1>
        
        <!-- 用戶資訊 -->
        <div class="card badge-test-card">
            <div class="card-header">
                <h5>用戶資訊</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="userId" class="form-label">用戶 ID:</label>
                    <input type="number" class="form-control" id="userId" value="5" placeholder="輸入用戶ID">
                </div>
                <button class="btn btn-primary" onclick="loadUserInfo()">載入用戶資訊</button>
                <div id="userInfo" class="test-result" style="display: none;"></div>
            </div>
        </div>
        
        <!-- 徽章檢查 -->
        <div class="card badge-test-card">
            <div class="card-header">
                <h5>徽章檢查</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <button class="btn btn-success w-100 mb-2" onclick="checkAllBadges()">檢查所有徽章</button>
                        <button class="btn btn-info w-100 mb-2" onclick="getUserStats()">取得用戶統計</button>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-2">
                            <select class="form-select" id="badgeSelect">
                                <option value="初次登入">初次登入</option>
                                <option value="首次上傳">首次上傳</option>
                                <option value="完整個人檔案">完整個人檔案</option>
                                <option value="熱門作品">熱門作品</option>
                                <option value="明星創作者">明星創作者</option>
                            </select>
                        </div>
                        <button class="btn btn-warning w-100" onclick="checkSpecificBadge()">檢查特定徽章</button>
                    </div>
                </div>
                <div id="badgeResult" class="test-result" style="display: none;"></div>
            </div>
        </div>
        
        <!-- 模擬操作 -->
        <div class="card badge-test-card">
            <div class="card-header">
                <h5>模擬操作</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4">
                        <button class="btn btn-primary w-100 mb-2" onclick="simulateLogin()">模擬登入</button>
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-success w-100 mb-2" onclick="simulateUpload()">模擬上傳作品</button>
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-info w-100 mb-2" onclick="simulateProfile()">模擬更新個人資料</button>
                    </div>
                </div>
                <div id="simulateResult" class="test-result" style="display: none;"></div>
            </div>
        </div>
        
        <!-- 當前徽章狀態 -->
        <div class="card badge-test-card">
            <div class="card-header">
                <h5>當前徽章狀態</h5>
            </div>
            <div class="card-body">
                <button class="btn btn-secondary mb-3" onclick="loadCurrentBadges()">重新載入徽章</button>
                <div id="currentBadges"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '../api';
        
        function getUserId() {
            return document.getElementById('userId').value || 5;
        }
        
        function showResult(elementId, content, type = 'info') {
            const element = document.getElementById(elementId);
            element.innerHTML = content;
            element.className = `test-result ${type}`;
            element.style.display = 'block';
        }
        
        async function apiRequest(url, options = {}) {
            try {
                const response = await fetch(url, {
                    headers: {
                        'Content-Type': 'application/json',
                        'X-User-ID': getUserId()
                    },
                    ...options
                });
                
                const data = await response.json();
                return { success: response.ok, data, status: response.status };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }
        
        async function loadUserInfo() {
            const userId = getUserId();
            showResult('userInfo', '載入中...', 'info');
            
            const result = await apiRequest(`${API_BASE}/student/profile.php?action=get&user_id=${userId}`);
            
            if (result.success) {
                const user = result.data.data || result.data;
                showResult('userInfo', `
                    <strong>用戶資訊:</strong><br>
                    ID: ${user.id || 'N/A'}<br>
                    用戶名: ${user.username || 'N/A'}<br>
                    姓名: ${user.first_name || ''} ${user.last_name || ''}<br>
                    角色: ${user.role || 'N/A'}
                `, 'success');
            } else {
                showResult('userInfo', `載入失敗: ${result.error || result.data?.message || '未知錯誤'}`, 'error');
            }
        }
        
        async function checkAllBadges() {
            showResult('badgeResult', '檢查中...', 'info');
            
            const result = await apiRequest(`${API_BASE}/badge-test.php?action=check_all&user_id=${getUserId()}`);
            
            if (result.success) {
                const data = result.data.data || result.data;
                let content = `<strong>徽章檢查結果:</strong><br>`;
                content += `用戶ID: ${data.user_id}<br>`;
                
                if (data.awarded_badges && data.awarded_badges.length > 0) {
                    content += `<strong>新獲得的徽章:</strong><br>`;
                    data.awarded_badges.forEach(badge => {
                        content += `• ${badge.name}: ${badge.description}<br>`;
                    });
                } else {
                    content += `沒有新徽章獲得<br>`;
                }
                
                showResult('badgeResult', content, 'success');
            } else {
                showResult('badgeResult', `檢查失敗: ${result.error || result.data?.message || '未知錯誤'}`, 'error');
            }
        }
        
        async function checkSpecificBadge() {
            const badgeName = document.getElementById('badgeSelect').value;
            showResult('badgeResult', '檢查中...', 'info');
            
            const result = await apiRequest(`${API_BASE}/badge-test.php?action=check_specific&badge_name=${encodeURIComponent(badgeName)}&user_id=${getUserId()}`);
            
            if (result.success) {
                const data = result.data.data || result.data;
                const content = `
                    <strong>特定徽章檢查結果:</strong><br>
                    徽章: ${data.badge_name}<br>
                    狀態: ${data.awarded ? '已授予' : '未達成'}<br>
                    訊息: ${data.message}
                `;
                showResult('badgeResult', content, data.awarded ? 'success' : 'info');
            } else {
                showResult('badgeResult', `檢查失敗: ${result.error || result.data?.message || '未知錯誤'}`, 'error');
            }
        }
        
        async function getUserStats() {
            showResult('badgeResult', '取得統計中...', 'info');
            
            const result = await apiRequest(`${API_BASE}/badge-test.php?action=user_stats&user_id=${getUserId()}`);
            
            if (result.success) {
                const data = result.data.data || result.data;
                const stats = data.stats;
                const content = `
                    <strong>用戶統計:</strong><br>
                    登入次數: ${stats.login_count}<br>
                    作品數量: ${stats.portfolio_count}<br>
                    個人資料完整: ${stats.profile_complete ? '是' : '否'}<br>
                    總瀏覽數: ${stats.total_views}<br>
                    總讚數: ${stats.total_likes}<br>
                    首次登入: ${stats.is_first_login ? '是' : '否'}
                `;
                showResult('badgeResult', content, 'info');
            } else {
                showResult('badgeResult', `取得統計失敗: ${result.error || result.data?.message || '未知錯誤'}`, 'error');
            }
        }
        
        async function simulateLogin() {
            showResult('simulateResult', '模擬登入中...', 'info');
            
            const result = await apiRequest(`${API_BASE}/badge-test.php`, {
                method: 'POST',
                body: JSON.stringify({ action: 'simulate_login' })
            });
            
            if (result.success) {
                const data = result.data.data || result.data;
                let content = `<strong>登入模擬結果:</strong><br>`;
                content += `用戶ID: ${data.user_id}<br>`;
                
                if (data.awarded_badges && data.awarded_badges.length > 0) {
                    content += `<strong>新獲得的徽章:</strong><br>`;
                    data.awarded_badges.forEach(badge => {
                        content += `• ${badge.name}<br>`;
                    });
                } else {
                    content += `沒有新徽章獲得<br>`;
                }
                
                showResult('simulateResult', content, 'success');
            } else {
                showResult('simulateResult', `模擬失敗: ${result.error || result.data?.message || '未知錯誤'}`, 'error');
            }
        }
        
        async function simulateUpload() {
            showResult('simulateResult', '模擬上傳中...', 'info');
            
            const result = await apiRequest(`${API_BASE}/badge-test.php`, {
                method: 'POST',
                body: JSON.stringify({ action: 'simulate_upload' })
            });
            
            if (result.success) {
                const data = result.data.data || result.data;
                const content = `
                    <strong>上傳模擬結果:</strong><br>
                    用戶ID: ${data.user_id}<br>
                    新徽章: ${data.awarded_badge || '無'}
                `;
                showResult('simulateResult', content, data.awarded_badge ? 'success' : 'info');
            } else {
                showResult('simulateResult', `模擬失敗: ${result.error || result.data?.message || '未知錯誤'}`, 'error');
            }
        }
        
        async function simulateProfile() {
            showResult('simulateResult', '模擬個人資料更新中...', 'info');
            
            const result = await apiRequest(`${API_BASE}/badge-test.php`, {
                method: 'POST',
                body: JSON.stringify({ action: 'simulate_profile' })
            });
            
            if (result.success) {
                const data = result.data.data || result.data;
                const content = `
                    <strong>個人資料模擬結果:</strong><br>
                    用戶ID: ${data.user_id}<br>
                    新徽章: ${data.awarded_badge || '無'}
                `;
                showResult('simulateResult', content, data.awarded_badge ? 'success' : 'info');
            } else {
                showResult('simulateResult', `模擬失敗: ${result.error || result.data?.message || '未知錯誤'}`, 'error');
            }
        }
        
        async function loadCurrentBadges() {
            const userId = getUserId();
            const result = await apiRequest(`${API_BASE}/student/badges.php?action=get&user_id=${userId}`);
            
            if (result.success) {
                const data = result.data.data || result.data;
                const badges = data.badges || [];
                
                let content = '<div class="row">';
                badges.forEach(badge => {
                    const earnedClass = badge.earned ? 'text-success' : 'text-muted';
                    const iconClass = badge.earned ? 'bi-star-fill' : 'bi-star';
                    
                    content += `
                        <div class="col-md-6 mb-2">
                            <div class="d-flex align-items-center">
                                <i class="bi ${iconClass} me-2 ${earnedClass}"></i>
                                <div>
                                    <strong class="${earnedClass}">${badge.name}</strong><br>
                                    <small class="text-muted">${badge.description}</small>
                                    ${badge.achieved_at ? `<br><small class="text-success">獲得於: ${badge.achieved_at}</small>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                });
                content += '</div>';
                
                document.getElementById('currentBadges').innerHTML = content;
            } else {
                document.getElementById('currentBadges').innerHTML = `<div class="alert alert-danger">載入徽章失敗: ${result.error || result.data?.message || '未知錯誤'}</div>`;
            }
        }
        
        // 頁面載入時自動載入用戶資訊和徽章
        window.onload = function() {
            loadUserInfo();
            loadCurrentBadges();
        };
    </script>
</body>
</html>
